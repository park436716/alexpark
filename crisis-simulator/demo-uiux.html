<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AI Crisis Simulator — UI/UX Demo</title>
<style>
  :root {
    --bad: #d92626;
    --good: #1a8a3d;
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #9aa0ab;
    --accent: #3b6ef0;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
  }
  .app { max-width: 1000px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 2px; }
  .subtitle { color: var(--muted); font-size: 12px; margin-bottom: 22px; }
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  /* ---------- Picker ---------- */
  .picker-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 14px;
  }
  .scenario-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px;
    cursor: pointer;
    transition: border-color .15s, transform .1s;
  }
  .scenario-card:hover { border-color: #4a5568; transform: translateY(-2px); }
  .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .industry-tag { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .difficulty-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-left: 6px; vertical-align: middle; }
  .diff-easy { background: var(--good); }
  .diff-medium { background: #d9a526; }
  .diff-hard { background: var(--bad); }
  .scenario-title { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .scenario-desc { font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
  .ref-case { font-size: 11px; color: #7a90d9; }
  .role-row { margin-top: 12px; display: flex; gap: 6px; align-items: center; }
  select, .btn-primary, .btn-secondary {
    font-family: inherit;
  }
  select {
    background: #14161b;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 12.5px;
  }

  /* ---------- Generic cards ---------- */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }

  /* ---------- Briefing ---------- */
  .briefing-phase { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .briefing-phase .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--bad); margin-right: 6px;
    animation: pulse 1.4s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  .briefing-role { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
  .briefing-context { font-size: 14px; line-height: 1.7; white-space: pre-wrap; margin-bottom: 16px; }
  .criteria-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  .criteria-pill { font-size: 11px; background: #2a2e37; color: var(--muted); padding: 4px 10px; border-radius: 999px; }

  /* ---------- Crisis room ---------- */
  .room-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 760px) { .room-grid { grid-template-columns: 1fr; } }

  .progress-track { height: 4px; background: #2a2e37; border-radius: 4px; margin-bottom: 16px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); transition: width .4s ease; }

  .phase-badge {
    display: inline-block; background: #2a2e37; color: var(--muted);
    font-size: 12px; padding: 4px 10px; border-radius: 999px; margin-bottom: 12px;
  }
  .context { white-space: pre-wrap; line-height: 1.6; font-size: 14px; }
  .case-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .case-tag { font-size: 11px; background: #2a2e37; color: var(--muted); padding: 3px 9px; border-radius: 999px; }

  .scoreboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .score-item { background: #14161b; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .score-label { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .score-value { font-size: 20px; font-weight: 700; margin: 3px 0; }
  .score-bar-bg { height: 6px; background: #2a2e37; border-radius: 4px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 4px; transition: width .5s ease; }
  .score-delta { font-size: 11px; margin-left: 6px; font-weight: 600; }
  .delta-up { color: var(--bad); }
  .delta-down { color: var(--good); }
  .delta-flash { animation: flash .8s ease; }
  @keyframes flash { 0% { background: #2a3a55; } 100% { background: #14161b; } }

  .stakeholder-mini { margin-top: 12px; }
  .stakeholder-mini-row { display: flex; gap: 8px; font-size: 12px; padding: 6px 0; border-top: 1px solid var(--border); }
  .stakeholder-mini-row:first-child { border-top: none; }
  .stakeholder-mini-name { color: var(--muted); min-width: 64px; font-weight: 600; }

  .options { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .option-btn {
    text-align: left; background: #14161b; border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 10px; cursor: pointer; font-size: 14px; line-height: 1.4;
  }
  .option-btn:hover { border-color: #4a5568; background: #1f2229; }
  .option-btn:disabled { opacity: .4; cursor: not-allowed; }
  .option-btn b { color: var(--muted); margin-right: 6px; }

  textarea {
    width: 100%; min-height: 64px; background: #14161b; border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); padding: 10px; font-size: 14px; resize: vertical; margin-top: 10px;
  }
  .btn-primary {
    background: var(--accent); color: white; border: none; padding: 10px 16px;
    border-radius: 8px; cursor: pointer; font-size: 14px; margin-top: 8px;
  }
  .btn-primary:hover { background: #2f5cd6; }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .btn-secondary {
    background: transparent; color: var(--muted); border: 1px solid var(--border);
    padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; margin-top: 8px; margin-left: 8px;
  }

  .loading-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; padding: 10px 0; }
  .spinner {
    width: 14px; height: 14px; border: 2px solid #2a2e37; border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Feedback ---------- */
  .feedback-score { font-size: 32px; font-weight: 800; }
  .tag-list { margin: 8px 0 14px; padding-left: 18px; font-size: 13px; line-height: 1.6; }
  .tag-list.strength li { color: #6fd08c; }
  .tag-list.weakness li { color: #f08a8a; }
  .quote-row {
    display: flex; gap: 10px; font-size: 13px; padding: 8px 0; border-top: 1px solid var(--border);
  }
  .quote-row:first-child { border-top: none; }
  .quote-name { color: var(--muted); min-width: 80px; font-weight: 600; }

  /* ---------- Debrief ---------- */
  .timeline-chart { display: flex; align-items: flex-end; gap: 4px; height: 90px; margin: 14px 0 6px; }
  .timeline-bar { flex: 1; border-radius: 4px 4px 0 0; background: var(--accent); position: relative; }
  .timeline-labels { display: flex; gap: 4px; font-size: 9.5px; color: var(--muted); text-align: center; }
  .timeline-labels span { flex: 1; }
  .diff-box { background: #14161b; border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-size: 13px; line-height: 1.6; margin-top: 6px; }
  .debrief-history { font-size: 13px; line-height: 1.7; }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="app">

<h1>AI Crisis Simulator</h1>
<div class="subtitle">UI/UX 데모 — 시나리오 선택 → 브리핑 → 위기대응 → 사후 보고서 (로컬 모의 평가, API 호출 없음)</div>

<!-- SCREEN 1: PICKER -->
<div class="screen active" id="screen-picker">
  <div class="picker-grid" id="picker-grid"></div>
</div>

<!-- SCREEN 2: BRIEFING -->
<div class="screen" id="screen-briefing">
  <div class="card">
    <div class="briefing-phase"><span class="live-dot"></span>PHASE 0 · T+0:00</div>
    <div class="briefing-role" id="briefing-role"></div>
    <div class="briefing-context" id="briefing-context"></div>
    <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">평가 기준</div>
    <div class="criteria-row">
      <span class="criteria-pill">속도</span>
      <span class="criteria-pill">공감</span>
      <span class="criteria-pill">법적 신중함</span>
      <span class="criteria-pill">이해관계자 신뢰</span>
      <span class="criteria-pill">장기 평판</span>
    </div>
    <button class="btn-primary" onclick="goToCrisisRoom()">대응 시작</button>
  </div>
</div>

<!-- SCREEN 3: CRISIS ROOM -->
<div class="screen" id="screen-room">
  <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
  <div class="room-grid">
    <div>
      <div class="card">
        <div class="phase-badge" id="phase-badge"></div>
        <div class="context" id="context-text"></div>
        <div class="case-tags" id="case-tags"></div>
      </div>

      <div class="card" id="decision-card">
        <div style="font-weight:600; margin-bottom:4px;">당신의 대응</div>
        <div class="options" id="option-list"></div>
        <textarea id="freetext" placeholder="또는 직접 대응 문안을 입력하세요..."></textarea>
        <div>
          <button class="btn-primary" id="submit-btn" onclick="submitFreetext()">제출</button>
        </div>
        <div class="loading-row hidden" id="loading-row">
          <div class="spinner"></div> 평가 중...
        </div>
      </div>

      <div class="card hidden" id="feedback-card">
        <div style="display:flex; align-items:baseline; gap:10px;">
          <div class="feedback-score" id="feedback-score"></div>
          <div style="color:var(--muted); font-size:13px;">/ 100 decision quality</div>
        </div>
        <div style="font-weight:600; font-size:13px; color:var(--good); margin-top:12px;">강점</div>
        <ul class="tag-list strength" id="strengths-list"></ul>
        <div style="font-weight:600; font-size:13px; color:var(--bad);">약점</div>
        <ul class="tag-list weakness" id="weaknesses-list"></ul>
        <div style="font-weight:600; font-size:13px; margin-bottom:4px;">이해관계자 반응</div>
        <div id="quote-list"></div>
        <div style="margin-top:14px; font-size:13px; color:var(--muted);">
          권장 다음 조치: <span id="recommended-action" style="color:var(--text);"></span>
        </div>
        <button class="btn-primary" onclick="nextPhase()" id="next-phase-btn">다음 국면으로</button>
      </div>
    </div>

    <div>
      <div class="card">
        <div style="font-weight:600; margin-bottom:10px; font-size:13px;">위기 상황판</div>
        <div class="scoreboard" id="scoreboard"></div>
        <div class="stakeholder-mini" id="stakeholder-mini"></div>
      </div>
    </div>
  </div>
</div>

<!-- SCREEN 4: DEBRIEF -->
<div class="screen" id="screen-debrief">
  <div class="card">
    <div style="font-weight:700; font-size:17px; margin-bottom:4px;">위기 종료</div>
    <div style="color:var(--muted); font-size:13px; margin-bottom:6px;" id="debrief-avg"></div>

    <div style="font-size:12px; color:var(--muted); margin-top:14px;">의사결정 품질 추이</div>
    <div class="timeline-chart" id="timeline-chart"></div>
    <div class="timeline-labels" id="timeline-labels"></div>

    <div style="font-size:12px; color:var(--muted); margin-top:18px;">실제 사례와 비교</div>
    <div class="diff-box" id="real-case-diff"></div>

    <div style="font-size:12px; color:var(--muted); margin-top:18px; margin-bottom:6px;">의사결정 이력</div>
    <div class="debrief-history" id="debrief-history"></div>

    <button class="btn-primary" onclick="location.reload()">처음부터 다시</button>
    <button class="btn-secondary" onclick="location.reload()">다른 시나리오 선택</button>
  </div>
</div>

</div>

<script>
const SCENARIOS = {
  united_like: {
    title: "Viral Passenger Removal Crisis",
    industry: "airline",
    difficulty: "medium",
    role: "Crisis Response Lead",
    referenceCase: "United Airlines, 2017",
    shortDesc: "강제 하차 영상이 SNS에서 확산되며 450만 조회수를 기록 중. 피해자가 부상을 입었다.",
    tags: ["viral_video", "injured_victim", "ceo_apology_pressure"],
    initial_context:
`승객 강제 하차 영상이 X와 TikTok에서 확산되고 있다.
2시간 만에 조회수 450만 회.
피해자는 병원 진료가 필요한 상태.
CEO는 아직 보고받지 않았다.
언론은 "회사 입장"을 요구하고 있다.`,
    options: [
      { key: "A", label: "사실관계 확인 전까지 무대응", quality: 25 },
      { key: "B", label: "운영상 불가피했다는 입장문 발표", quality: 35 },
      { key: "C", label: "피해자에게 사과하고 조사 착수 및 재발방지 약속", quality: 82 },
      { key: "D", label: "법무팀 검토 전 어떤 표현도 금지", quality: 40 },
    ],
  },
  starbucks_like: {
    title: "Frontline Bias Incident",
    industry: "retail / coffee",
    difficulty: "hard",
    role: "Head of Communications",
    referenceCase: "Starbucks, 2018",
    shortDesc: "매장 직원의 신고로 체포된 영상이 확산, 불매운동 해시태그가 트렌드에 진입했다.",
    tags: ["frontline_employee", "social_identity_issue", "brand_promise_conflict"],
    initial_context:
`매장 직원이 특정 인종 고객을 신고해 경찰이 출동, 체포 장면이 영상으로 확산 중.
SNS에서 불매운동 해시태그가 트렌드에 진입.
다른 매장 직원들은 "본사 지침이 없다"고 답변 중.`,
    options: [
      { key: "A", label: "해당 매장 직원의 개인 일탈로 규정", quality: 22 },
      { key: "B", label: "공개 사과 및 전 매장 편견 교육 실시 발표", quality: 85 },
      { key: "C", label: "법적 책임 검토 후 1주일 내 입장 발표", quality: 30 },
      { key: "D", label: "내부 조사 결과 발표까지 비공개 유지", quality: 28 },
    ],
  },
  recall_like: {
    title: "Product Safety Recall",
    industry: "consumer product",
    difficulty: "easy",
    role: "Product Safety Director",
    referenceCase: "Tylenol 1982 / Note7 2016",
    shortDesc: "제품 결함으로 인한 화재/오염 신고가 복수 국가에서 동시에 접수됐다.",
    tags: ["product_safety", "global_recall", "consumer_harm"],
    initial_context:
`제품 결함으로 인한 화재/오염 신고가 복수 국가에서 동시에 접수됨.
규제기관이 자발적 리콜 여부를 묻고 있음.
일부 매장은 이미 자체적으로 판매를 중단함.`,
    options: [
      { key: "A", label: "추가 조사 완료 전까지 판매 유지", quality: 18 },
      { key: "B", label: "전 세계 자발적 리콜 즉시 발표 및 환불/교환 제공", quality: 88 },
      { key: "C", label: "문제 지역에서만 한정적으로 리콜", quality: 45 },
      { key: "D", label: "결함을 공급업체 책임으로 발표", quality: 25 },
    ],
  },
};

const PHASES = ["0h_detection", "2h_initial_response", "6h_media_escalation", "24h_regulatory_attention", "72h_internal_accountability", "7d_recovery_plan"];
const INITIAL_SCORES = { reputation: 70, legal_risk: 30, media_pressure: 40, employee_trust: 60, regulatory_risk: 30, financial_risk: 25 };
const SCORE_META = {
  reputation: { label: "Reputation", goodHigh: true },
  legal_risk: { label: "Legal Risk", goodHigh: false },
  media_pressure: { label: "Media Pressure", goodHigh: false },
  employee_trust: { label: "Employee Trust", goodHigh: true },
  regulatory_risk: { label: "Regulatory Risk", goodHigh: false },
  financial_risk: { label: "Financial Risk", goodHigh: false },
};

let state = null;

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

// ---------- Picker ----------
const grid = document.getElementById("picker-grid");
Object.entries(SCENARIOS).forEach(([key, s]) => {
  const diffClass = s.difficulty === "easy" ? "diff-easy" : s.difficulty === "hard" ? "diff-hard" : "diff-medium";
  const card = document.createElement("div");
  card.className = "scenario-card";
  card.innerHTML = `
    <div class="card-top">
      <span class="industry-tag">${s.industry}</span>
      <span class="difficulty-dot ${diffClass}" title="${s.difficulty}"></span>
    </div>
    <div class="scenario-title">${s.title}</div>
    <div class="scenario-desc">${s.shortDesc}</div>
    <div class="ref-case">Reference: ${s.referenceCase}</div>
    <div class="role-row">
      <span style="font-size:11px;color:var(--muted);">Start as:</span>
      <select onclick="event.stopPropagation()">
        <option>${s.role}</option>
      </select>
    </div>
  `;
  card.onclick = () => selectScenario(key);
  grid.appendChild(card);
});

function selectScenario(key) {
  const scenario = SCENARIOS[key];
  state = {
    scenarioKey: key,
    phaseIndex: 0,
    scores: { ...INITIAL_SCORES },
    decisionHistory: [],
    currentContext: scenario.initial_context,
  };
  document.getElementById("briefing-role").textContent = `You are the ${scenario.role}.`;
  document.getElementById("briefing-context").textContent = scenario.initial_context;
  showScreen("screen-briefing");
}

function goToCrisisRoom() {
  showScreen("screen-room");
  document.getElementById("decision-card").classList.remove("hidden");
  document.getElementById("feedback-card").classList.add("hidden");
  renderPhase();
}

// ---------- Crisis room ----------
function renderPhase() {
  const scenario = SCENARIOS[state.scenarioKey];
  document.getElementById("progress-fill").style.width = `${((state.phaseIndex) / PHASES.length) * 100}%`;
  document.getElementById("phase-badge").textContent = `Phase ${state.phaseIndex + 1}/${PHASES.length} — ${PHASES[state.phaseIndex]}`;
  document.getElementById("context-text").textContent = state.currentContext;

  const tagsEl = document.getElementById("case-tags");
  tagsEl.innerHTML = "";
  scenario.tags.forEach(t => {
    const span = document.createElement("span");
    span.className = "case-tag";
    span.textContent = t;
    tagsEl.appendChild(span);
  });

  renderScoreboard();
  renderOptions();
}

function renderScoreboard(deltas) {
  const board = document.getElementById("scoreboard");
  board.innerHTML = "";
  Object.entries(state.scores).forEach(([key, value]) => {
    const meta = SCORE_META[key];
    const delta = deltas ? deltas[key + "_delta"] : null;
    const barColor = meta.goodHigh ? (value >= 50 ? "#1a8a3d" : "#d92626") : (value <= 50 ? "#1a8a3d" : "#d92626");

    let deltaHtml = "";
    if (delta) {
      const worse = meta.goodHigh ? delta < 0 : delta > 0;
      const cls = worse ? "delta-up" : "delta-down";
      const sign = delta > 0 ? "+" : "";
      const arrow = delta > 0 ? "&#9650;" : "&#9660;";
      deltaHtml = `<span class="score-delta ${cls}">${sign}${delta} ${arrow}</span>`;
    }

    const item = document.createElement("div");
    item.className = "score-item" + (delta ? " delta-flash" : "");
    item.innerHTML = `
      <div class="score-label">${meta.label}</div>
      <div class="score-value">${value}${deltaHtml}</div>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${value}%; background:${barColor};"></div></div>
    `;
    board.appendChild(item);
  });
}

function renderOptions() {
  const scenario = SCENARIOS[state.scenarioKey];
  const list = document.getElementById("option-list");
  list.innerHTML = "";
  scenario.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<b>${opt.key}.</b>${opt.label}`;
    btn.onclick = () => submitDecision(opt.label, opt.quality);
    list.appendChild(btn);
  });
  document.getElementById("freetext").value = "";
  setSubmitting(false);
}

function setSubmitting(isSubmitting) {
  document.querySelectorAll(".option-btn").forEach(b => b.disabled = isSubmitting);
  document.getElementById("submit-btn").disabled = isSubmitting;
  document.getElementById("freetext").disabled = isSubmitting;
  document.getElementById("loading-row").classList.toggle("hidden", !isSubmitting);
}

function mockEvaluate(decisionText, baseQuality) {
  let quality = baseQuality;
  if (quality === undefined) {
    quality = 50;
    const positive = ["사과", "사죄", "조사", "재발방지", "보상", "리콜", "책임", "협력"];
    const negative = ["무대응", "부인", "불가피", "규정대로", "비공개", "책임 없", "거부"];
    positive.forEach(w => { if (decisionText.includes(w)) quality += 8; });
    negative.forEach(w => { if (decisionText.includes(w)) quality -= 10; });
    quality = Math.max(5, Math.min(95, quality));
  }
  const goodness = (quality - 50) / 50;
  return {
    decision_quality: Math.round(quality),
    reputation_delta: Math.round(goodness * 14),
    legal_risk_delta: Math.round(-goodness * 10),
    media_pressure_delta: Math.round(-goodness * 12 + (quality < 40 ? 6 : 0)),
    employee_trust_delta: Math.round(goodness * 8),
    regulatory_risk_delta: Math.round(-goodness * 9),
    financial_risk_delta: Math.round(-goodness * 6),
    strengths: quality >= 60 ? ["피해자 중심 표현이 포함됨", "구체적인 다음 조치를 제시함"] : (quality >= 40 ? ["초기 대응 속도는 확보함"] : []),
    weaknesses: quality < 60 ? ["책임 인정이 불명확함", "보상/재발방지 계획이 약함"] : (quality < 80 ? ["보상 원칙이 구체적이지 않음"] : []),
    stakeholder_reactions: {
      media: quality >= 60 ? "사과의 진정성은 인정하나 후속 조치를 지켜보겠다는 입장" : "대응이 늦거나 회피적이라는 비판 보도가 늘고 있음",
      customers: quality >= 60 ? "피해자 보호 조치에 일부 안도하는 반응" : "신뢰 저하 및 불매 여론 확산",
      employees: quality >= 60 ? "회사의 명확한 기준 제시에 안정감을 느낌" : "현장 대응 기준이 불명확하다는 불만",
      regulators: quality >= 60 ? "자발적 조치를 긍정 평가, 경과 보고 요청" : "사실관계 보고와 제재 가능성을 시사",
      investors: quality >= 60 ? "단기 주가 영향은 제한적일 것으로 평가" : "추가 리스크에 대한 우려 표명",
    },
    next_context: buildNextContext(quality),
    recommended_next_action: quality >= 60
      ? "다음 업데이트 시간을 명시하고 보상/재발방지 계획을 구체화하세요."
      : "지금이라도 피해자 중심 사과와 사실확인 절차를 병행해 발표하세요.",
  };
}

function buildNextContext(quality) {
  const nextPhase = PHASES[Math.min(state.phaseIndex + 1, PHASES.length - 1)];
  if (quality >= 60) {
    return `[${nextPhase}] 초기 대응이 긍정적으로 평가되며 언론 압박이 다소 완화되고 있다. 다만 구체적인 보상안과 재발방지 계획에 대한 추가 질의가 이어지고 있다.`;
  }
  return `[${nextPhase}] 초기 대응이 미흡하다는 평가가 확산되며 추가 영상/증언이 새로 등장했다. 규제기관이 공식 질의서를 보낼 가능성이 거론되고 있다.`;
}

function submitDecision(text, quality) {
  setSubmitting(true);
  setTimeout(() => runEvaluation(text, quality), 700); // simulate latency
}

function submitFreetext() {
  const text = document.getElementById("freetext").value.trim();
  if (!text) { alert("대응 문안을 입력하거나 선택지를 클릭하세요."); return; }
  setSubmitting(true);
  setTimeout(() => runEvaluation(text, undefined), 700);
}

function runEvaluation(decisionText, quality) {
  const evaluation = mockEvaluate(decisionText, quality);
  state.decisionHistory.push({ phase: PHASES[state.phaseIndex], text: decisionText, quality: evaluation.decision_quality });

  Object.keys(SCORE_META).forEach(key => {
    const delta = evaluation[key + "_delta"] || 0;
    state.scores[key] = Math.max(0, Math.min(100, state.scores[key] + delta));
  });
  state.currentContext = evaluation.next_context;

  renderFeedback(evaluation);
  renderScoreboard(evaluation);
  renderStakeholderMini(evaluation);

  document.getElementById("decision-card").classList.add("hidden");
  document.getElementById("feedback-card").classList.remove("hidden");

  const isLast = state.phaseIndex >= PHASES.length - 1;
  document.getElementById("next-phase-btn").textContent = isLast ? "사후 보고서 보기" : "다음 국면으로";
}

function renderFeedback(evaluation) {
  document.getElementById("feedback-score").textContent = evaluation.decision_quality;
  document.getElementById("feedback-score").style.color = evaluation.decision_quality >= 60 ? "var(--good)" : "var(--bad)";

  document.getElementById("strengths-list").innerHTML = evaluation.strengths.map(s => `<li>${s}</li>`).join("") || "<li>—</li>";
  document.getElementById("weaknesses-list").innerHTML = evaluation.weaknesses.map(s => `<li>${s}</li>`).join("") || "<li>—</li>";

  const quoteList = document.getElementById("quote-list");
  quoteList.innerHTML = "";
  Object.entries(evaluation.stakeholder_reactions).forEach(([who, text]) => {
    const row = document.createElement("div");
    row.className = "quote-row";
    row.innerHTML = `<span class="quote-name">${who}</span><span>"${text}"</span>`;
    quoteList.appendChild(row);
  });

  document.getElementById("recommended-action").textContent = evaluation.recommended_next_action;
}

function renderStakeholderMini(evaluation) {
  const mini = document.getElementById("stakeholder-mini");
  mini.innerHTML = `<div style="font-weight:600; font-size:12px; margin-bottom:6px;">최근 반응</div>`;
  Object.entries(evaluation.stakeholder_reactions).forEach(([who, text]) => {
    const row = document.createElement("div");
    row.className = "stakeholder-mini-row";
    row.innerHTML = `<span class="stakeholder-mini-name">${who}</span><span>${text}</span>`;
    mini.appendChild(row);
  });
}

function nextPhase() {
  state.phaseIndex += 1;
  document.getElementById("feedback-card").classList.add("hidden");

  if (state.phaseIndex >= PHASES.length) {
    renderDebrief();
    return;
  }
  document.getElementById("decision-card").classList.remove("hidden");
  renderPhase();
}

function renderDebrief() {
  showScreen("screen-debrief");
  const avgQuality = Math.round(state.decisionHistory.reduce((a, d) => a + d.quality, 0) / state.decisionHistory.length);
  document.getElementById("debrief-avg").textContent = `평균 의사결정 품질: ${avgQuality}/100 · ${SCENARIOS[state.scenarioKey].title}`;

  const chart = document.getElementById("timeline-chart");
  const labels = document.getElementById("timeline-labels");
  chart.innerHTML = "";
  labels.innerHTML = "";
  state.decisionHistory.forEach(d => {
    const bar = document.createElement("div");
    bar.className = "timeline-bar";
    bar.style.height = `${Math.max(6, d.quality)}%`;
    bar.style.background = d.quality >= 60 ? "var(--good)" : "var(--bad)";
    bar.title = `${d.phase}: ${d.quality}`;
    chart.appendChild(bar);

    const label = document.createElement("span");
    label.textContent = d.phase.split("_")[0];
    labels.appendChild(label);
  });

  const scenario = SCENARIOS[state.scenarioKey];
  document.getElementById("real-case-diff").textContent =
    `당신의 평균 대응 품질은 ${avgQuality}점입니다. 참고 사례(${scenario.referenceCase})는 ` +
    (avgQuality >= 60
      ? "초기 사과는 늦었지만 장기적으로 보상과 정책 변경을 통해 신뢰를 회복했습니다. 당신은 더 빠르게 피해자 중심 대응을 했습니다."
      : "유사하게 초기 대응에서 방어적 표현을 사용해 여론이 악화된 적이 있습니다. 다음 시도에서는 피해자 인지와 사실확인을 함께 제시해보세요.");

  document.getElementById("debrief-history").innerHTML = state.decisionHistory
    .map(d => `<div style="margin-bottom:6px;"><b>${d.phase}</b> (${d.quality}점) — ${d.text}</div>`)
    .join("");
}
</script>
