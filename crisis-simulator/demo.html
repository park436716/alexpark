<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AI Crisis Simulator — Demo</title>
<style>
  :root {
    --bad: #d92626;
    --good: #1a8a3d;
    --bg: #0f1115;
    --card: #1a1d24;
    --border: #2a2e37;
    --text: #e8e9ec;
    --muted: #9aa0ab;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 24px;
    max-width: 920px;
    margin: 0 auto;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .phase-badge {
    display: inline-block;
    background: #2a2e37;
    color: var(--muted);
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .context {
    white-space: pre-wrap;
    line-height: 1.6;
    font-size: 14px;
  }
  .scoreboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .score-item {
    background: #14161b;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .score-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
  .score-value { font-size: 22px; font-weight: 700; margin: 4px 0; }
  .score-bar-bg { height: 6px; background: #2a2e37; border-radius: 4px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 4px; transition: width .4s ease; }
  .score-delta { font-size: 11px; margin-left: 6px; }
  .delta-up { color: var(--bad); }
  .delta-down { color: var(--good); }

  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 14px;
  }
  .option-btn {
    text-align: left;
    background: #14161b;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    line-height: 1.4;
  }
  .option-btn:hover { border-color: #4a5568; background: #1f2229; }
  .option-btn b { color: var(--muted); margin-right: 6px; }

  textarea {
    width: 100%;
    min-height: 70px;
    background: #14161b;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    padding: 10px;
    font-size: 14px;
    resize: vertical;
    margin-top: 10px;
  }
  .btn-primary {
    background: #3b6ef0;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 8px;
  }
  .btn-primary:hover { background: #2f5cd6; }
  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    margin-top: 8px;
    margin-left: 8px;
  }

  .feedback-score {
    font-size: 32px;
    font-weight: 800;
  }
  .tag-list { margin: 10px 0; padding-left: 18px; font-size: 13px; line-height: 1.6; }
  .tag-list.strength li { color: #6fd08c; }
  .tag-list.weakness li { color: #f08a8a; }

  .stakeholder-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 8px;
    margin-top: 8px;
  }
  .stakeholder-row {
    display: flex;
    gap: 10px;
    font-size: 13px;
    background: #14161b;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 12px;
  }
  .stakeholder-name { color: var(--muted); min-width: 80px; font-weight: 600; }

  .case-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .case-tag {
    font-size: 11px;
    background: #2a2e37;
    color: var(--muted);
    padding: 3px 9px;
    border-radius: 999px;
  }

  .hidden { display: none; }
  .debrief-list { font-size: 13px; line-height: 1.7; }
  select {
    background: #14161b;
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 14px;
    margin-bottom: 16px;
  }
</style>
</head>
<body>

<h1>AI Crisis Simulator</h1>
<div class="subtitle">위기 의사결정 시뮬레이션 데모 (로컬 모의 평가, API 호출 없음)</div>

<div id="scenario-select-screen">
  <div class="card">
    <div style="margin-bottom:10px; font-weight:600;">시나리오 선택</div>
    <select id="scenario-picker"></select>
    <div>
      <button class="btn-primary" onclick="startSimulation()">시뮬레이션 시작</button>
    </div>
  </div>
</div>

<div id="sim-screen" class="hidden">

  <div class="card">
    <div class="phase-badge" id="phase-badge"></div>
    <div class="context" id="context-text"></div>
    <div class="case-tags" id="case-tags"></div>
  </div>

  <div class="card">
    <div style="font-weight:600; margin-bottom:10px;">위기 상황판</div>
    <div class="scoreboard" id="scoreboard"></div>
  </div>

  <div class="card" id="decision-card">
    <div style="font-weight:600; margin-bottom:4px;">당신의 대응</div>
    <div class="options" id="option-list"></div>
    <textarea id="freetext" placeholder="또는 직접 대응 문안을 입력하세요..."></textarea>
    <div>
      <button class="btn-primary" onclick="submitFreetext()">제출</button>
    </div>
  </div>

  <div class="card hidden" id="feedback-card">
    <div style="display:flex; align-items:baseline; gap:10px;">
      <div class="feedback-score" id="feedback-score"></div>
      <div style="color:var(--muted); font-size:13px;">/ 100 decision quality</div>
    </div>

    <div style="margin-top:14px;">
      <div style="font-weight:600; font-size:13px; color:var(--good);">강점</div>
      <ul class="tag-list strength" id="strengths-list"></ul>
      <div style="font-weight:600; font-size:13px; color:var(--bad);">약점</div>
      <ul class="tag-list weakness" id="weaknesses-list"></ul>
    </div>

    <div style="margin-top:10px;">
      <div style="font-weight:600; font-size:13px; margin-bottom:6px;">이해관계자 반응</div>
      <div class="stakeholder-grid" id="stakeholder-grid"></div>
    </div>

    <div style="margin-top:14px; font-size:13px; color:var(--muted);">
      권장 다음 조치: <span id="recommended-action" style="color:var(--text);"></span>
    </div>

    <button class="btn-primary" onclick="nextPhase()" id="next-phase-btn">다음 국면으로</button>
  </div>

  <div class="card hidden" id="debrief-card">
    <div style="font-weight:600; font-size:16px; margin-bottom:10px;">사후 보고서 (Debrief)</div>
    <div class="debrief-list" id="debrief-content"></div>
    <button class="btn-secondary" onclick="location.reload()">처음부터 다시</button>
  </div>

</div>

<script>
// ---------------------------------------------------------------------------
// Seed scenarios (mirrors backend/app/services/scenario_generator.py + us_cases.yaml)
// ---------------------------------------------------------------------------
const SCENARIOS = {
  united_like: {
    title: "Viral Passenger Removal Crisis (United형)",
    industry: "airline",
    crisis_type: "customer_abuse",
    reference_cases: ["united_2017"],
    tags: ["viral_video", "injured_victim", "ceo_apology_pressure"],
    initial_context:
`상황:
승객 강제 하차 영상이 X와 TikTok에서 확산되고 있다.
2시간 만에 조회수 450만 회.
피해자는 병원 진료가 필요한 상태.
CEO는 아직 보고받지 않았다.
언론은 "회사 입장"을 요구하고 있다.
당신은 위기대응팀장이다.`,
    options: [
      { key: "A", label: "사실관계 확인 전까지 무대응", quality: 25 },
      { key: "B", label: "운영상 불가피했다는 입장문 발표", quality: 35 },
      { key: "C", label: "피해자에게 사과하고 조사 착수 및 재발방지 약속", quality: 82 },
      { key: "D", label: "법무팀 검토 전 어떤 표현도 금지", quality: 40 },
    ],
  },
  starbucks_like: {
    title: "Frontline Bias Incident (Starbucks형)",
    industry: "retail/coffee",
    crisis_type: "racial_bias",
    reference_cases: ["starbucks_2018"],
    tags: ["frontline_employee", "social_identity_issue", "brand_promise_conflict"],
    initial_context:
`상황:
매장 직원이 특정 인종 고객을 신고해 경찰이 출동, 체포 장면이 영상으로 확산 중.
SNS에서 불매운동 해시태그가 트렌드에 진입.
다른 매장 직원들은 "본사 지침이 없다"고 답변 중.
당신은 본사 커뮤니케이션 책임자다.`,
    options: [
      { key: "A", label: "해당 매장 직원의 개인 일탈로 규정", quality: 22 },
      { key: "B", label: "공개 사과 및 전 매장 편견 교육 실시 발표", quality: 85 },
      { key: "C", label: "법적 책임 검토 후 1주일 내 입장 발표", quality: 30 },
      { key: "D", label: "내부 조사 결과 발표까지 비공개 유지", quality: 28 },
    ],
  },
  recall_like: {
    title: "Product Safety Recall (Tylenol/Note7형)",
    industry: "consumer_product",
    crisis_type: "product_safety",
    reference_cases: ["tylenol_1982", "samsung_note7_2016"],
    tags: ["product_safety", "global_recall", "consumer_harm"],
    initial_context:
`상황:
제품 결함으로 인한 화재/오염 신고가 복수 국가에서 동시에 접수됨.
규제기관이 자발적 리콜 여부를 묻고 있음.
일부 매장은 이미 자체적으로 판매를 중단함.
당신은 제품안전 위기대응 총괄이다.`,
    options: [
      { key: "A", label: "추가 조사 완료 전까지 판매 유지", quality: 18 },
      { key: "B", label: "전 세계 자발적 리콜 즉시 발표 및 환불/교환 제공", quality: 88 },
      { key: "C", label: "문제 지역에서만 한정적으로 리콜", quality: 45 },
      { key: "D", label: "결함을 공급업체 책임으로 발표", quality: 25 },
    ],
  },
};

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const PHASES = [
  "0h_detection",
  "2h_initial_response",
  "6h_media_escalation",
  "24h_regulatory_attention",
  "72h_internal_accountability",
  "7d_recovery_plan",
];

const INITIAL_SCORES = {
  reputation: 70,
  legal_risk: 30,
  media_pressure: 40,
  employee_trust: 60,
  regulatory_risk: 30,
  financial_risk: 25,
};

const SCORE_META = {
  reputation: { label: "Reputation", goodHigh: true },
  legal_risk: { label: "Legal Risk", goodHigh: false },
  media_pressure: { label: "Media Pressure", goodHigh: false },
  employee_trust: { label: "Employee Trust", goodHigh: true },
  regulatory_risk: { label: "Regulatory Risk", goodHigh: false },
  financial_risk: { label: "Financial Risk", goodHigh: false },
};

let state = null;

// ---------------------------------------------------------------------------
// Scenario picker
// ---------------------------------------------------------------------------
const picker = document.getElementById("scenario-picker");
Object.entries(SCENARIOS).forEach(([key, s]) => {
  const opt = document.createElement("option");
  opt.value = key;
  opt.textContent = s.title;
  picker.appendChild(opt);
});

function startSimulation() {
  const key = picker.value;
  const scenario = SCENARIOS[key];
  state = {
    scenarioKey: key,
    phaseIndex: 0,
    scores: { ...INITIAL_SCORES },
    decisionHistory: [],
    currentContext: scenario.initial_context,
    lastDecisionQuality: null,
  };
  document.getElementById("scenario-select-screen").classList.add("hidden");
  document.getElementById("sim-screen").classList.remove("hidden");
  document.getElementById("debrief-card").classList.add("hidden");
  document.getElementById("decision-card").classList.remove("hidden");
  document.getElementById("feedback-card").classList.add("hidden");
  renderPhase();
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
function renderPhase() {
  const scenario = SCENARIOS[state.scenarioKey];
  document.getElementById("phase-badge").textContent =
    `Phase ${state.phaseIndex + 1}/${PHASES.length} — ${PHASES[state.phaseIndex]}`;
  document.getElementById("context-text").textContent = state.currentContext;

  const tagsEl = document.getElementById("case-tags");
  tagsEl.innerHTML = "";
  scenario.tags.forEach(t => {
    const span = document.createElement("span");
    span.className = "case-tag";
    span.textContent = t;
    tagsEl.appendChild(span);
  });

  renderScoreboard();
  renderOptions();
}

function renderScoreboard(deltas) {
  const board = document.getElementById("scoreboard");
  board.innerHTML = "";
  Object.entries(state.scores).forEach(([key, value]) => {
    const meta = SCORE_META[key];
    const delta = deltas ? deltas[key + "_delta"] : null;

    const item = document.createElement("div");
    item.className = "score-item";

    const isBad = meta.goodHigh ? false : true; // for color of bar
    const barColor = meta.goodHigh
      ? (value >= 50 ? "#1a8a3d" : "#d92626")
      : (value <= 50 ? "#1a8a3d" : "#d92626");

    let deltaHtml = "";
    if (delta) {
      const worse = meta.goodHigh ? delta < 0 : delta > 0;
      const cls = worse ? "delta-up" : "delta-down";
      const sign = delta > 0 ? "+" : "";
      deltaHtml = `<span class="score-delta ${cls}">${sign}${delta}</span>`;
    }

    item.innerHTML = `
      <div class="score-label">${meta.label}</div>
      <div class="score-value">${value}${deltaHtml}</div>
      <div class="score-bar-bg"><div class="score-bar-fill" style="width:${value}%; background:${barColor};"></div></div>
    `;
    board.appendChild(item);
  });
}

function renderOptions() {
  const scenario = SCENARIOS[state.scenarioKey];
  const list = document.getElementById("option-list");
  list.innerHTML = "";
  scenario.options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "option-btn";
    btn.innerHTML = `<b>${opt.key}.</b>${opt.label}`;
    btn.onclick = () => submitDecision(opt.label, opt.quality);
    list.appendChild(btn);
  });
  document.getElementById("freetext").value = "";
}

// ---------------------------------------------------------------------------
// Mock evaluator (mirrors backend evaluator.py logic, run locally for demo)
// ---------------------------------------------------------------------------
function mockEvaluate(decisionText, baseQuality) {
  // crude heuristic for freetext: reward empathy/apology/recall keywords, penalize denial/silence
  let quality = baseQuality;
  if (quality === undefined) {
    quality = 50;
    const positive = ["사과", "사죄", "조사", "재발방지", "보상", "리콜", "책임", "협력"];
    const negative = ["무대응", "부인", "불가피", "규정대로", "비공개", "책임 없", "거부"];
    positive.forEach(w => { if (decisionText.includes(w)) quality += 8; });
    negative.forEach(w => { if (decisionText.includes(w)) quality -= 10; });
    quality = Math.max(5, Math.min(95, quality));
  }

  const goodness = (quality - 50) / 50; // -1..1

  const evaluation = {
    decision_quality: Math.round(quality),
    reputation_delta: Math.round(goodness * 14),
    legal_risk_delta: Math.round(-goodness * 10),
    media_pressure_delta: Math.round(-goodness * 12 + (quality < 40 ? 6 : 0)),
    employee_trust_delta: Math.round(goodness * 8),
    regulatory_risk_delta: Math.round(-goodness * 9),
    financial_risk_delta: Math.round(-goodness * 6),
    strengths: quality >= 60
      ? ["피해자 중심 표현이 포함됨", "구체적인 다음 조치를 제시함"]
      : (quality >= 40 ? ["초기 대응 속도는 확보함"] : []),
    weaknesses: quality < 60
      ? ["책임 인정이 불명확함", "보상/재발방지 계획이 약함"]
      : (quality < 80 ? ["보상 원칙이 구체적이지 않음"] : []),
    stakeholder_reactions: {
      media: quality >= 60 ? "사과의 진정성은 인정하나 후속 조치를 지켜보겠다는 입장" : "대응이 늦거나 회피적이라는 비판 보도가 늘고 있음",
      customers: quality >= 60 ? "피해자 보호 조치에 일부 안도하는 반응" : "신뢰 저하 및 불매 여론 확산",
      employees: quality >= 60 ? "회사의 명확한 기준 제시에 안정감을 느낌" : "현장 대응 기준이 불명확하다는 불만",
      regulators: quality >= 60 ? "자발적 조치를 긍정 평가, 경과 보고 요청" : "사실관계 보고와 제재 가능성을 시사",
      investors: quality >= 60 ? "단기 주가 영향은 제한적일 것으로 평가" : "추가 리스크에 대한 우려 표명",
    },
    next_context: buildNextContext(quality),
    recommended_next_action: quality >= 60
      ? "다음 업데이트 시간을 명시하고 보상/재발방지 계획을 구체화하세요."
      : "지금이라도 피해자 중심 사과와 사실확인 절차를 병행해 발표하세요.",
  };
  return evaluation;
}

function buildNextContext(quality) {
  const nextPhase = PHASES[Math.min(state.phaseIndex + 1, PHASES.length - 1)];
  if (quality >= 60) {
    return `[${nextPhase}] 초기 대응이 긍정적으로 평가되며 언론 압박이 다소 완화되고 있다. 다만 구체적인 보상안과 재발방지 계획에 대한 추가 질의가 이어지고 있다.`;
  }
  return `[${nextPhase}] 초기 대응이 미흡하다는 평가가 확산되며 추가 영상/증언이 새로 등장했다. 규제기관이 공식 질의서를 보낼 가능성이 거론되고 있다.`;
}

// ---------------------------------------------------------------------------
// Decision flow
// ---------------------------------------------------------------------------
function submitDecision(text, quality) {
  runEvaluation(text, quality);
}

function submitFreetext() {
  const text = document.getElementById("freetext").value.trim();
  if (!text) {
    alert("대응 문안을 입력하거나 선택지를 클릭하세요.");
    return;
  }
  runEvaluation(text, undefined);
}

function runEvaluation(decisionText, quality) {
  const evaluation = mockEvaluate(decisionText, quality);
  state.decisionHistory.push({ phase: PHASES[state.phaseIndex], text: decisionText, quality: evaluation.decision_quality });

  // apply score deltas
  Object.keys(SCORE_META).forEach(key => {
    const delta = evaluation[key + "_delta"] || 0;
    state.scores[key] = Math.max(0, Math.min(100, state.scores[key] + delta));
  });
  state.currentContext = evaluation.next_context;

  renderFeedback(evaluation);
  renderScoreboard(evaluation);

  document.getElementById("decision-card").classList.add("hidden");
  document.getElementById("feedback-card").classList.remove("hidden");

  const isLast = state.phaseIndex >= PHASES.length - 1;
  document.getElementById("next-phase-btn").textContent = isLast ? "사후 보고서 보기" : "다음 국면으로";
}

function renderFeedback(evaluation) {
  document.getElementById("feedback-score").textContent = evaluation.decision_quality;
  document.getElementById("feedback-score").style.color =
    evaluation.decision_quality >= 60 ? "var(--good)" : "var(--bad)";

  const sList = document.getElementById("strengths-list");
  sList.innerHTML = evaluation.strengths.map(s => `<li>${s}</li>`).join("") || "<li>—</li>";
  const wList = document.getElementById("weaknesses-list");
  wList.innerHTML = evaluation.weaknesses.map(s => `<li>${s}</li>`).join("") || "<li>—</li>";

  const grid = document.getElementById("stakeholder-grid");
  grid.innerHTML = "";
  Object.entries(evaluation.stakeholder_reactions).forEach(([who, text]) => {
    const row = document.createElement("div");
    row.className = "stakeholder-row";
    row.innerHTML = `<span class="stakeholder-name">${who}</span><span>${text}</span>`;
    grid.appendChild(row);
  });

  document.getElementById("recommended-action").textContent = evaluation.recommended_next_action;
}

function nextPhase() {
  state.phaseIndex += 1;
  document.getElementById("feedback-card").classList.add("hidden");

  if (state.phaseIndex >= PHASES.length) {
    renderDebrief();
    return;
  }
  document.getElementById("decision-card").classList.remove("hidden");
  renderPhase();
}

function renderDebrief() {
  document.getElementById("sim-screen").querySelectorAll(".card").forEach(c => c.classList.add("hidden"));
  const debriefCard = document.getElementById("debrief-card");
  debriefCard.classList.remove("hidden");

  const avgQuality = Math.round(
    state.decisionHistory.reduce((a, d) => a + d.quality, 0) / state.decisionHistory.length
  );

  const finalScores = Object.entries(state.scores)
    .map(([k, v]) => `<li>${SCORE_META[k].label}: ${v}</li>`)
    .join("");

  const history = state.decisionHistory
    .map(d => `<li><b>${d.phase}</b> (quality ${d.quality}): ${d.text}</li>`)
    .join("");

  document.getElementById("debrief-content").innerHTML = `
    <p><b>평균 의사결정 품질:</b> ${avgQuality}/100</p>
    <p><b>최종 점수</b></p>
    <ul>${finalScores}</ul>
    <p><b>의사결정 이력</b></p>
    <ul>${history}</ul>
    <p style="color:var(--muted); margin-top:10px; font-size:12px;">
      이 데모는 로컬 휴리스틱으로 평가를 모의 생성합니다. 실제 서비스는
      backend/app/llm/openai_client.py 의 OpenAI Structured Outputs 평가기로 대체됩니다.
    </p>
  `;
}
</script>
