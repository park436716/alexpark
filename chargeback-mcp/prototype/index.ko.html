<title>차지백 트리아지 — 프로토타입</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --ground: #F5F6F8;
    --surface: #FFFFFF;
    --surface-2: #FAFBFC;
    --ink: #0E1420;
    --ink-2: #2B3444;
    --muted: #5B6577;
    --hairline: #EEF0F3;
    --border: #DFE3EA;
    --accent: #2F5FE0;
    --accent-ink: #FFFFFF;
    --accent-tint: #EAF0FE;
    --focus: #2F5FE0;

    --cat-fraud: #B23A48;
    --cat-fraud-tint: #FCEEF0;
    --cat-auth: #B67B00;
    --cat-auth-tint: #FBF3E1;
    --cat-proc: #5E5B7B;
    --cat-proc-tint: #EEEDF5;
    --cat-consumer: #2F7A5E;
    --cat-consumer-tint: #E8F3EE;

    --net-visa: #1A1F71;
    --net-mc:   #B8001A;
    --net-amex: #2E77BB;

    --shadow-1: 0 1px 0 rgba(14,20,32,.03), 0 1px 2px rgba(14,20,32,.04);
    --shadow-2: 0 2px 4px rgba(14,20,32,.04), 0 8px 24px rgba(14,20,32,.06);

    --radius: 10px;
    --radius-sm: 6px;

    --font-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", "Noto Sans KR", "Segoe UI", system-ui, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    --font-serif: "Nanum Myeongjo", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #0B0F17;
      --surface: #141A25;
      --surface-2: #10151E;
      --ink: #E7EAF0;
      --ink-2: #C1C7D2;
      --muted: #8A93A3;
      --hairline: #1A2130;
      --border: #232B3D;
      --accent: #7A9BFF;
      --accent-ink: #0B0F17;
      --accent-tint: #1A2340;
      --focus: #7A9BFF;

      --cat-fraud: #E88893;
      --cat-fraud-tint: #2B1519;
      --cat-auth: #E5B457;
      --cat-auth-tint: #2A2210;
      --cat-proc: #A8A4C7;
      --cat-proc-tint: #1E1B2B;
      --cat-consumer: #7BC3A2;
      --cat-consumer-tint: #14251E;

      --net-visa: #6C74C7;
      --net-mc:   #E86775;
      --net-amex: #6FA9DF;

      --shadow-1: 0 1px 0 rgba(0,0,0,.4);
      --shadow-2: 0 2px 4px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --ground: #0B0F17;
    --surface: #141A25;
    --surface-2: #10151E;
    --ink: #E7EAF0;
    --ink-2: #C1C7D2;
    --muted: #8A93A3;
    --hairline: #1A2130;
    --border: #232B3D;
    --accent: #7A9BFF;
    --accent-ink: #0B0F17;
    --accent-tint: #1A2340;
    --focus: #7A9BFF;

    --cat-fraud: #E88893;
    --cat-fraud-tint: #2B1519;
    --cat-auth: #E5B457;
    --cat-auth-tint: #2A2210;
    --cat-proc: #A8A4C7;
    --cat-proc-tint: #1E1B2B;
    --cat-consumer: #7BC3A2;
    --cat-consumer-tint: #14251E;

    --net-visa: #6C74C7;
    --net-mc:   #E86775;
    --net-amex: #6FA9DF;

    --shadow-1: 0 1px 0 rgba(0,0,0,.4);
    --shadow-2: 0 2px 4px rgba(0,0,0,.3), 0 12px 32px rgba(0,0,0,.35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    word-break: keep-all;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }

  .app { display: grid; grid-template-rows: auto 1fr; min-height: 100vh; }

  header.top {
    position: sticky; top: 0; z-index: 10;
    background: color-mix(in srgb, var(--surface) 92%, transparent);
    backdrop-filter: saturate(140%) blur(8px);
    -webkit-backdrop-filter: saturate(140%) blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex; align-items: center; gap: 24px;
  }
  .wordmark { display: flex; align-items: baseline; gap: 10px; }
  .wordmark .glyph {
    font-family: var(--font-serif);
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .wordmark .glyph em { font-style: normal; color: var(--accent); font-weight: 600; }
  .wordmark .kicker {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .top .spacer { flex: 1; }
  .legend {
    display: flex; gap: 14px; align-items: center;
    font-size: 12px; color: var(--muted);
  }
  .legend .chip { display: inline-flex; align-items: center; gap: 6px; }
  .legend .swatch { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }
  .swatch.visa { background: var(--net-visa); }
  .swatch.mc   { background: var(--net-mc); }
  .swatch.amex { background: var(--net-amex); }
  .theme-toggle {
    font: inherit; font-size: 12px;
    color: var(--muted); background: transparent; border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 999px; cursor: pointer;
  }
  .theme-toggle:hover { color: var(--ink); border-color: var(--ink-2); }

  main {
    display: grid;
    grid-template-columns: 360px 1fr;
    gap: 24px;
    padding: 24px;
    max-width: 1400px;
    width: 100%;
    margin: 0 auto;
  }
  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; }
  }

  aside.rail {
    display: flex; flex-direction: column; gap: 16px;
    align-self: start;
    position: sticky; top: 72px;
  }
  @media (max-width: 960px) { aside.rail { position: static; } }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    box-shadow: var(--shadow-1);
  }
  .panel h2 {
    margin: 0 0 12px 0;
    font-size: 12px;
    letter-spacing: 0.12em;
    color: var(--muted);
    font-weight: 700;
  }

  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  textarea, input[type="text"], select {
    width: 100%;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--ink);
    border-radius: var(--radius-sm);
    font: inherit;
    font-size: 13.5px;
  }
  textarea { min-height: 88px; resize: vertical; }
  textarea:focus, input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-tint);
  }

  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }

  button.primary {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 14px;
    background: var(--accent);
    color: var(--accent-ink);
    border: 1px solid var(--accent);
    border-radius: var(--radius-sm);
    font: inherit; font-weight: 600; font-size: 13.5px;
    cursor: pointer;
    transition: transform .06s ease;
  }
  button.primary:hover { filter: brightness(1.02); }
  button.primary:active { transform: translateY(1px); }
  button.ghost {
    padding: 8px 12px;
    background: transparent; color: var(--ink-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font: inherit; font-size: 12.5px;
    cursor: pointer;
  }
  button.ghost:hover { border-color: var(--ink-2); }

  .stack { display: flex; flex-direction: column; gap: 12px; }
  .field-stack { display: flex; flex-direction: column; gap: 10px; }

  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .filter-chip {
    font-size: 12px;
    padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2);
    color: var(--muted); cursor: pointer; letter-spacing: .01em;
  }
  .filter-chip[aria-pressed="true"] {
    background: var(--accent-tint); border-color: var(--accent); color: var(--accent);
    font-weight: 600;
  }
  .filter-chip:hover { border-color: var(--ink-2); color: var(--ink-2); }

  .quick-help {
    font-size: 12px; color: var(--muted);
    padding-top: 4px;
  }
  .quick-help code {
    font-family: var(--font-mono); font-size: 11.5px;
    background: var(--surface-2); border: 1px solid var(--border);
    padding: 1px 5px; border-radius: 4px; color: var(--ink-2);
  }

  section.results { display: flex; flex-direction: column; gap: 18px; min-width: 0; }

  .result-meta {
    display: flex; align-items: center; justify-content: space-between;
    color: var(--muted); font-size: 12px;
  }
  .result-meta .count {
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
    color: var(--ink-2);
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-1);
    overflow: hidden;
    display: grid;
    grid-template-columns: 4px 1fr;
  }
  .card .stripe { background: var(--border); }
  .card.net-visa .stripe { background: var(--net-visa); }
  .card.net-mc   .stripe { background: var(--net-mc); }
  .card.net-amex .stripe { background: var(--net-amex); }
  .card.net-comparison .stripe {
    background: linear-gradient(180deg, var(--net-visa) 0%, var(--net-visa) 33%, var(--net-mc) 33%, var(--net-mc) 66%, var(--net-amex) 66%, var(--net-amex) 100%);
  }
  .card .body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }

  .card-header {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;
  }
  .card-title {
    font-size: 15.5px; font-weight: 700; color: var(--ink); margin: 0;
    text-wrap: balance; letter-spacing: -0.005em;
  }
  .card-sub {
    font-size: 11.5px; color: var(--muted);
    letter-spacing: 0.02em; margin-top: 4px;
  }
  .card-score {
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    white-space: nowrap;
  }

  .question {
    font-size: 13.5px; color: var(--ink-2);
    padding: 12px 14px;
    background: var(--surface-2);
    border-left: 2px solid var(--border);
    border-radius: 4px;
    line-height: 1.6;
  }
  .question .q-mark {
    font-family: var(--font-serif); font-size: 16px;
    color: var(--muted); margin-right: 6px; font-weight: 700;
  }

  .answer-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 14px;
    row-gap: 10px;
    align-items: baseline;
    font-size: 13.5px;
  }
  .answer-grid dt {
    color: var(--muted);
    font-size: 11.5px; letter-spacing: 0.04em;
    font-weight: 700;
    padding-top: 2px;
    white-space: nowrap;
  }
  .answer-grid dd { margin: 0; color: var(--ink); }

  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .code-pill {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 4px;
    background: var(--accent-tint);
    color: var(--accent);
    letter-spacing: 0.02em;
  }

  .cat {
    display: inline-block;
    font-size: 11.5px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 700;
  }
  .cat-fraud            { background: var(--cat-fraud-tint);    color: var(--cat-fraud); }
  .cat-authorization    { background: var(--cat-auth-tint);     color: var(--cat-auth); }
  .cat-processing_error { background: var(--cat-proc-tint);     color: var(--cat-proc); }
  .cat-consumer_dispute { background: var(--cat-consumer-tint); color: var(--cat-consumer); }

  .net-label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600;
  }
  .net-label .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .net-label.visa .dot { background: var(--net-visa); }
  .net-label.mc   .dot { background: var(--net-mc); }
  .net-label.amex .dot { background: var(--net-amex); }

  ul.evidence {
    margin: 0; padding: 0; list-style: none;
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px 20px;
  }
  @media (max-width: 720px) { ul.evidence { grid-template-columns: 1fr; } }
  ul.evidence li {
    font-size: 12.5px; color: var(--ink-2);
    padding-left: 16px; position: relative;
    line-height: 1.5;
  }
  ul.evidence li::before {
    content: ""; position: absolute; left: 0; top: 0.65em;
    width: 4px; height: 4px; background: var(--muted); border-radius: 50%;
  }

  .compare-grid {
    display: grid; grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 12px;
  }
  @media (max-width: 720px) { .compare-grid { grid-template-columns: 1fr; } }
  .compare-cell {
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    background: var(--surface-2);
    display: flex; flex-direction: column; gap: 8px;
    border-top: 3px solid var(--border);
  }
  .compare-cell.visa { border-top-color: var(--net-visa); }
  .compare-cell.mc   { border-top-color: var(--net-mc); }
  .compare-cell.amex { border-top-color: var(--net-amex); }
  .compare-cell .code {
    font-family: var(--font-mono); font-size: 15px; font-weight: 600; color: var(--ink);
  }
  .compare-cell .t {
    font-size: 12.5px; color: var(--ink-2); line-height: 1.45;
  }
  .compare-cell .meta {
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 8px;
  }

  .source {
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    padding-top: 4px; border-top: 1px dashed var(--hairline);
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
  }
  .source .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty {
    padding: 40px 24px;
    text-align: center; color: var(--muted);
    border: 1px dashed var(--border);
    border-radius: var(--radius);
    background: var(--surface);
  }
  .empty .em {
    font-family: var(--font-serif); font-size: 18px; font-weight: 700;
    color: var(--ink-2); display: block; margin-bottom: 6px;
  }

  footer.foot {
    max-width: 1400px; margin: 0 auto; padding: 12px 24px 32px;
    font-size: 11.5px; color: var(--muted);
    display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>

<div class="app">
  <header class="top">
    <div class="wordmark">
      <span class="glyph">차지백 <em>트리아지</em></span>
      <span class="kicker">Prototype · MCP 백엔드</span>
    </div>
    <div class="spacer"></div>
    <div class="legend" aria-hidden="true">
      <span class="chip"><span class="swatch visa"></span>비자</span>
      <span class="chip"><span class="swatch mc"></span>마스터카드</span>
      <span class="chip"><span class="swatch amex"></span>아멕스</span>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button">테마</button>
  </header>

  <main>
    <aside class="rail">
      <div class="panel">
        <h2>시나리오 질의</h2>
        <div class="field-stack">
          <div>
            <label for="ask">상황을 한 문장으로 설명하세요</label>
            <textarea id="ask" placeholder="예: 비자로 결제했는데 상품이 오지 않았어요"></textarea>
          </div>
          <div class="chip-row" id="netFilters" role="group" aria-label="네트워크 필터">
            <button class="filter-chip" data-net="all" aria-pressed="true">전체</button>
            <button class="filter-chip" data-net="visa" aria-pressed="false">비자</button>
            <button class="filter-chip" data-net="mastercard" aria-pressed="false">마스터카드</button>
            <button class="filter-chip" data-net="amex" aria-pressed="false">아멕스</button>
            <button class="filter-chip" data-net="comparison" aria-pressed="false">3사 비교</button>
          </div>
          <div class="row">
            <button class="primary" id="searchBtn" type="button">매칭 찾기</button>
            <button class="ghost" id="clearBtn" type="button">지우기</button>
          </div>
          <div class="quick-help">
            예시: <code>중복 결제</code>, <code>위조카드</code>, <code>구독 해지</code>, <code>불량 상품</code>
          </div>
        </div>
      </div>

      <div class="panel">
        <h2>사유코드 직접 조회</h2>
        <div class="field-stack">
          <div class="row">
            <div>
              <label for="netSel">네트워크</label>
              <select id="netSel">
                <option value="visa">비자</option>
                <option value="mastercard">마스터카드</option>
                <option value="amex">아멕스</option>
              </select>
            </div>
            <div>
              <label for="codeSel">사유코드</label>
              <select id="codeSel"></select>
            </div>
          </div>
          <button class="primary" id="lookupBtn" type="button">조회</button>
        </div>
      </div>

      <div class="panel">
        <h2>시나리오 비교</h2>
        <div class="field-stack">
          <div>
            <label for="catSel">시나리오 카테고리</label>
            <select id="catSel"></select>
          </div>
          <button class="primary" id="compareBtn" type="button">3사 비교</button>
        </div>
      </div>
    </aside>

    <section class="results" id="results" aria-live="polite"></section>
  </main>

  <footer class="foot">
    <div>chargeback-mcp/prototype · 사유코드 48개 · 컨텍스트 100개 · 규정 PDF는 internal:// 로 참조</div>
    <div>키워드 오버랩 검색 — 실서비스에서는 임베딩 검색으로 교체 권장</div>
  </footer>
</div>

<script>
(function () {
  "use strict";
  const RULES = JSON.parse(document.getElementById("rules-data").textContent);
  const CONTEXTS = JSON.parse(document.getElementById("contexts-data").textContent);
  const CAT_LABEL = {"fraud_cnp": "온라인(카드 미소지) 사기", "fraud_cp": "카드 소지 사기", "emv_counterfeit": "EMV 위조", "no_auth": "무승인 결제", "declined_auth": "승인거절 후 결제", "expired_auth": "승인 만료", "amount_exceeds_auth": "승인금액 초과", "late_presentment": "지연 제출", "duplicate": "중복 결제", "paid_other_means": "타 결제수단 중복", "incorrect_amount": "결제금액 오류", "not_received": "상품·서비스 미수령", "services_not_rendered": "서비스 미이행", "cancelled_recurring": "정기결제 취소", "not_as_described": "상품 불일치", "defective": "하자·불량", "credit_not_processed": "환불 미처리", "cancelled_goods": "주문 취소 미반영", "goods_returned": "반품 후 미환불", "misrepresentation": "허위 표시", "does_not_recognize": "미인지 결제", "questionable_merchant": "의심 가맹점", "currency_error": "통화 오류", "chip_pin_shift": "칩/PIN 책임전환", "no_show_hotel": "호텔 노쇼"};

  const NET_NAME = { visa: "비자", mastercard: "마스터카드", amex: "아멕스" };
  const NET_CSS  = { visa: "visa", mastercard: "mc", amex: "amex" };

  // Theme toggle
  const root = document.documentElement;
  document.getElementById("themeToggle").addEventListener("click", () => {
    const cur = root.getAttribute("data-theme");
    const next = cur === "dark" ? "light"
              : cur === "light" ? "dark"
              : matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
    root.setAttribute("data-theme", next);
  });

  // Populate selects
  const netSel = document.getElementById("netSel");
  const codeSel = document.getElementById("codeSel");
  const catSel = document.getElementById("catSel");

  function fillCodes(netKey) {
    const codes = RULES.networks[netKey].reason_codes;
    codeSel.innerHTML = "";
    Object.entries(codes).forEach(([code, rc]) => {
      const opt = document.createElement("option");
      opt.value = code;
      opt.textContent = `${code} — ${rc.title}`;
      codeSel.appendChild(opt);
    });
  }
  fillCodes(netSel.value);
  netSel.addEventListener("change", () => fillCodes(netSel.value));

  const categories = Array.from(new Set(CONTEXTS.map(c => c.category))).sort();
  categories.forEach(cat => {
    const opt = document.createElement("option");
    opt.value = cat;
    opt.textContent = CAT_LABEL[cat] || cat;
    catSel.appendChild(opt);
  });

  // Filter chips
  let activeNet = "all";
  document.querySelectorAll("#netFilters .filter-chip").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#netFilters .filter-chip").forEach(b => b.setAttribute("aria-pressed", "false"));
      btn.setAttribute("aria-pressed", "true");
      activeNet = btn.dataset.net;
    });
  });

  // Retrieval — Korean-aware tokenize: keep 2+ char sequences and CJK
  function tokenize(s) {
    const out = new Set();
    String(s).toLowerCase().split(/[\s.,!?;:()\[\]{}"'`~/\\<>=+*&^%$#@|—–\-]+/).forEach(t => {
      if (!t) return;
      if (t.length >= 2) out.add(t);
    });
    return out;
  }
  function score(qTokens, ctx) {
    const c = tokenize(ctx.question + " " + (ctx.category_label || "") + " " + (ctx.answer.reason_title || ""));
    let s = 0;
    qTokens.forEach(t => { if (c.has(t)) s++; });
    return s;
  }
  function retrieve(query, netFilter, k = 5) {
    const q = tokenize(query);
    if (!q.size) return [];
    let pool = CONTEXTS;
    if (netFilter && netFilter !== "all") pool = pool.filter(c => c.network === netFilter);
    return pool
      .map(c => [score(q, c), c])
      .filter(([s]) => s > 0)
      .sort((a, b) => b[0] - a[0] || a[1].id.localeCompare(b[1].id))
      .slice(0, k)
      .map(([s, c]) => ({ score: s, ctx: c }));
  }

  // DOM helpers
  const el = (tag, attrs = {}, ...children) => {
    const n = document.createElement(tag);
    Object.entries(attrs).forEach(([k, v]) => {
      if (k === "class") n.className = v;
      else if (k === "html") n.innerHTML = v;
      else n.setAttribute(k, v);
    });
    children.flat().forEach(c => {
      if (c == null) return;
      n.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    });
    return n;
  };

  function evidenceList(items) {
    const ul = el("ul", { class: "evidence" });
    (items || []).forEach(i => ul.appendChild(el("li", {}, i)));
    return ul;
  }

  function renderSingleAnswerCard(ctx, scoreVal) {
    const a = ctx.answer;
    const netCss = NET_CSS[ctx.network] || "";
    const netLabel = NET_NAME[ctx.network] || ctx.network;

    const card = el("article", { class: `card net-${netCss}` });
    card.appendChild(el("div", { class: "stripe" }));

    const body = el("div", { class: "body" });

    const header = el("div", { class: "card-header" });
    const title = el("div", {},
      el("h3", { class: "card-title" }, a.reason_title || "—"),
      el("div", { class: "card-sub" },
        el("span", { class: `net-label ${netCss}` }, el("span", { class: "dot" }), netLabel),
        " · ",
        a.framework || ""
      )
    );
    const scoreEl = scoreVal != null
      ? el("span", { class: "card-score" }, `일치도 ${scoreVal}`)
      : null;
    header.appendChild(title);
    if (scoreEl) header.appendChild(scoreEl);
    body.appendChild(header);

    body.appendChild(el("div", { class: "question" },
      el("span", { class: "q-mark" }, "Q"),
      ctx.question
    ));

    const dl = el("dl", { class: "answer-grid" });
    dl.appendChild(el("dt", {}, "사유코드"));
    dl.appendChild(el("dd", {}, el("span", { class: "code-pill" }, a.reason_code || "—")));
    dl.appendChild(el("dt", {}, "카테고리"));
    dl.appendChild(el("dd", {}, el("span", { class: `cat cat-${a.category}` }, a.category_ko || a.category)));
    dl.appendChild(el("dt", {}, "제기 기한"));
    dl.appendChild(el("dd", { class: "mono" }, a.time_limit_days != null ? `${a.time_limit_days}일` : "—"));
    dl.appendChild(el("dt", {}, "사전중재"));
    dl.appendChild(el("dd", {}, a.requires_pre_arbitration ? "필요" : "불필요"));
    body.appendChild(dl);

    body.appendChild(el("div", {},
      el("div", { class: "card-sub", style: "margin-bottom: 8px; font-weight: 700" }, "방어 증빙자료"),
      evidenceList(a.evidence_checklist)
    ));

    body.appendChild(el("div", { class: "source" },
      el("span", { class: "path" }, a.source_ref || ""),
      el("span", {}, ctx.id)
    ));

    card.appendChild(body);
    return card;
  }

  function renderComparisonCard(ctx) {
    const card = el("article", { class: "card net-comparison" });
    card.appendChild(el("div", { class: "stripe" }));

    const body = el("div", { class: "body" });
    body.appendChild(el("div", { class: "card-header" },
      el("div", {},
        el("h3", { class: "card-title" }, `3사 비교: ${ctx.category_label || ctx.category}`),
        el("div", { class: "card-sub" }, "비자 · 마스터카드 · 아멕스")
      )
    ));
    body.appendChild(el("div", { class: "question" },
      el("span", { class: "q-mark" }, "Q"),
      ctx.question
    ));

    const grid = el("div", { class: "compare-grid" });
    ctx.answer.networks.forEach((n, idx) => {
      const cssKey = ["visa", "mc", "amex"][idx];
      const cell = el("div", { class: `compare-cell ${cssKey}` });
      cell.appendChild(el("div", { class: `net-label ${cssKey}` },
        el("span", { class: "dot" }), n.network
      ));
      cell.appendChild(el("div", { class: "code" }, n.reason_code));
      cell.appendChild(el("div", { class: "t" }, n.reason_title));
      cell.appendChild(el("div", { class: "meta" },
        el("span", {}, `${n.time_limit_days || "—"}일`),
        el("span", {}, n.requires_pre_arbitration ? "사전중재" : "사전중재 불필요")
      ));
      grid.appendChild(cell);
    });
    body.appendChild(grid);

    if (ctx.answer.note) {
      body.appendChild(el("div", { class: "source" },
        el("span", { class: "path" }, ctx.answer.note),
        el("span", {}, ctx.id)
      ));
    }
    card.appendChild(body);
    return card;
  }

  const results = document.getElementById("results");

  function empty(title, msg) {
    return el("div", { class: "empty" },
      el("span", { class: "em" }, title),
      msg || ""
    );
  }
  function renderMeta(text) {
    return el("div", { class: "result-meta" },
      el("span", {}, ""),
      el("span", { class: "count" }, text)
    );
  }
  function clearResults() { results.replaceChildren(); }

  function renderCards(hits) {
    clearResults();
    if (!hits.length) {
      results.appendChild(empty("일치하는 결과 없음", "다른 키워드를 시도하거나, 네트워크 필터를 해제하거나, 직접 조회를 사용해 보세요."));
      return;
    }
    results.appendChild(renderMeta(`${hits.length}건 매칭`));
    hits.forEach(h => {
      const card = h.ctx.network === "comparison"
        ? renderComparisonCard(h.ctx)
        : renderSingleAnswerCard(h.ctx, h.score);
      results.appendChild(card);
    });
  }

  document.getElementById("searchBtn").addEventListener("click", () => {
    const q = document.getElementById("ask").value.trim();
    if (!q) {
      clearResults();
      results.appendChild(empty("질의를 입력하세요", "분쟁 상황을 한 문장으로 설명하면 사전 구축된 100개 컨텍스트에서 매칭합니다."));
      return;
    }
    renderCards(retrieve(q, activeNet, 5));
  });
  document.getElementById("ask").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) document.getElementById("searchBtn").click();
  });

  document.getElementById("clearBtn").addEventListener("click", () => {
    document.getElementById("ask").value = "";
    clearResults();
    renderIntro();
  });

  document.getElementById("lookupBtn").addEventListener("click", () => {
    const netKey = netSel.value;
    const code = codeSel.value;
    const rc = RULES.networks[netKey].reason_codes[code];
    const evidence = RULES.evidence_matrix[rc.category] || [];
    const catKo = { fraud: "사기", authorization: "승인", processing_error: "처리 오류", consumer_dispute: "소비자 분쟁" }[rc.category];
    const fake = {
      id: `lookup-${netKey}-${code}`,
      category: rc.category,
      network: netKey,
      question: `직접 조회: ${NET_NAME[netKey]} 사유코드 ${code}.`,
      answer: {
        network: RULES.networks[netKey].name,
        framework: RULES.networks[netKey].framework,
        reason_code: code,
        reason_title: rc.title,
        category: rc.category,
        category_ko: catKo,
        time_limit_days: rc.time_limit_days,
        requires_pre_arbitration: !!rc.requires_pre_arbitration,
        evidence_checklist: evidence,
        source_ref: RULES.networks[netKey].source,
      },
    };
    clearResults();
    results.appendChild(renderMeta(`${NET_NAME[netKey]} · ${code}`));
    results.appendChild(renderSingleAnswerCard(fake, null));
  });

  document.getElementById("compareBtn").addEventListener("click", () => {
    const cat = catSel.value;
    const ctx = CONTEXTS.find(c => c.category === cat && c.network === "comparison");
    clearResults();
    if (!ctx) {
      results.appendChild(empty("비교 데이터 없음", "해당 카테고리의 3사 비교 뷰가 없습니다."));
      return;
    }
    results.appendChild(renderMeta(`3사 비교 · ${CAT_LABEL[cat] || cat}`));
    results.appendChild(renderComparisonCard(ctx));
  });

  function renderIntro() {
    clearResults();
    const comp = CONTEXTS.find(c => c.category === "not_received" && c.network === "comparison");
    const single = CONTEXTS.find(c => c.category === "duplicate" && c.network === "visa");
    results.appendChild(renderMeta("시작 화면 — 질의·직접조회·비교 중 하나로 시작하세요"));
    if (comp) results.appendChild(renderComparisonCard(comp));
    if (single) results.appendChild(renderSingleAnswerCard(single, null));
  }
  renderIntro();
})();
</script>
