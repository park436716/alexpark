a topic online, search the web, look something up, find current information, compare options, or produce a research report.","p":"skills/68-research-productivity-skills/web-research/SKILL.md"},{"n":"paper-workflow","c":"69-Paper-WorkFlow","d":"经管 / 社科**实证论文全流程总编排器（meta-orchestrator）**：把「选题 → 设计 → 数据 → 计量识别与估计 → 表与图 → 写作初稿 → 全流程打磨 → 语言去 AI 味 → 模拟评审与修订 → 选刊与投稿 → 复盘交付」这条端到端流水线自动跑通。本 skill **不重复实现任何子能力**， 而是借鉴 `do-agent` 的「多代理 + 上下文保护」执行范式与 `paper-pipeline` 的「固定顺序 + 可断点续跑 + 交互档位」编排范式，按阶段**调用既有 skill / 派发并行 subagent** 完成一篇 可投稿的实证论文。触发场景：用户说 \"/paper-workflow\"、\"帮我写一篇实证论文\"、 \"从选题到投稿\"、\"实证论文全流程\"、\"经管社科论文工作流\"、\"端到端跑一篇 paper\"、 \"automate an empirical paper\"、\"end-to-end empirical research pipeline\"、\"paper workflow\"， 或带着一个研究方向 / 一份计划书 / 一份数据 / 一份初稿希望「一条龙」推进到投稿。","p":"skills/69-Paper-WorkFlow/SKILL.md"}],"collections":{"00-Full-empirical-analysis-skill_StatsPAI":{"count":1,"src":"https://github.com/brycewang-stanford/StatsPAI","license":"MIT"},"00.1-Full-empirical-analysis-skill_Python":{"count":1,"src":"https://github.com/brycewang-stanford/Auto-Empirical-Research-Skills","license":"CC-BY-SA-4.0 (repository default)"},"00.2-Full-empirical-analysis-skill_Stata":{"count":1,"src":"https://github.com/brycewang-stanford/Auto-Empirical-Research-Skills","license":"CC-BY-SA-4.0 (repository default)"},"00.3-Full-empirical-analysis-skill_R":{"count":1,"src":"https://github.com/brycewang-stanford/Auto-Empirical-Research-Skills","license":"CC-BY-SA-4.0 (repository default)"},"01-lishix520-academic-paper-skills":{"count":2,"src":"https://github.com/lishix520/academic-paper-skills","license":"MIT"},"02-luwill-research-skills":{"count":3,"src":"https://github.com/luwill/research-skills","license":"MIT"},"03-K-Dense-AI-claude-scientific-skills":{"count":4,"src":"https://github.com/K-Dense-AI/claude-scientific-skills","license":"MIT"},"04-K-Dense-AI-claude-scientific-writer":{"count":8,"src":"https://github.com/K-Dense-AI/claude-scientific-writer","license":"MIT"},"05-kthorn-researc <script>
(function () {
  var payload = JSON.parse(document.getElementById('aers-data').textContent);
  var skills = payload.skills;
  var collections = payload.collections;
  var repo = payload.repo;

  document.getElementById('skillCount').textContent = skills.length.toLocaleString();
  document.getElementById('colCount').textContent = Object.keys(collections).length.toLocaleString();

  var exampleChips = ['DID', 'RDD', 'IV', 'event study', 'citation', 'LaTeX', 'Stata', 'Bayesian',
                       'literature review', 'de-AI', 'panel data', 'replication', 'survival analysis'];
  var chipsEl = document.getElementById('chips');
  exampleChips.forEach(function (kw) {
    var c = document.createElement('span');
    c.className = 'chip';
    c.textContent = kw;
    c.onclick = function () { qEl.value = kw; render(); };
    chipsEl.appendChild(c);
  });

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }

  function highlight(text, tokens) {
    var escaped = escapeHtml(text);
    if (!tokens.length) return escaped;
    var pattern = tokens.map(function (t) {
      return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    }).join('|');
    var re = new RegExp('(' + pattern + ')', 'ig');
    return escaped.replace(re, '<mark>$1</mark>');
  }

  var qEl = document.getElementById('q');
  var resultsEl = document.getElementById('results');
  var statusEl = document.getElementById('status');
  var MAX_RENDER = 200;

  function render() {
    var raw = qEl.value.trim();
    var tokens = raw.length ? raw.toLowerCase().split(/\s+/) : [];

    var matched = [];
    for (var i = 0; i < skills.length; i++) {
      var s = skills[i];
      var hay = (s.n + ' ' + s.c + ' ' + s.d).toLowerCase();
      var ok = true;
      var score = 0;
      for (var j = 0; j < tokens.length; j++) {
        var t = tokens[j];
        if (hay.indexOf(t) === -1) { ok = false; break; }
        if (s.n.toLowerCase().indexOf(t) !== -1) score += 5;
        if (s.c.toLowerCase().indexOf(t) !== -1) score += 3;
        score += 1;
      }
      if (ok) matched.push({ s: s, score: score });
    }

    matched.sort(function (a, b) { return b.score - a.score; });

    statusEl.textContent = tokens.length
      ? matched.length.toLocaleString() + '개 결과 (전체 ' + skills.length.toLocaleString() + '개 중)' +
        (matched.length > MAX_RENDER ? ' — 상위 ' + MAX_RENDER + '개만 표시' : '')
      : skills.length.toLocaleString() + '개 전체 스킬 표시 중 (키워드를 입력해 좁혀보세요) — 상위 ' + MAX_RENDER + '개만 표시';

    var toRender = matched.slice(0, MAX_RENDER);
    if (!toRender.length) {
      resultsEl.innerHTML = '<div class="empty">일치하는 스킬이 없습니다.</div>';
      return;
    }

    var html = toRender.map(function (m) {
      var s = m.s;
      var meta = collections[s.c] || {};
      var srcUrl = repo + '/blob/main/' + s.p;
      var descSnippet = s.d.length > 600 ? s.d.slice(0, 600) + '…' : s.d;
      return '<div class="card">' +
        '<h3><a href="' + srcUrl + '" target="_blank" rel="noopener">' + highlight(s.n, tokens) + '</a></h3>' +
        '<div class="meta"><span class="col">' + escapeHtml(s.c) + '</span>' +
        (meta.license ? '<span>' + escapeHtml(meta.license) + '</span>' : '') +
        '</div>' +
        '<div class="desc">' + highlight(descSnippet, tokens) + '</div>' +
        '</div>';
    }).join('');

    resultsEl.innerHTML = html;
  }

  qEl.addEventListener('input', render);
  render();
})();
</script>
