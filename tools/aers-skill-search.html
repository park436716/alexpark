<script type="application/json" id="aers-data">{"skills":[{"n":"StatsPAI_skill","c":"00-Full-empirical-analysis-skill_StatsPAI","d":"Use when the user asks to run a full empirical / causal analysis in Python — by default in the style of an applied economics paper (AER / QJE / JPE / ReStud / AEJ) with DID / RD / IV / SCM / DML / matching, written-out estimating equation + identifying assumption, Table 1 / Table 2 / event-study figure / robustness gauntlet — OR in epidemiology / public health style (target-trial emulation, IPTW + g-formula + TMLE triplet, Mendelian randomization, KM/AFT survival, E-value sensitivity, STROBE/TRIPOD reporting) — OR in ML causal inference style (DML, S/T/X/R/DR meta-learners, causal forest, Dragonnet/TARNet/CEVAE, BCF, CATE distribution, policy learning, conformal causal, fairness audit, causal discovery). Also covers exporting multi-column regression tables to Word / Excel / LaTeX (Stata outreg2 / esttab / R modelsummary equivalent) and bundling an entire replication appendix into one .docx / .xlsx / .tex file. Triggers on keywords \"StatsPAI\", \"statspai\", \"AER empirical analysis\", \"applied micro pipeline\", \"Table 1 balance\", \"event study\", \"first-stage F\", \"Oster bound\", \"honest_did\", \"spec_curve\", \"callaway_santanna\", \"dragonnet\", \"text as treatment\", \"outreg2 in Python\", \"regression table to Word/Excel\", \"sp.regtable\", \"sp.collect\", \"sp.paper_tables\", \"sp.feols\", \"summary_col\", \"modelsummary\", \"AER style table\", \"QJE style table\", \"epidemiology pipeline\", \"target trial emulation\", \"g-formula\", \"IPTW\", \"TMLE\", \"Mendelian randomization\", \"STROBE\", \"TRIPOD\", \"公共健康\", \"流行病学\", \"DML\", \"double machine learning\", \"causal forest\", \"meta-learner\", \"CATE\", \"conformal causal\", \"policy learning\", \"因果机器学习\", \"ML causal\".","p":"skills/00-Full-empirical-analysis-skill_StatsPAI/SKILL.md"},{"n":"Full-empirical-analysis-skill","c":"00.1-Full-empirical-analysis-skill_Python","d":"Classical end-to-end empirical analysis workflow in the traditional Python econometric stack — pandas + numpy + scipy + statsmodels + linearmodels + pyfixest + rdrobust + econml + causalml + matplotlib/seaborn. **Defaults to economics empirical-paper style** (AER / QJE / AEJ) — every run produces a publication-ready output set with a multi-column regression table (M1→M6 progressive controls/FE) as the centerpiece, plus Table 1 (descriptives), mechanism / heterogeneity / robustness tables, and event-study + coefficient + trend figures. Covers the full 8-step pipeline an applied economist or quantitative social scientist runs on every paper — (1) data cleaning, (2) variable construction & transformation, (3) descriptive statistics & Table 1, (4) statistical diagnostic tests, (5) baseline empirical modeling, (6) robustness battery, (7) further analysis (mechanism, heterogeneity, mediation, moderation), (8) publication-ready tables & figures. **Also covers two parallel domain modes that share the same 8-step scaffolding** — **Mode A — Epidemiology / public health** (target-trial emulation via `zepid` / hand-rolled `pandas`, IPTW + g-formula + TMLE doubly-robust triplet via `zepid` / `econml` / `lifelines`, Mendelian randomization via `pymr` / `mrtool` (or `rpy2` → `MendelianRandomization`/`TwoSampleMR`), KM / AFT / Cox survival via `lifelines`, E-value sensitivity, principal stratification — STROBE / TRIPOD reporting), and **Mode B — ML causal inference** (DML via `econml.dml` / `doubleml`, S/T/X/R/DR meta-learners via `econml.metalearners` / `causalml`, causal forest via `econml.grf` / `causalml`, Dragonnet / TARNet / CEVAE neural causal via `causalml`, BCF via `pymc-bart` / `bcf-py`, matrix completion, CATE distribution + policy tree via `econml.policy` / `policytree-py`, off-policy evaluation, conformal causal via `mapie`, fairness audit via `fairlearn`, DAG learning via `causal-learn` / `cdt` / LLM-assisted). Prescribes which library to reach for at each step assert), (2) variable construction (gen/egen/winsor2/xtile/xtset with L./F./D.), (3) descriptive statistics & Table 1 (tabstat/balancetable/asdoc), (4) classical diagnostic tests (sktest/swilk/hettest/imtest/xtserial/xttest3/vif/dfuller/kpss/hausman/estat overid), (5) baseline modeling (reg/xtreg/reghdfe/ivreg2/ivregress/csdid/did_imputation/eventstudyinteract/sdid/rdrobust/synth/psmatch2/teffects/heckman/qreg/ppmlhdfe), (6) robustness battery (bacondecomp/honestdid/rwolf/ritest/wildbootstrap/oster), (7) further analysis (subgroup/triple-diff/interactions/medsem/marginsplot/binscatter by group), (8) publication-ready tables & figures (esttab/outreg2/estout/coefplot/marginsplot/rdplot/twoway combined). **Also covers two parallel domain modes that share the same 8-step scaffolding** — **Mode A — Epidemiology / public health** (target-trial emulation, IPTW + g-formula + TMLE doubly-robust triplet via `teffects ipw` / `teffects ipwra` / `teffects aipw` / `eltmle`, Mendelian randomization via `mrrobust` (IVW / Egger / weighted median) and `mregger` / `mrpresso`, KM / Cox / AFT / RMST survival via `sts` / `stcox` / `streg` / `strmst2`, E-value sensitivity via `evalue` (Linden-Mathur), principal stratification — STROBE / TRIPOD reporting), and **Mode B — ML causal inference** (DML via `ddml` / `pdslasso`, S/T/X/R/DR meta-learners via `crforest` and `ddml interactive`, causal forest via `crforest` / `cforest`, BART/BCF via `bart` / `bartCause`-style externals, CATE distribution + policy tree via `crforest`, off-policy evaluation, conformal causal externals, fairness audit, DAG learning via `pcalg` / external Python callouts). Use when the user asks for a complete Stata empirical analysis, wants a reproducible .do-file pipeline, needs a Stata counterpart to the Python StatsPAI / Full-empirical-analysis-skill, or names a specific Stata step in isolation (\"run reghdfe with two-way clustering\", \"csdid event study\", \"winsor2 at 1%\", \"esttab to LaTeX\", \"coefplot with CI\", \"ivreg2 weak-IV test\", \"synth_runner placebos\", \"teffects psmatch balance check\"). Mode A triggers on \"target trial emulation Stata\", \"teffects ipw aipw\", \"eltmle\", \"mrrobust\", \"mregger weighted median\", \"stcox AFT survival\", \"strmst2\", \"evalue Stata\", \"STROBE Stata\", \"公共健康 Stata\", \"流行病学 Stata\". Mode B triggers on \"ddml Stata\", \"pdslasso\", \"crforest causal forest Stata\", \"policy tree Stata\", \"因果机器学习 Stata\".","p":"skills/00.2-Full-empirical-analysis-skill_Stata/SKILL.md"},{"n":"Full-empirical-analysis-skill-R","c":"00.3-Full-empirical-analysis-skill_R","d":"Classical end-to-end empirical analysis workflow in the modern tidyverse + econometrics R ecosystem — dplyr + tidyr + haven + fixest + sandwich + lmtest + clubSandwich + AER + ivreg + did + bacondecomp + HonestDiD + eventstudyr + rdrobust + rddensity + Synth + gsynth + synthdid + MatchIt + WeightIt + cobalt + ebal + grf + DoubleML + mediation + marginaleffects + modelsummary + kableExtra + gt + ggplot2 + ggpubr + cowplot + binsreg. **Defaults to economics empirical-paper style** (AER / QJE / AEJ) — every run produces a publication-ready output set with a multi-column regression table (M1→M6 progressive controls/FE) as the centerpiece, plus Table 1 (descriptives), mechanism / heterogeneity / robustness tables, and event-study + coefficient + trend figures. Covers the full 8-step R pipeline an applied economist runs on every paper — (1) data import & cleaning (read_dta/read_csv, naniar, janitor, validate-merges), (2) variable construction (mutate/across/winsorize/group_by + lag/lead with dplyr), (3) descriptive statistics & Table 1 (gtsummary, modelsummary::datasummary, tableone), (4) classical diagnostic tests (shapiro/jarque.bera.test/bptest/dwtest/bgtest/vif/adf.test/kpss.test/Hausman), (5) baseline modeling (fixest::feols, ivreg, did::att_gt, eventstudyr, sun_ab, did_imputation, synthdid, rdrobust, MatchIt, WeightIt, grf::causal_forest, DoubleML, mediation), (6) robustness battery (modelsummary stack, clubSandwich CRSE, fwildclusterboot, ri2, robomit Oster, bacondecomp, HonestDiD), (7) further analysis (interactions + marginaleffects, mediation::mediate, gsem via lavaan, dose-response splines, grf CATE), (8) publication-ready tables & figures (modelsummary, kableExtra, gt, stargazer, texreg, flextable to LaTeX/Word/HTML; ggplot2 + ggpubr + cowplot + binsreg + iplot for figures). **Also covers two parallel domain modes that share the same 8-step scaffolding** — **Mode A — Epidemiology / public health** (target-trial emulation, IPTW + g-formula + TMLE doubly-robust triplet via `WeightIt` / `gfoRmula` / `tmle` / `ltmle`, Mendelian randomization via `MendelianRandomization` / `TwoSampleMR` / `MRPRESSO`, KM / Cox / AFT / RMST survival via `survival` / `survminer` / `flexsurv`, E-value sensitivity via `EValue`, principal stratification — STROBE / TRIPOD reporting), and **Mode B — ML causal inference** (DML via `DoubleML`, S/T/X/R/DR meta-learners via `causalweight` / `grf`, causal forest via `grf::causal_forest`, BART/BCF via `bartCause` / `bcf`, matrix completion via `MCPanel`, CATE distribution + policy tree via `policytree`, off-policy evaluation, conformal causal via `conformalInference` / `cfcausal`, fairness audit via `fairmodels`, DAG learning via `pcalg` / `bnlearn` / LLM-assisted). Use when the user asks for a complete R empirical analysis, wants a tidyverse-style reproducible R script / Quarto workflow, prefers fixest over reghdfe, needs the R counterpart to StatsPAI / 00.1 / 00.2, or names a specific R step in isolation (\"feols with cluster\", \"MatchIt nearest neighbor\", \"bacondecomp in R\", \"gtsummary table 1\", \"modelsummary to Word\"). Mode A triggers on \"target trial emulation R\", \"tmle ltmle\", \"MendelianRandomization\", \"TwoSampleMR\", \"MRPRESSO\", \"survival cox AFT\", \"STROBE R\", \"EValue R\", \"公共健康 R\", \"流行病学 R\". Mode B triggers on \"DoubleML R\", \"grf causal forest\", \"policytree\", \"bartCause bcf\", \"conformal causal R\", \"fairmodels\", \"pcalg NOTEARS\", \"因果机器学习 R\".","p":"skills/00.3-Full-empirical-analysis-skill_R/SKILL.md"},{"n":"academic-paper-composer","c":"01-lishix520-academic-paper-skills","d":"Systematic writing framework for philosophy and interdisciplinary academic papers from optimized outline to submission-ready manuscript. Use when users want to: (1) write a paper from a detailed outline, (2) ensure quality control during writing, (3) maintain consistency across chapters, (4) prepare a submission-ready manuscript, or (5) systematically execute a planned paper. Triggered by phrases like 'write the paper from this outline,' 'compose the full manuscript,' 'execute the outline,' or when users have completed strategic planning (academic-paper-strategist skill) and are ready to write. Takes optimized outline as input; outputs complete manuscript with iterative quality checks.","p":"skills/01-lishix520-academic-paper-skills/composer/SKILL.md"},{"n":"academic-paper-strategist","c":"01-lishix520-academic-paper-skills","d":"Systematic strategic planning framework for philosophy and interdisciplinary academic papers targeting preprint platforms (PhilArchive, arXiv, PhilSci-Archive). Use when users want to: (1) plan a paper on a specific topic, (2) identify research gaps and assess originality, (3) develop optimized paper outlines, (4) prepare for preprint submission, or (5) understand platform requirements and writing standards. Triggered by phrases like 'plan a paper on,' 'help me design a paper about,' 'identify research gaps in,' 'is this idea original,' or when users need structured research planning. The skill guides through three phases: Platform Analysis (identifying target venue and studying sample papers), Theoretical Framework (AI-driven literature search and gap identification), and Outline Optimization (structured design with reviewer-perspective self-assessment). Each phase includes quality evaluation standards and validation checkpoints. Output: optimized detailed outline ready for systematic writing (use with academic-paper-composer skill).","p":"skills/01-lishix520-academic-paper-skills/strategist/SKILL.md"},{"n":"medical-imaging-review","c":"02-luwill-research-skills","d":"Write comprehensive literature reviews for medical imaging AI research. Use when writing survey papers, systematic reviews, or literature analyses on topics like segmentation, detection, classification in CT, MRI, X-ray, ultrasound, or pathology imaging. Triggers on requests for \"review paper\", \"survey\", \"literature review\", \"综述\", \"systematic review\", or mentions of writing academic reviews on deep learning for medical imaging.","p":"skills/02-luwill-research-skills/medical-imaging-review/SKILL.md"},{"n":"paper-slide-deck","c":"02-luwill-research-skills","d":"Generate professional slide deck images from academic papers and content. Creates comprehensive outlines with style instructions, auto-detects figures from PDFs, then generates individual slide images. Use when user asks to \"create slides\", \"make a presentation\", \"generate deck\", or \"slide deck\" for papers.","p":"skills/02-luwill-research-skills/paper-slide-deck/SKILL.md"},{"n":"research-proposal","c":"02-luwill-research-skills","d":"Generate academic research proposals for PhD applications. Use when user asks to \"write a research proposal\", \"create PhD proposal\", \"generate research plan\", \"撰写研究计划\", \"写博士申请\", \"doctoral proposal\", or mentions specific research topics for PhD application. Supports STEM, humanities, and social sciences with field-specific adaptations. Follows Nature Reviews-style academic writing conventions. Supports both English and Chinese output based on user preference.","p":"skills/02-luwill-research-skills/research-proposal/SKILL.md"},{"n":"hypothesis-generation","c":"03-K-Dense-AI-claude-scientific-skills","d":"Structured hypothesis formulation from observations. Use when you have experimental observations or data and need to formulate testable hypotheses with predictions, propose mechanisms, and design experiments to test them. Follows scientific method framework. For open-ended ideation use scientific-brainstorming; for automated LLM-driven hypothesis testing on datasets use hypogenic.","p":"skills/03-K-Dense-AI-claude-scientific-skills/hypothesis-generation/SKILL.md"},{"n":"literature-review","c":"03-K-Dense-AI-claude-scientific-skills","d":"Conduct comprehensive, systematic literature reviews using multiple academic databases (PubMed, arXiv, bioRxiv, Semantic Scholar, etc.). This skill should be used when conducting systematic literature reviews, meta-analyses, research synthesis, or comprehensive literature searches across biomedical, scientific, and technical domains. Creates professionally formatted markdown documents and PDFs with verified citations in multiple citation styles (APA, Nature, Vancouver, etc.).","p":"skills/03-K-Dense-AI-claude-scientific-skills/literature-review/SKILL.md"},{"n":"research-grants","c":"03-K-Dense-AI-claude-scientific-skills","d":"Write competitive research proposals for NSF, NIH, DOE, DARPA, and Taiwan NSTC. Agency-specific formatting, review criteria, budget preparation, broader impacts, significance statements, innovation narratives, and compliance with submission requirements.","p":"skills/03-K-Dense-AI-claude-scientific-skills/research-grants/SKILL.md"},{"n":"scientific-writing","c":"03-K-Dense-AI-claude-scientific-skills","d":"Core skill for the deep research and writing tool. Write scientific manuscripts in full paragraphs (never bullet points). Use two-stage process with (1) section outlines with key points using research-lookup then (2) convert to flowing prose. IMRAD structure, citations (APA/AMA/Vancouver), figures/tables, reporting guidelines (CONSORT/STROBE/PRISMA), for research papers and journal submissions.","p":"skills/03-K-Dense-AI-claude-scientific-skills/scientific-writing/SKILL.md"},{"n":"citation-management","c":"04-K-Dense-AI-claude-scientific-writer","d":"Comprehensive citation management for academic research. Search Google Scholar and PubMed for papers, extract accurate metadata, validate citations, and generate properly formatted BibTeX entries. This skill should be used when you need to find papers, verify citation information, convert DOIs to BibTeX, or ensure reference accuracy in scientific writing.","p":"skills/04-K-Dense-AI-claude-scientific-writer/citation-management/SKILL.md"},{"n":"hypothesis-generation","c":"04-K-Dense-AI-claude-scientific-writer","d":"Generate testable hypotheses. Formulate from observations, design experiments, explore competing explanations, develop predictions, propose mechanisms, for scientific inquiry across domains.","p":"skills/04-K-Dense-AI-claude-scientific-writer/hypothesis-generation/SKILL.md"},{"n":"literature-review","c":"04-K-Dense-AI-claude-scientific-writer","d":"Conduct comprehensive, systematic literature reviews using multiple academic databases (PubMed, arXiv, bioRxiv, Semantic Scholar, etc.). This skill should be used when conducting systematic literature reviews, meta-analyses, research synthesis, or comprehensive literature searches across biomedical, scientific, and technical domains. Creates professionally formatted markdown documents and PDFs with verified citations in multiple citation styles (APA, Nature, Vancouver, etc.).","p":"skills/04-K-Dense-AI-claude-scientific-writer/literature-review/SKILL.md"},{"n":"peer-review","c":"04-K-Dense-AI-claude-scientific-writer","d":"Systematic peer review toolkit. Evaluate methodology, statistics, design, reproducibility, ethics, figure integrity, reporting standards, for manuscript and grant review across disciplines.","p":"skills/04-K-Dense-AI-claude-scientific-writer/peer-review/SKILL.md"},{"n":"research-grants","c":"04-K-Dense-AI-claude-scientific-writer","d":"Write competitive research proposals for NSF, NIH, DOE, and DARPA. Agency-specific formatting, review criteria, budget preparation, broader impacts, significance statements, innovation narratives, and compliance with submission requirements.","p":"skills/04-K-Dense-AI-claude-scientific-writer/research-grants/SKILL.md"},{"n":"scholar-evaluation","c":"04-K-Dense-AI-claude-scientific-writer","d":"","p":"skills/04-K-Dense-AI-claude-scientific-writer/scholar-evaluation/SKILL.md"},{"n":"scientific-critical-thinking","c":"04-K-Dense-AI-claude-scientific-writer","d":"Evaluate research rigor. Assess methodology, experimental design, statistical validity, biases, confounding, evidence quality (GRADE, Cochrane ROB), for critical analysis of scientific claims.","p":"skills/04-K-Dense-AI-claude-scientific-writer/scientific-critical-thinking/SKILL.md"},{"n":"scientific-writing","c":"04-K-Dense-AI-claude-scientific-writer","d":"Core skill for the deep research and writing tool. Write scientific manuscripts in full paragraphs (never bullet points). Use two-stage process: (1) create section outlines with key points using research-lookup, (2) convert to flowing prose. IMRAD structure, citations (APA/AMA/Vancouver), figures/tables, reporting guidelines (CONSORT/STROBE/PRISMA), for research papers and journal submissions.","p":"skills/04-K-Dense-AI-claude-scientific-writer/scientific-writing/SKILL.md"},{"n":"Getting Started with Research Superpowers","c":"05-kthorn-research-superpower","d":"Introduction to literature search & review skills - systematic paper finding, screening, extraction, and citation traversal","p":"skills/05-kthorn-research-superpower/getting-started/SKILL.md"},{"n":"Answering Research Questions","c":"05-kthorn-research-superpower","d":"Main orchestration workflow for systematic literature research - search, evaluate, traverse, synthesize","p":"skills/05-kthorn-research-superpower/research/answering-research-questions/SKILL.md"},{"n":"Building Paper Screening Rubrics","c":"05-kthorn-research-superpower","d":"Collaboratively build and refine paper screening rubrics through brainstorming, test-driven development, and iterative feedback","p":"skills/05-kthorn-research-superpower/research/building-screening-rubrics/SKILL.md"},{"n":"Checking ChEMBL for Structured SAR Data","c":"05-kthorn-research-superpower","d":"Check if medicinal chemistry papers are in ChEMBL database to access curated bioactivity data","p":"skills/05-kthorn-research-superpower/research/checking-chembl/SKILL.md"},{"n":"Cleaning Up Research Sessions","c":"05-kthorn-research-superpower","d":"Safely remove intermediate files from completed research sessions while preserving important data","p":"skills/05-kthorn-research-superpower/research/cleaning-up-research-sessions/SKILL.md"},{"n":"Evaluating Paper Relevance","c":"05-kthorn-research-superpower","d":"Two-stage paper screening - abstract scoring then deep dive for specific data extraction","p":"skills/05-kthorn-research-superpower/research/evaluating-paper-relevance/SKILL.md"},{"n":"Finding Open Access Papers","c":"05-kthorn-research-superpower","d":"Use Unpaywall API to find free full-text versions of paywalled papers","p":"skills/05-kthorn-research-superpower/research/finding-open-access-papers/SKILL.md"},{"n":"Searching Scientific Literature","c":"05-kthorn-research-superpower","d":"PubMed search with keyword optimization, result parsing, and metadata extraction","p":"skills/05-kthorn-research-superpower/research/searching-literature/SKILL.md"},{"n":"Subagent-Driven Literature Review","c":"05-kthorn-research-superpower","d":"Use parallel subagents for large-scale paper screening and deep dive analysis","p":"skills/05-kthorn-research-superpower/research/subagent-driven-review/SKILL.md"},{"n":"Traversing Citation Networks","c":"05-kthorn-research-superpower","d":"Smart backward and forward citation following via Semantic Scholar, with relevance filtering and deduplication","p":"skills/05-kthorn-research-superpower/research/traversing-citations/SKILL.md"},{"n":"stat-writing","c":"06-fuhaoda-stats-paper-writing","d":"End-to-end statistical writing assistant for LaTeX - draft title/abstract/keywords, expand outlines into sections, audit manuscripts, write reviewer reports and response letters, and scaffold book manuscripts.","p":"skills/06-fuhaoda-stats-paper-writing/stat-writing/SKILL.md"},{"n":"academic-plotting","c":"07-Orchestra-Research-AI-Research-SKILLs","d":"Generates publication-quality figures for ML papers from research context. Given a paper section or description, extracts system components and relationships to generate architecture diagrams via Gemini. Given experiment results or data, auto-selects chart type and generates data-driven figures via matplotlib/seaborn. Use when creating any figure for a conference paper.","p":"skills/07-Orchestra-Research-AI-Research-SKILLs/academic-plotting/SKILL.md"},{"n":"autoresearch","c":"07-Orchestra-Research-AI-Research-SKILLs","d":"Orchestrates end-to-end autonomous AI research projects using a two-loop architecture. The inner loop runs rapid experiment iterations with clear optimization targets. The outer loop synthesizes results, identifies patterns, and steers research direction. Routes to domain-specific skills for execution, supports continuous agent operation via Claude Code /loop and OpenClaw heartbeat, and produces research presentations and papers. Use when starting a research project, running autonomous experiments, or managing a multi-hypothesis research effort.","p":"skills/07-Orchestra-Research-AI-Research-SKILLs/autoresearch-skill/SKILL.md"},{"n":"ml-paper-writing","c":"07-Orchestra-Research-AI-Research-SKILLs","d":"Write publication-ready ML/AI/Systems papers for NeurIPS, ICML, ICLR, ACL, AAAI, COLM, OSDI, NSDI, ASPLOS, SOSP. Use when drafting papers from research repos, structuring arguments, verifying citations, or preparing camera-ready submissions. Includes LaTeX templates, reviewer guidelines, and citation verification workflows.","p":"skills/07-Orchestra-Research-AI-Research-SKILLs/ml-paper-writing/SKILL.md"},{"n":"latex-docum et, (21) condense lecture notes/PDFs into a cheat sheet, (22) create a fillable PDF form with text fields/checkboxes/dropdowns, (23) create a document with conditional content/toggles (show/hide sections), (24) generate batch/mail-merge documents from CSV/JSON data, (25) create a version diff PDF (latexdiff) highlighting changes between documents, (26) create a homework or assignment submission with problems and solutions, (27) create a lab report with data tables, graphs, and error analysis, (28) encrypt or password-protect a PDF, (29) merge multiple PDFs into one, (30) optimize/compress a PDF for web or email, (31) lint or check a LaTeX document for common issues, (32) count words in a LaTeX document, (33) analyze document statistics (figures, tables, citations), (34) fetch BibTeX from a DOI, (35) convert a Graphviz .dot file to PDF/PNG, (36) convert a PlantUML .puml file to PDF/PNG, (37) create a one-pager/fact sheet/executive summary, (38) create a datasheet or product specification sheet, (39) extract pages from a PDF (page ranges, odd/even), (40) check LaTeX package availability before compiling, (41) analyze citations and cross-reference with .bib files, (42) debug LaTeX compilation errors, (43) make a document accessible (PDF/A, tagged PDF), (44) create lecture notes or course handouts, (45) fill an existing PDF form (fillable fields or non-fillable with annotations), (46) extract text or tables from a PDF (pdfplumber, pypdf), (47) OCR a scanned PDF to text (pytesseract), (48) create a PDF programmatically with reportlab (Canvas, Platypus), (49) rotate or crop PDF pages (pypdf), (50) add a watermark to an existing PDF, (51) extract metadata from a PDF (title, author, subject).","p":"skills/08-ndpvt-web-latex-document-skill/SKILL.md"},{"n":"python-panel-data","c":"09-meleantonio-awesome-econ-ai-stuff","d":"Panel data analysis with Python using linearmodels and pandas.","p":"skills/09-meleantonio-awesome-econ-ai-stuff/_skills/analysis/python-panel-data/SKILL.m eantonio-awesome-econ-ai-stuff","d":"Implements the Spec-Driven Development lifecycle (Intent, Requirements, Design, Tasks, Build) for structured feature development. Use when the user wants to scaffold a new feature spec, generate EARS requirements, create a technical design, break work into tasks, or check spec status. Trigger on keywords: sdd, spec-driven, ears requirements, feature spec.","p":"skills/09-meleantonio-awesome-econ-ai-stuff/_skills/engineering/sdd/SKILL.md"},{"n":"techdebt","c":"09-meleantonio-awesome-econ-ai-stuff","d":"Find and fix technical debt including duplicated code, dead code, outdated patterns, and code smells. Run at the end of sessions to clean up.","p":"skills/09-meleantonio-awesome-econ-ai-stuff/_skills/engineering/techdebt/SKILL.md"},{"n":"research-ideation","c":"09-meleantonio-awesome-econ-ai-stuff","d":"Generate research questions from economic phenomena","p":"skills/09-meleantonio-awesome-econ-ai-stuff/_skills/ideation/research-ideation/SKILL.md"},{"n":"lit-review-assistant","c":"09-meleantonio-awesome-econ-ai-stuff","d":"Search, summarize, and synthesize economics literature","p":"skills/09-meleantonio-awesome-econ-ai-stuff/_skills/literature/lit-review-assistant/SKILL.md"},{"n":"general-equilibrium-model-builder","c":"09-meleantonio-awesome-econ-ai-stuff","d":"Build and solve Walrasian general equilibrium models with theory derivations and Julia computation","p":"skills/09-meleantonio-awesome-econ-ai-stuff/_skills/theory/general-equilibrium-model-builder/SKILL.md"},{"n":"latex-econ-model","c":"09-meleantonio-awesome-econ-ai-stuff","d":"Write and typeset economic models in LaTeX with proper notation","p":"skills/09-meleantonio-awesome-econ-ai-stuff/_skills/theory/latex-econ-model/SKILL.md"},{"n":"academic-paper-writer","c":"09-meleantonio-awesome-econ-ai-stuff","d":"Draft economics papers with proper structure and academic style","p":"skills/09-meleantonio-awesome-econ-ai-stuff/_skills/writing/academic-paper-writer/SKILL.md"},{"n":"latex-tables","c":"09-meleantonio-awesome-econ-ai-stuff","d":"Generate publication-ready regression tables in LaTeX.","p":"skills/09-meleantonio-awesome-econ-ai-stuff/_skills/writing/latex-tables/SKILL.md"},{"n":"causal-inference-mixtape","c":"10-Jill0099-causal-inference-mixtape","d":"This skill should be used when the user asks to \"implement a DiD regression\", \"write a causal inference pipeline\", \"set up an event study\", \"implement instrumental variables\", \"run a regression discontinuity design\", \"build a synthetic control model\", \"implement propensity score matching\", \"write parallel trends test\", \"implement Bacon decomposition\", or needs code templates for causal inference methods in Python, R, or Stata. Based on Scott Cunningham''s Causal Inference: The Mixtape.","p":"skills/10-Jill0099-causal-inference-mixtape/SKILL.md"},{"n":"bayesian-estimation","c":"11-James-Traina-compound-science","d":"This skill covers Bayesian estimation and inference in quantitative social science. Use when the user is specifying priors, running MCMC, diagnosing chain convergence, or reporting posterior summaries — including hierarchical models, Bayesian structural models, and small-sample settings where priors regularize. Triggers on \"Bayesian estimation\", \"Bayesian inference\", \"MCMC\", \"Markov chain Monte Carlo\", \"Stan\", \"PyMC\", \"NumPyro\", \"prior\", \"posterior\", \"credible interval\", \"Bayesian structural\", \"Bayesian BLP\", \"Bayesian DSGE\", \"hierarchical model\", \"random effects Bayesian\", \"posterior predictive check\", \"Bayes factor\", \"prior predictive check\", \"NUTS\", \"HMC\", \"Hamiltonian Monte Carlo\", \"R-hat\", \"rhat\", \"effective sample size\", \"ESS\", \"Bayesian calibration\", \"posterior distribution\", \"prior elicitation\", \"weakly informative prior\", \"brms\", \"rstanarm\", \"cmdstanpy\", \"pymc\", \"arviz\".","p":"skills/11-James-Traina-compound-science/skills/bayesian-estimation/SKILL.md"},{"n":"causal-inference","c":"11-James-Traina-compound-science","d":"This skill covers causal inference methods in observational and quasi-experimental settings. Use when the user is implementing, choosing between, or debugging causal identification strategies — including instrumental variables, difference-in-differences, regression discontinuity, synthetic control, or matching estimators. Triggers on \"causal effect\", \"identification strategy\", \"instrumental variable\", \"2SLS\", \"GMM\", \"difference-in-differences\", \"DiD\", \"staggered treatment\", \"regression discontinuity\", \"RDD\", \"synthetic control\", \"matching\", \"propensity score\", \"IPW\", \"AIPW\", \"doubly robust\", \"LATE\", \"ATT\", \"ATE\", \"parallel trends\", \"exclusion restriction\", \"first stage\", \"weak instruments\", or \"endogeneity\".","p":"skills/11-James-Traina-compound-science/skills/causal-inference/SKILL.md"},{"n":"causal-ml","c":"11-James-Traina-compound-science","d":"This skill covers causal machine learning methods in applied economics and quantitative social science. Use when implementing or choosing between modern ML-based causal estimators — including double machine learning, DML, partially linear models, interactive regression models, cross-fitting, Neyman orthogonality, debiased ML, causal forests, generalized random forest, GRF, honest causal trees, AIPW with machine learning, doubly robust with machine learning, DR-Learner, T-Learner, S-Learner, X-Learner, meta-learners, heterogeneous treatment effects, conditional average treatment effect, CATE, HTE, high-dimensional controls, LASSO controls, post-LASSO, post-double selection, Belloni-Chernozhukov-Hansen, Riesz representer, Chernozhukov, sample splitting, econml, DoubleML package, or any combination of machine learning and causal inference.","p":"skills/11-James-Traina-compound-science/skills/causal-ml/SKILL.md"},{"n":"empirical-playbook","c":"11-James-Traina-compound-science","d":"This skill covers applied microeconomic empirical methods and research design. Use when the user is selecting an identification strategy, comparing estimators, running diagnostics, designing a research study, or evaluating an empirical strategy. Triggers on \"which method\", \"what estimator\", \"how to choose\", \"method comparison\", \"empirical strategy\", \"research design\", \"applied micro\", \"identification strategy\", \"power analysis\", \"design-based\", \"model-based\", \"minimum detectable effect\", \"specification\".","p":"skills/11-James-Traina-compound-science/skills/empirical-playbook/SKILL.md"},{"n":"estimate","c":"11-James-Traina-compound-science","d":"Run a structural estimation pipeline — routes to /workflows:work with estimation context from empirical-playbook","p":"skills/11-James-Traina-compound-science/skills/estimate/SKILL.md"},{"n":"game-theory","c":"11-James-Traina-compound-science","d":"This skill covers game-theoretic methods in structural econometrics and industrial organization. Use when the user is working with strategic interactions, equilibrium analysis, or game-theoretic structural models — including entry games, conduct testing, auction models with strategic bidding, bargaining, or matching markets. Triggers on \"Nash equilibrium\", \"subgame perfect\", \"best response\", \"strategic interaction\", \"entry game\", \"conduct testing\", \"auction\", \"mechanism design\", \"matching market\", \"bargaining\", \"BNE\", \"Bayesian Nash\", \"static game\", \"dynamic game\", \"repeated game\", \"multiple equilibria\", \"equilibrium selection\", \"discrete game\", \"oligopoly\", \"game-theoretic\", \"player\", \"payoff\", \"strategy\", \"dominant strategy\", \"Bresnahan-Reiss\", \"Ciliberto-Tamer\", \"partial identification\", \"set identification\", or markup test.","p":"skills/11-James-Traina-compound-science/skills/game-theory/SKILL.md"},{"n":"identification-proofs","c":"11-James-Traina-compound-science","d":"This skill covers formal identification arguments and proofs in structural and redu here any broken references\", \"check the whole repo\", \"something feels off\", \"run the audit loop\", or after making broad changes across multiple files.","p":"skills/15-Felpix-Studios-social-science-research/skills/deep-audit/SKILL.md"},{"n":"lit-review","c":"15-Felpix-Studios-social-science-research","d":"Structured literature review using a parallel fleet of Librarian agents. Searches top journals, working paper repositories (NBER, SSRN, IZA), and traces citation chains from key papers. Make sure to use this skill whenever the user wants to survey existing research on a topic — not to find datasets or write a paper. Triggers include: \"review the literature\", \"find related papers\", \"what's been done on X\", \"search for papers on\", \"do a lit review\", \"find papers about\", \"what papers should I cite\", \"who has written about this\", \"survey the literature\", \"find prior work on\", or any request to locate and summarize academic publications on a topic.","p":"skills/15-Felpix-Studios-social-science-research/skills/lit-review/SKILL.md"},{"n":"new-project","c":"15-Felpix-Studios-social-science-research","d":"Start a new research project by conducting a structured interview to formalize a research idea, then generates research questions with identification strategies and a project spec. Make sure to use this skill whenever the user wants to develop or document a new research idea — not to search for literature or data. Triggers include: \"new project\", \"start research\", \"I have an idea\", \"help me develop this\", \"I want to study X\", \"help me formalize this idea\", \"what's my research question\", \"what identification strategy should I use\", \"write up my project idea\", or when the user describes a topic they want to turn into a paper.","p":"skills/15-Felpix-Studios-social-science-research/skills/new-project/SKILL.md"},{"n":"proofread","c":"15-Felpix-Studios-social-science-research","d":"Run the proofreading protocol on academic writing — papers or manuscripts. Checks grammar, typos, layout issues, consistency, and academic writing quality. Produces a report without editing files. Make sure to use this skill whenever the user wants surface-level writing errors found — not substantive academic critique. Triggers include: \"proofread\", \"check for typos\", \"grammar check\", \"look for errors in my draft\", \"proofread all\", \"polish this\", \"check my writing\", \"are there any mistakes\", \"proofread before I send this\", or when the user wants a clean-up pass rather than feedback on arguments or methods.","p":"skills/15-Felpix-Studios-social-science-research/skills/proofread/SKILL.md"},{"n":"quality-gate","c":"15-Felpix-Studios-social-science-research","d":"Verify that every quantitative claim in the paper is traceable to an analysis output file, and that no important output was omitted. Make sure to use this skill whenever the user wants to check that the paper and analysis are consistent before submission. Triggers include: \"run the quality gate\", \"check the paper matches the analysis\", \"verify consistency\", \"does the paper match my results\", \"check my numbers\", \"are my tables right\", \"quality check before submission\", \"verify my claims\", \"make sure everything is consistent\", \"double-check the paper against my output files\", or any pre-submission integrity check between paper text and computed results.","p":"skills/15-Felpix-Studios-social-science-research/skills/quality-gate/SKILL.md"},{"n":"research-setup","c":"15-Felpix-Studios-social-science-research","d":"Interactive setup wizard that configures a new project for the social-science-research plugin. Asks the user questions about their field, institution, journals, datasets, key researchers, and R color palette, then writes the answers into references/domain-profile.md and CLAUDE.md. Make sure to use this skill first whenever a user is starting fresh or wants to configure the plugin. Triggers include: \"set up my project\", \"configure the plugin\", \"run setup\", \"initialize this project\", \"I just installed the plugin\", \"set my field\", \"set my institution\", \"configure my domain profile\", or any request to personalize the plugin for a specific research context.","p":"skills/15-Felpix-Studios-social-science-research/skills/research-setup/SKILL.md"},{"n":"review-paper","c":"15-Felpix-Studios-social-science-research","d":"Comprehensive manuscript review covering argument structure, econometric specification, citation completeness, and potential referee objections. Make sure to use this skill whenever the user wants substantive academic feedback on a paper — not just surface edits. Triggers include: \"review my paper\", \"give me feedback on this draft\", \"what would a referee say\", \"anticipate referee objections\", \"act as a referee\", \"check my identification strategy\", \"is my argument convincing\", \"review this manuscript\", \"critique my paper\", \"will this pass review\", or any request for deep critique of academic writing beyond typos and grammar.","p":"skills/15-Felpix-Studios-social-science-research/skills/review-paper/SKILL.md"},{"n":"review-r","c":"15-Felpix-Studios-social-science-research","d":"Run the R code review protocol on R scripts. Checks code quality, reproducibility, domain correctness, and professional standards. Produces a report without editing files. Make sure to use this skill whenever the user wants their existing R code evaluated or audited — not when they want new analysis written. Triggers include: \"review my R script\", \"check my R code\", \"is my code replication-ready\", \"audit this R file\", \"does this code follow conventions\", \"will this reproduce\", \"check my analysis script\", \"code review\", \"review-r\", or when the user has an existing .R file and wants quality feedback rather than new code.","p":"skills/15-Felpix-Studios-social-science-research/skills/review-r/SKILL.md"},{"n":"validate-bib","c":"15-Felpix-Studios-social-science-research","d":"Validate bibliography entries against citations in all source files. Find missing entries and unused references. Make sure to use this skill whenever the user has any concern about bibliography completeness or citation keys. Triggers include: \"validate my bib\", \"check my citations\", \"find missing references\", \"I'm getting undefined citation errors\", \"are all my citations in the bib file\", \"check for unused references\", \"my bibliography is broken\", \"missing bib entries\", \"citation not found\", or after adding new references from a lit review or before submission.","p":"skills/15-Felpix-Studios-social-science-research/skills/validate-bib/SKILL.md"},{"n":"write-paper","c":"15-Felpix-Studios-social-science-research","d":"Draft a full academic paper manuscript from analysis outputs, project spec, and lit review. Make sure to use this skill whenever the user wants to turn completed analysis into a written paper — not to run analysis or review existing writing. Triggers include: \"write the paper\", \"draft the manuscript\", \"write up the results\", \"start the paper\", \"turn my results into a paper\", \"write the introduction\", \"draft the empirics section\", \"I have my results, now write the paper\", \"help me write this up\", \"write the abstract\", or any request to produce academic prose from existing research outputs.","p":"skills/15-Felpix-Studios-social-science-research/skills/write-paper/SKILL.md"},{"n":"analyze","c":"16-hsantanna88-clo-author","d":"End-to-end data analysis dispatching Coder and Data-engineer for implementation, coder-critic for review. Supports R, Stata, Python, Julia. Replaces /data-analysis.","p":"skills/16-hsantanna88-clo-author/dot-claude/skills/analyze/SKILL.md"},{"n":"discover","c":"16-hsantanna88-clo-author","d":"Discovery phase combining research interviews, literature search, data discovery, and ideation. Routes to appropriate agents based on arguments. Replaces /interview-me, /lit-review, /find-data, /research-ideation.","p":"skills/16-hsantanna88-clo-author/dot-claude/skills/discover/SKILL.md"},{"n":"new-project","c":"16-hsantanna88-clo-author","d":"Full research pipeline from idea to paper. Orchestrates all phases — discovery, strategy, analysis, writing, peer review, and submission. Use when starting a new research project from scratch.","p":"skills/16-hsantanna88-clo-author/dot-claude/skills/new-project/SKILL.md"},{"n":"review","c":"16-hsantanna88-clo-author","d":"All quality reviews — routes to appropriate critics based on target file type and flags. Replaces /paper-excellence, /proofread, /econometrics-check, /review-r, /review-paper.","p":"skills/16-hsantanna88-clo-author/dot-claude/skills/review/SKILL.md"},{"n":"revise","c":"16-hsantanna88-clo-author","d":"R&R cycle — classify referee comments and route to appropriate agents. Replaces /respond-to-referee.","p":"skills/16-hsantanna88-clo-author/dot-claude/skills/revise/SKILL.md"},{"n":"strategize","c":"16-hsantanna88-clo-author","d":"Design identification strategy or pre-analysis plan. Dispatches Strategist (proposer) and strategist-critic (validator). Replaces /identify and /pre-analysis-plan.","p":"skills/16-hsantanna88-clo-author/dot-claude/skills/strategize/SKILL.md"},{"n":"submit","c":"16-hsantanna88-clo-author","d":"Submission pipeline — journal targeting, replication package, audit, and final gate. Replaces /submit, /target-journal, /audit-replication, /data-deposit.","p":"skills/16-hsantanna88-clo-author/dot-claude/skills/submit/SKILL.md"},{"n":"talk","c":"16-hsantanna88-clo-author","d":"Create and audit presentations (Beamer or Quarto RevealJS). Combines talk creation, visual audit, and compilation. Replaces /create-talk, /visual-audit, /compile-latex (for talks).","p":"skills/16-hsantanna88-clo-author/dot-claude/skills/talk/SKILL.md"},{"n":"tools","c":"16-hsantanna88-clo-author","d":"Utility commands — commit, compile, validate-bib, journal, context-status, deploy, learn. Replaces individual utility skills.","p":"skills/16-hsantanna88-clo-author/dot-claude/skills/tools/SKILL.md"},{"n":"write","c":"16-hsantanna88-clo-author","d":"Draft academic paper sections with notation protocol, anti-hedging, and humanizer pass. Replaces /draft-paper and /humanizer.","p":"skills/16-hsantanna88-clo-author/dot-claude/skills/write/SKILL.md"},{"n":"agent-authoring","c":"17-DAAF-Contribution-Community-daaf","d":"Guide for creating DAAF agent definition files. Covers 12-section template, hook registration, skills-in-frontmatter, integration checklist. Use when adding or revising agents. For SKILL.md files, use skill-authoring instead.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/agent-authoring/SKILL.md"},{"n":"daaf-orchestrator","c":"17-DAAF-Contribution-Community-daaf","d":"Operational framework for the DAAF orchestrator. Defines engagement modes, confirmation protocol, subagent dispatch, context budget, and reference-loading. Loaded exclusively by the orchestrator — not for subagents or user questions.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/daaf-orchestrator/SKILL.md"},{"n":"data-scientist","c":"17-DAAF-Contribution-Community-daaf","d":"Data science methodology for Python research: EDA, validation, causal inference (IV, DiD, RD, synthetic control), clustering/PCA/UMAP, supervised ML, geospatial, visualization. Method selection guidance. For syntax, load tool-specific skills.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/data-scientist/SKILL.md"},{"n":"education-data-context","c":"17-DAAF-Contribution-Community-daaf","d":"Interpretation guidance for Urban Institute Portal datasets. Coded values (-1/-2/-3), year definitions, grade encoding, suppression, licensing, cross-source joins. Use when interpreting Portal data before analysis. Routes to source-specific skills.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-context/SKILL.md"},{"n":"education-data-explorer","c":"17-DAAF-Contribution-Community-daaf","d":"Discovers education data from Urban Institute Portal: endpoints, variables, year coverage, join keys (CCD, IPEDS, CRDC, Scorecard, SAIPE). Use to map questions to data. Load before education-data-query — discovery here, download there.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-explorer/SKILL.md"},{"n":"education-data-query","c":"17-DAAF-Contribution-Community-daaf","d":"Downloads education datasets from configured mirror sources (parquet/CSV) with local Polars filtering. Use when writing fetch scripts or retrieving CCD, IPEDS, CRDC, SAIPE data. Load after education-data-explorer — retrieval here, not discovery.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-query/SKILL.md"},{"n":"education-data-source-campus-safety","c":"17-DAAF-Contribution-Community-daaf","d":"CSS — annual Clery Act crime/fire safety for Title IV institutions. Portal: hate crimes only (2005-2021); primary offenses, VAWA, arrests, fire safety need ope.ed.gov directly. Use for campus crime analysis. Identified by IPEDS unitid.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-campus-safety/SKILL.md"},{"n":"education-data-source-ccd","c":"17-DAAF-Contribution-Community-daaf","d":"CCD — federal universe of all U.S. public K-12 schools (~100K) and districts (~18K). Enrollment, staffing, finance, directory data (1986-present). Use for public school analysis by grade/race/sex. Public only; excludes private and postsecondary.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-ccd/SKILL.md"},{"n":"education-data-source-crdc","c":"17-DAAF-Contribution-Community-daaf","d":"CRDC — biennial OCR survey of all U.S. public schools (2011-2021). Discipline, course access, harassment, restraint/seclusion by race/sex/disability/EL. Use for civil rights and equity analysis. 2020-21 COVID-impacted; 2011-14 sampled, not universe.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-crdc/SKILL.md"},{"n":"education-data-source-eada","c":"17-DAAF-Contribution-Community-daaf","d":"EADA — college athletics gender equity (~2,000+ institutions, 2002-2021). Participation, coaching, salaries, expenses, revenues, athletic aid by gender. Not Title IX compliance data. No sector column; join IPEDS on unitid for institution type.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-eada/SKILL.md"},{"n":"education-data-source-edfacts","c":"17-DAAF-Contribution-Community-daaf","d":"EDFacts — K-12 outcomes: assessment proficiency, ACGR graduation rates, ESSA accountability at school/district level (2009-2020). Within-state trends and subgroup gaps. Complements CCD with outcome data. Cannot compare across states — use NAEP.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-edfacts/SKILL.md"},{"n":"education-data-source-fsa","c":"17-DAAF-Contribution-Community-daaf","d":"FSA — Title IV aid at institution level (~5,500 institutions, 1999-2021). Pell Grants, Direct/PLUS loans, campus-based aid, financial responsibility scores, 90/10 metrics. Use for aid distribution, loan volume, or for-profit analysis. By unitid.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-fsa/SKILL.md"},{"n":"education-data-source-ipeds","c":"17-DAAF-Contribution-Community-daaf","d":"IPEDS — primary federal postsecondary data (~6,500 institutions, 1980-present): enrollment, completions, graduation rates, finance, aid, admissions, HR. For college/university analysis. Grad rates = first-time full-time; finance needs GASB/FASB care.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-ipeds/SKILL.md"},{"n":"education-data-source-meps","c":"17-DAAF-Contribution-Community-daaf","d":"MEPS — Urban Institute modeled school-level poverty (% at 100% FPL), from CCD + SAIPE (public schools, 2009-2022, 2-3yr lag). Use when FRPL is unreliable due to CEP. Consistent cross-state measurement. Public schools only.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-meps/SKILL.md"},{"n":"education-data-source-nacubo","c":"17-DAAF-Contribution-Community-daaf","d":"NACUBO endowment data (~650 institutions, 2012-2022). Portal: 7 columns only (total endowment, per-FTE, YoY change). Use for endowment size/trends. Full investment/spending needs direct NACUBO access. For all-institution coverage use IPEDS finance.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-nacubo/SKILL.md"},{"n":"education-data-source-nccs","c":"17-DAAF-Contribution-Community-daaf","d":"NCCS — Form 990 data for private nonprofit colleges (Portal: IPEDS-matched, 1993-2016). Revenue, expenses, assets, endowment, governance beyond IPEDS. Use when IRS financial depth needed. Portal ends 2016; public institutions excluded (no Form 990).","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-nccs/SKILL.md"},{"n":"education-data-source-nhgis","c":"17-DAAF-Contribution-Community-daaf","d":"NHGIS — census geography crosswalks via Portal: links schools (ncessch) and colleges (unitid) to tracts, block groups, CBSAs (1990-2020). Census demographics NOT in Portal — access NHGIS directly. Use for linking education data to census geography.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-nhgis/SKILL.md"},{"n":"education-data-source-pseo","c":"17-DAAF-Contribution-Community-daaf","d":"PSEO — Census data linking graduates to employment via LEHD wage records. Earnings percentiles at 1/5/10 years post-graduation by institution, degree, CIP. Use for graduate earnings analysis. Coverage: ~29% of graduates from ~31 states.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-pseo/SKILL.md"},{"n":"education-data-source-saipe","c":"17-DAAF-Contribution-Community-daaf","d":"SAIPE — annual Census poverty estimates for school districts (Portal; county/state not in Portal). Use for district poverty, Title I context, or trends. ~18-month lag. No race/ethnicity disaggregation at district level — use ACS 5-year for that.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-saipe/SKILL.md"},{"n":"education-data-source-scorecard","c":"17-DAAF-Contribution-Community-daaf","d":"College Scorecard — post-enrollment outcomes linking aid records to IRS/Treasury earnings. Earnings, loan repayment, debt via six Portal sub-datasets. Use when tax-record-based earnings needed. Tracks only Title IV aid recipients, not all students.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/education-data-source-scorecard/SKILL.md"},{"n":"election-data-source-countypres","c":"17-DAAF-Contribution-Community-daaf","d":"County Presidential Returns 2000-2024 (MIT MEDSL). Vote shares, party trends, turnout by county_fips (joins census/education data). Requires HARVARD_DATAVERSE_API_KEY. Critical: mode='TOTAL' drops ~1K counties post-2020 — use 3-pattern reconstruction","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/election-data-source-countypres/SKILL.md"},{"n":"geopandas","c":"17-DAAF-Contribution-Community-daaf","d":"Spatial data: GeoDataFrames, spatial joins, CRS/projections, choropleth/interactive maps, spatial autocorrelation, PySAL. Use for geographic data, spatial files (Shapefile, GeoPackage, GeoParquet), or spatial stats. For charts without GIS use plotly.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/geopandas/SKILL.md"},{"n":"linearmodels","c":"17-DAAF-Contribution-Community-daaf","d":"Panel data, IV/GMM, system regression. PanelOLS (FE/RE), BetweenOLS, Fama-MacBeth, IV2SLS/LIML/GMM, SUR, 3SLS, Driscoll-Kraay SEs. Use for RE/between, system estimation, or GMM. Complements pyfixest (FE + DiD) and statsmodels (GLM + time series).","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/linearmodels/SKILL.md"},{"n":"marimo","c":"17-DAAF-Contribution-Community-daaf","d":"Reactive Python notebook system. Cell reactivity, UI elements (sliders, dropdowns, tables), SQL cells, plotting, app deployment. Use when assembling Stage 9 notebooks, building data apps, or converting Jupyter to marimo .py format.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/marimo/SKILL.md"},{"n":"plotly","c":"17-DAAF-Contribution-Community-daaf","d":"Plotly interactive visualization. Express and Graph Objects: scatter, line, bar, heatmap, 3D, geographic charts; subplots; styling; export. Use when interactivity (hover/zoom) is needed. For static figures use plotnine; for GIS use geopandas.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/plotly/SKILL.md"},{"n":"plotnine","c":"17-DAAF-Contribution-Community-daaf","d":"plotnine static visualization (ggplot2 syntax for Python). Geoms, aesthetics, scales, coordinates, facets, themes. Use for static publication-quality figures with grammar-of-graphics syntax. For interactive charts use plotly; for maps use geopandas.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/plotnine/SKILL.md"},{"n":"polars","c":"17-DAAF-Contribution-Community-daaf","d":"Polars DataFrame library for high-performance data manipulation. Lazy/eager execution, expressions, I/O (CSV, Parquet, JSON), aggregations, joins, string/datetime ops, pandas interop. Use for Polars DataFrames or reading/writing Parquet files.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/polars/SKILL.md"},{"n":"pyfixest","c":"17-DAAF-Contribution-Community-daaf","d":"Fast high-dimensional fixed effects: OLS, Poisson, IV with multi-way FE; DiD (TWFE, did2s, Sun-Abraham); clustered SEs; etable/coefplot/iplot. Use for FE regressions or DiD. For panel RE/between use linearmodels; for GLM without FE use statsmodels.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/pyfixest/SKILL.md"},{"n":"r-python-translation","c":"17-DAAF-Contribution-Community-daaf","d":"R-to-Python translation for data analysis. Maps R packages (tidyverse, ggplot2, fixest, survey, sf, plm) to Python equivalents (polars, plotnine, pyfixest, svy, geopandas). Use when user has R background or requests R-equivalent code comments.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/r-python-translation/SKILL.md"},{"n":"science-communication","c":"17-DAAF-Contribution-Community-daaf","d":"Translating technical findings for non-technical audiences. Narrative frameworks (Pyramid Principle, SCQA), plain-language translation, executive summaries, policy briefs, causal language. Use when presenting to stakeholders or reviewing deliverables","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/science-communication/SKILL.md"},{"n":"scikit-learn","c":"17-DAAF-Contribution-Community-daaf","d":"Machine learning: clustering, PCA/t-SNE/UMAP, classification, prediction regression (Ridge/Lasso/ensemble), cross-validation, Pipelines. For unsupervised analysis, classification, or prediction. For econometric regression use pyfixest/statsmodels.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/scikit-learn/SKILL.md"},{"n":"skill-authoring","c":"17-DAAF-Contribution-Community-daaf","d":"Guide for creating and auditing DAAF skills (SKILL.md). Covers frontmatter, metadata vocabulary, progressive disclosure, decision trees, reference files. Use when creating, reviewing, or debugging skill loading. For agent files, use agent-authoring.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/skill-authoring/SKILL.md"},{"n":"stata-python-translation","c":"17-DAAF-Contribution-Community-daaf","d":"Stata-to-Python translation for data analysis. Maps Stata commands (reghdfe, xtreg, ivregress, margins, esttab, svy:) to Python (polars, pyfixest, statsmodels, svy). Use when user has Stata background or requests Stata-equivalent code comments.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/stata-python-translation/SKILL.md"},{"n":"statsmodels","c":"17-DAAF-Contribution-Community-daaf","d":"Statistical modeling: OLS/WLS/GLS, GLM (logit, probit, Poisson), time series (ARIMA, VAR), mixed effects, diagnostics. Formula API. Use for regressions without fixed effects, GLMs, or time series. For FE/DiD use pyfixest; panel/IV use linearmodels.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/statsmodels/SKILL.md"},{"n":"svy","c":"17-DAAF-Contribution-Community-daaf","d":"Complex survey analysis: strata/PSU/weights, variance estimation (Taylor, BRR, jackknife, bootstrap), survey GLM, domain analysis, calibration. Polars-native. Use for NHANES, CPS, ACS PUMS, BRFSS, DHS. Non-survey regression: statsmodels/pyfixest.","p":"skills/17-DAAF-Contribution-Community-daaf/dot-claude/skills/svy/SKILL.md"},{"n":"stata-accounting-research","c":"18-jusi-aalto-stata-accounting-research","d":"STATA code pattern library for empirical archival accounting research. Provides tested syntax from 126 peer-reviewed JAR (Journal of Accounting Research) replication files (2017-2025). Use when the user asks procedural questions like \"How do I implement [method]?\" or \"Show me code for [technique]\" — including: entropy balancing, propensity score matching (PSM), difference-in-differences (DiD), regression discontinuity (RDD), instrumental variables (IV), event studies (CAR/BHAR), survival analysis, Fama-MacBeth regressions, bootstrap, quantile regression, reghdfe/xtreg/areg, clustering standard errors, fixed effects, esttab/outreg2 table formatting, winsorization, leads/lags. Users can specify their variables (e.g., treatment, outcomes, controls) and receive adapted syntax. NOTE: This skill provides code patterns from published papers, not research design advice.","p":"skills/18-jusi-aalto-stata-accounting-research/SKILL.md"},{"n":"python-econ-computing","c":"20-wenddymacro-python-econ-skill","d":"Use when writing Python code for DSGE models, HANK models, numerical economic computation, causal inference, or quantitative economic data analysis","p":"skills/20-wenddymacro-python-econ-skill/SKILL.md"},{"n":"apsa-style","c":"22-christopherkenny-skills","d":"APSA style checker for Quarto (.qmd) files. Checks numbers, capitalization, abbreviations, italics, in-text citations, titles of works, neutral and unbiased language, and APSA-specific terminology against the APSA Style Manual for Political Science (2018, updated 2023). Produces a structured markdown report organized by document section — never modifies the source file. Use when asked to check APSA style, fix citations, review capitalization, check number formatting, or flag biased language in a .qmd document. For grammar, spelling, and punctuation, use the proofread skill instead. Supports an optional output-file argument and an optional @sec-label argument to restrict checking to one section.","p":"skills/22-christopherkenny-skills/skills/apsa-style/SKILL.md"},{"n":"assess-outline","c":"22-christopherkenny-skills","d":"Assesses a research paper outline (.qmd file) against structured criteria from Kosuke Imai''s empirical research guide. Evaluates the abstract and section outline for: research question clarity, stated contributions, hypotheses and testable implications, data description, planned results and inferential approach, and robustness checks. Detects causal papers from the abstract and conditionally assesses identification strategy only when causal framing is present. Produces a structured markdown report with PASS/PARTIAL/FAIL assessments and actionable suggestions. Use when asked to assess, evaluate, review, or check a paper outline, abstract-and-outline, or research plan in a .qmd file.","p":"skills/22-christopherkenny-skills/skills/assess-outline/SKILL.md"},{"n":"latex-to-quarto","c":"22-christopherkenny-skills","d":"Converts LaTeX article-class .tex documents to Quarto .qmd format for multi-format publishing (HTML, PDF, Word). Use when asked to convert, port, migrate, or translate a .tex LaTeX file to Quarto; when porting an academic paper or manuscript from LaTeX to Quarto; when a .tex document needs to render to HTML, Word, or Typst PDF. Covers preamble → YAML front matter, section headings, text formatting, math, citations (natbib/biblatex), cross-references, figures, tables, lists, footnotes, hyperlinks, and special characters.","p":"skills/22-christopherkenny-skills/skills/latex-to-quarto/SKILL.md"},{"n":"latex-to-typst","c":"22-christopherkenny-skills","d":"Translates LaTeX documents (.tex) to Typst (.typ), focusing on article-class documents. Use when asked to convert, port, migrate, or translate LaTeX to Typst. Covers document structure, text formatting, page layout, math equations and symbols, figures, tables, TikZ-to-CeTZ diagrams, bibliography, cross-references, footnotes, and code blocks. Includes comprehensive symbol mapping tables.","p":"skills/22-christopherkenny-skills/skills/latex-to-typst/SKILL.md"},{"n":"markdown-unwrap","c":"22-christopherkenny-skills","d":"Unwraps hard-wrapped markdown files so that each sentence ends with a newline instead of mid-sentence line breaks. Joins continuation lines within a paragraph into single lines, then re-breaks at sentence boundaries (period, question mark, exclamation point). Preserves blank lines, headings, fenced code blocks, block quotes, and list items. Use when asked to unwrap text, fix line breaks, reflow sentences, or clean up hard-wrapped markdown or .qmd files.","p":"skills/22-christopherkenny-skills/skills/markdown-unwrap/SKILL.md"},{"n":"paper-summary","c":"22-christopherkenny-skills","d":"Writes expert academic paper summaries for social science research, particularly political science and applied statistics. Use when asked to summarize, review, or create a reading summary of an academic paper, PDF, or research article. Accepts a file (PDF or text format) or a directory of papers. Produces a structured markdown summary — approximately 400–600 words — covering primary contributions, major questions and answers with point estimates, methods and data, and limitations and robustness. Includes BibTeX citation retrieved from Google Scholar and keyword metadata.","p":"skills/22-christopherkenny-skills/skills/paper-summary/SKILL.md"},{"n":"proofread","c":"22-christopherkenny-skills","d":"Expert copy editor for Quarto (.qmd) files. Checks grammar, spelling, punctuation, and academic writing quality. Produces a structured markdown report organized by document section — never modifies the source file. Use when asked to proofread, check grammar, fix typos, or review prose in a .qmd document. For APSA style rules (numbers, citations, capitalization, abbreviations, neutral language), use the apsa-style skill instead. Supports an optional output-file argument and an optional @sec-label argument to restrict checking to one section.","p":"skills/22-christopherkenny-skills/skills/proofread/SKILL.md"},{"n":"pseudo-merge","c":"22-christopherkenny-skills","d":"Takes a proofread or apsa-style report file (or any markdown file using **Original:** / **Recommended:** syntax) and rewrites the original source file with git merge conflict markers so the user can accept or reject each suggested edit using VS Code or Positron''s built-in merge conflict UI. Branch names are \"original\" and \"claude-edits\". Use when asked to apply edits, insert conflict markers, or set up merge resolution for a copy-edit report. Supports an optional @sec-label argument to restrict markers to one section.","p":"skills/22-christopherkenny-skills/skills/pseudo-merge/SKILL.md"},{"n":"quarto-clean","c":"22-christopherkenny-skills","d":"Cleans a Quarto (.qmd) file by replacing LaTeX holdovers with proper Quarto/Pandoc syntax so the document renders correctly to HTML, PDF (Typst/LaTeX), and Word. Fixes citations (\\citep → [@key]), cross-references (\\ref → @label), figures (\\includegraphics → markdown), tables, text formatting (\\textbf → **bold**), inline math (\\( \\) → $ $), hyperlinks (\\href → [text](url)), footnotes (\\footnote → ^[]), list environments, section headings, and R Markdown chunk options (dot-style → #| YAML). Use when asked to clean, fix, modernize, or port a Quarto or R Markdown document; when LaTeX commands appear in a .qmd file; when a document fails to render to Word or Typst; or when citations/cross-references do not appear in non-LaTeX output.","p":"skills/22-christopherkenny-skills/skills/quarto-clean/SKILL.md"},{"n":"redistricting-analysis","c":"22-christopherkenny-skills","d":"Redistricting analysis in R using the redistverse ecosystem. Use whenever the user is working with redist, redistmetrics, ggredist, geomander, adj, alarmdata, PL94171, censable, easycensus, tinytiger, baf, rict, or redistio. Covers the complete pipeline: Census and spatial data loading, adjacency graph construction, SMC/MCMC simulation, constraints (population balance, county splits, VRA compliance), convergence diagnostics, plan metrics (compactness, partisan fairness, splits), visualization, summary tables, and interactive plan drawing. Invoke whenever the user mentions redistricting, gerrymandering, district plans, simulation ensembles, or any redistverse package by name.","p":"skills/22-christopherkenny-skills/skills/redistricting-analysis/SKILL.md"},{"n":"write-well","c":"22-christopherkenny-skills","d":"Prose quality checker for Quarto (.qmd) files, grounded in William Zinsser''s *On Writing Well* (30th Anniversary Edition). Checks for clutter, weak verbs, hollow qualifiers, clichés, inflated academic voice, poor leads and endings, pronoun and tense inconsistency, and unclear explanation. Produces a structured markdown report organized by document section — never modifies the source file. Use when asked to improve prose quality, tighten writing, reduce clutter, or apply Zinsser''s writing principles to a draft. For grammar and punctuation, use the proofread skill. For APSA style rules, use the apsa-style skill. Supports an optional output-file argument and an optional @sec-label argument to restrict checking to one section.","p":"skills/22-christopherkenny-skills/skills/write-well/SKILL.md"},{"n":"bayesian-workflow","c":"23-Learning-Bayesian-Statistics-baygent-skills","d":"Opinionated Bayesian modeling workflow with PyMC and ArviZ. Contains critical guardrails (nutpie sampler, prior/posterior predictive checks, LOO-PIT calibration, prior sensitivity checks, 94% HDI, non-centered parameterizations, reproducible seeds) that agents won't apply unprompted — always consult before writing Bayesian model code. Trigger on: building probabilistic/Bayesian models, prior elicitation, MCMC inference, convergence diagnostics (divergences, R-hat, ESS), model comparison (LOO-CV, ELPD, stacking weights), hierarchical/multilevel models, count regressions, logistic regression with uncertainty, prior sensitivity analysis, reporting Bayesian results, or mentions of PyMC, ArviZ, InferenceData, credible intervals, posterior distributions, shrinkage, uncertainty quantification. Also trigger for model comparison, diagnosing sampling problems, choosing priors, or presenting stats to non-technical audiences.","p":"skills/23-Learning-Bayesian-Statistics-baygent-skills/bayesian-workflow/SKILL.md"},{"n":"causal-inference","c":"23-Learning-Bayesian-Statistics-baygent-skills","d":"Production-grade Bayesian causal inference with PyMC, CausalPy, and DoWhy. Enforces DAG-first thinking, mandatory user checkpoints for assumptions, design-specific refutation, and defensible reporting with causal language guardrails. Trigger on: causal inference, causal effect estimation, treatment effects, counterfactuals, difference-in-differences (DiD), synthetic control, regression discontinuity (RDD), interrupted time series (ITS), instrumental variables (IV), propensity scores, DAGs, causal graphs, confounders, backdoor criterion, do-calculus, interventional distributions, pm.do(), pm.observe(), CausalPy, DoWhy, mediation analysis, refutation, sensitivity analysis, parallel trends, placebo tests, or any question of the form \"does X cause Y\" or \"what is the effect of X on Y.\"","p":"skills/23-Learning-Bayesian-Statistics-baygent-skills/causal-inference/SKILL.md"},{"n":"academic-paper","c":"24-Imbad0202-academic-research-skills","d":"Academic paper writing skill with 12-agent pipeline. v2.5: Style Calibration (learn author's writing voice from past papers) + Writing Quality Check (writing quality checklist for natural prose). Supports IMRaD, literature review, theoretical, case study, policy brief, and conference paper structures. APA 7.0 (default), Chicago, MLA, IEEE, Vancouver citation formats. Bilingual abstracts (zh-TW + EN). Multi-format output (LaTeX, DOCX, PDF, Markdown). Triggers on: write paper, academic paper, paper outline, write abstract, revise paper, check citations, convert to LaTeX, guide my paper, parse reviews, revision roadmap, 寫論文, 學術論文, 論文大綱, 寫摘要, 修改論文, 檢查引用, 引導我寫論文, 帶我規劃論文, 逐章規劃, 論文架構, 審查意見, 修訂路線圖.","p":"skills/24-Imbad0202-academic-research-skills/academic-paper/SKILL.md"},{"n":"academic-paper-reviewer","c":"24-Imbad0202-academic-research-skills","d":"Multi-perspective academic paper review with dynamic reviewer personas. Simulates 5 independent reviewers (EIC + 3 peer reviewers + Devil's Advocate) with field-specific expertise. Supports full review, re-review (verification), quick assessment, methodology focus, and Socratic guided modes. Triggers on: review paper, peer review, manuscript review, referee report, review my paper, critique paper, simulate review, editorial review.","p":"skills/24-Imbad0202-academic-research-skills/academic-paper-reviewer/SKILL.md"},{"n":"academic-pipeline","c":"24-Imbad0202-academic-research-skills","d":"Orchestrator for the full academic research pipeline: research -> write -> integrity check -> review -> r con-abstract-writing","c":"27-dariia-m-my_claude_skills","d":"Guide for writing the abstract of an academic economics paper. Use this skill whenever the user asks for help writing, drafting, revising, or structuring an abstract for an economics paper - whether empirical micro, development economics, applied economics, or related fields. Also trigger when the user mentions \"abstract,\" \"paper summary,\" or asks how to compress their findings into a short description. This skill synthesizes best practices from David Evans (CGDev), Marc Bellemare, and patterns observed in top economics journals (AER, QJE, AEJ: Applied, etc.).","p":"skills/27-dariia-m-my_claude_skills/abstract/SKILL.md"},{"n":"academic-writing","c":"27-dariia-m-my_claude_skills","d":"Activate when the user is drafting any academic economics content from scratch (e.g., outlines, abstracts, introductions, data/methods/identification sections, results narratives, conclusions, referee responses, table/figure captions) and needs economics-specific structure, phrasing options, and quality checks to produce publication-ready prose.","p":"skills/27-dariia-m-my_claude_skills/academic_writing/SKILL.md"},{"n":"anti-hallucination","c":"27-dariia-m-my_claude_skills","d":"ALWAYS activate this skill. Apply these rules to every task regardless of domain. This skill governs how Claude Code verifies information, writes code, references documentation, and avoids fabricating functions, arguments, APIs, file paths, data structures, or facts. These rules override any inclination to guess.","p":"skills/27-dariia-m-my_claude_skills/dont-lie/SKILL.md"},{"n":"econ-intro-writing","c":"27-dariia-m-my_claude_skills","d":"Guide for writing the introduction to an academic economics paper. Use this skill whenever the user asks for help writing, drafting, revising, or structuring an introduction to an economics paper - whether empirical micro, development economics, applied economics, or related fields. Also trigger when the user mentions \"intro,\" \"introduction section,\" \"opening paragraphs,\" or asks how to motivate, frame, or present their research question in a paper. This skill synthesizes best practices from David Evans (CGDev), Keith Head, Claudia Sahm, Marc Bellemare, and Deirdre McCloskey.","p":"skills/27-dariia-m-my_claude_skills/econ_intro_writing/SKILL.md"},{"n":"event-study","c":"27-dariia-m-my_claude_skills","d":"Use this skill whenever the user wants to conduct an event study, create event study plots, test for parallel trends, implement difference-in-differences designs, or work with any panel data estimation that involves pre/post treatment comparisons. Trigger on phrases like \"event study\", \"parallel trends\", \"pre-trends\", \"dynamic treatment effects\", \"leads and lags\", \"TWFE\", \"two-way fixed effects\", \"staggered adoption\", \"staggered treatment\", \"difference-in-differences\", \"DiD\", \"Sun and Abraham\", \"Callaway and Sant'Anna\", \"de Chaisemartin\", \"Borusyak\", \"did_multiplegt\", \"fixest\", \"did2s\", \"bacon decomposition\", or any reference to plotting coefficients around a treatment event. Also trigger when the user uploads panel data and wants to estimate treatment effects with variation in treatment timing. All code is in R.","p":"skills/27-dariia-m-my_claude_skills/event-studies/SKILL.md"},{"n":"academic-paper-verify","c":"27-dariia-m-my_claude_skills","d":"Thoroughly verify all code, tables, figures, modeling decisions, and quantitative claims in an academic paper against its source R scripts and output files. Use this skill whenever you need to audit, replicate, or verify an academic research paper - including cross-checking LaTeX tables against R output, validating econometric modeling choices, ensuring sample sizes are consistent, building a verification manifest, and running automated replication tests. Trigger this skill for any mention of: paper verification, replication check, table audit, code-paper consistency, reproducing results, verifying estimates, checking coefficients, or any variant of \"does the paper match the code.\"","p":"skills/27-dariia-m-my_claude_skills/paper_verification/SKILL.md"},{"n":"commit","c":"28-maxwell2732-paper-replicate-agent-demo","d":"Stage, commit, create PR, and merge to main. Use for the standard commit-PR-merge cycle.","p":"skills/28-maxwell2732-paper-replicate-agent-demo/dot-claude/skills/commit/SKILL.md"},{"n":"data-analysis","c":"28-maxwell2732-paper-replicate-agent-demo","d":"End-to-end R data analysis workflow from exploration through regression to publication-ready tables and figures","p":"skills/28-maxwell2732-paper-replicate-agent-demo/dot-claude/skills/data-analysis/SKILL.md"},{"n":"deploy","c":"28-maxwell2732-paper-replicate-agent-demo","d":"Render Quarto slides and sync to docs/ for GitHub Pages deployment. Use when deploying lecture slides after making changes.","p":"skills/28-maxwell2732-paper-replicate-agent-demo/dot-claude/skills/deploy/SKILL.md"},{"n":"devils-advocate","c":"28-maxwell2732-paper-replicate-agent-demo","d":"Challenge a slide deck design with 5-7 specific pedagogical questions. Checks ordering, prerequisites, gaps, alternatives, notation conflicts, cognitive load, and book readiness.","p":"skills/28-maxwell2732-paper-replicate-agent-demo/dot-claude/skills/devils-advocate/SKILL.md"},{"n":"interview-me","c":"28-maxwell2732-paper-replicate-agent-demo","d":"Interactive interview to formalize a research idea into a structured specification with hypotheses and empirical strategy","p":"skills/28-maxwell2732-paper-replicate-agent-demo/dot-claude/skills/interview-me/SKILL.md"},{"n":"lit-review","c":"28-maxwell2732-paper-replicate-agent-demo","d":"Structured literature search and synthesis with citation extraction and gap identification","p":"skills/28-maxwell2732-paper-replicate-agent-demo/dot-claude/skills/lit-review/SKILL.md"},{"n":"proofread","c":"28-maxwell2732-paper-replicate-agent-demo","d":"Run the proofreading protocol on lecture fi riting/templates/graphical-abstract-guide/SKILL.md"},{"n":"novathesis-guide","c":"43-wentorai-research-plugins","d":"LaTeX thesis template supporting multiple universities and formats","p":"skills/43-wentorai-research-plugins/skills/writing/templates/novathesis-guide/SKILL.md"},{"n":"scientific-article-pdf","c":"43-wentorai-research-plugins","d":"Generate publication-ready scientific article PDFs from templates","p":"skills/43-wentorai-research-plugins/skills/writing/templates/scientific-article-pdf/SKILL.md"},{"n":"sjtuthesis-guide","c":"43-wentorai-research-plugins","d":"Write SJTU theses using the SJTUThesis LaTeX template with full compliance","p":"skills/43-wentorai-research-plugins/skills/writing/templates/sjtuthesis-guide/SKILL.md"},{"n":"thesis-template-guide","c":"43-wentorai-research-plugins","d":"Set up LaTeX templates for PhD and Master's thesis documents","p":"skills/43-wentorai-research-plugins/skills/writing/templates/thesis-template-guide/SKILL.md"},{"n":"thesis-writing-guide","c":"43-wentorai-research-plugins","d":"Templates, formatting rules, and strategies for thesis and dissertation writing","p":"skills/43-wentorai-research-plugins/skills/writing/templates/thesis-writing-guide/SKILL.md"},{"n":"thuthesis-guide","c":"43-wentorai-research-plugins","d":"Write Tsinghua University theses using the ThuThesis LaTeX template","p":"skills/43-wentorai-research-plugins/skills/writing/templates/thuthesis-guide/SKILL.md"},{"n":"humanizer_academic","c":"44-matsuikentaro1-humanizer_academic","d":"Remove signs of AI-generated writing from academic medical papers. Use when editing or reviewing manuscripts to make them sound more natural and professionally written. Based on Wikipedia's \"Signs of AI writing\" guide, adapted for medical literature. Detects and fixes patterns including: inflated significance claims, superficial -ing analyses, vague attributions, AI vocabulary words, copula avoidance, excessive hedging, generic conclusions, informal word choices (link
