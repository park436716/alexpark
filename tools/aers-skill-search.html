ed/beyond/via/where/yield), overly assertive causal claims, and artificially condensed expressions. Preserves legitimate academic transitions (Notably, Prior studies have shown, etc.).","p":"skills/44-matsuikentaro1-humanizer_academic/SKILL.md"},{"n":"deslop","c":"45-stephenturner-skill-deslop","d":"Remove AI writing patterns from prose. Use this skill when writing, drafting, editing, reviewing, or revising any text to eliminate predictable AI tells, slop, and formulaic patterns. Trigger this skill whenever the user asks to \"deslop\", \"de-AI\", \"make it sound human,\" \"remove AI patterns,\" \"remove AI tropes,\" \"clean up AI writing,\" fix \"slop,\" \"deslop\" text, or review prose for authenticity. Also use when the user asks you to write or draft anything and wants it to sound natural rather than AI-generated. Common use cases include scientific writing (manuscripts, abstracts, cover letters, grant narratives, discussion sections, peer review responses), blog posts, newsletters, memos, reports, and any other substantial prose.","p":"skills/45-stephenturner-skill-deslop/SKILL.md"},{"n":"stop-slop","c":"46-hardikpandya-stop-slop","d":"Remove AI writing patterns from prose. Use when drafting, editing, or reviewing text to eliminate predictable AI tells.","p":"skills/46-hardikpandya-stop-slop/SKILL.md"},{"n":"avoid-ai-writing","c":"47-conorbronsdon-avoid-ai-writing","d":"Audit and rewrite content to remove AI writing patterns (\"AI-isms\"). Use this skill when asked to \"remove AI-isms,\" \"clean up AI writing,\" \"edit writing for AI patterns,\" \"audit writing for AI tells,\" or \"make this sound less like AI.\" Supports a detection-only mode that flags patterns without rewriting.","p":"skills/47-conorbronsdon-avoid-ai-writing/SKILL.md"},{"n":"chinese-de-aigc","c":"48-copaper-ai-chinese-de-aigc","d":"面向中文学术论文的降 AIGC 检测率 Skill。针对知网、万方、维普、Turnitin 中文版的检测机制，识别并消除中文大语言模型的 17 类结构化写作痕迹。采用\"定位 → 诊断 → 改写 → 自评 → 复查\"五步闭环工作流，分章节差异化策略（摘要/引言/文献综述/方法/结果/讨论/结论），保持学术严谨性前提下通过检测。","p":"skills/48-copaper-ai-chinese-de-aigc/SKILL.md"},{"n":"humanize-chinese","c":"49-voidborne-d-humanize-chinese","d":"Detect and humanize AI-generated Chinese text. 20+ rule detection categories plus statistical features (sentence-length CV, short-sentence fraction, comma density, perplexity, GLTR, DivEye) plus scene-aware LR fusion (rule × 0.2 + LR × 0.8) trained on three scenes: general / academic / longform 长文本 (≥1500 字)。Unified CLI: ./humanize {detect,rewrite,academic,style,compare}. 8 style transforms (casual/zhihu/xiaohongshu/wechat/academic/literary/weibo/novel)。 Multi-paragraph rewriting (paragraph length CV、跨段 trigram 重复) plus best-of-N humanize (默认 N=10 取最低 LR)。165 replacement patterns + CiLin 同义词词林 38873 with collision blacklist。 Academic paper AIGC reduction for CNKI/VIP/Wanfang (知网/维普/万方 AIGC 检测降重)。 Pure Python, no dependencies, offline。v5.0.0 — HC3 fused 准确率 95%、学术 hero 100→35 (-65)、 工作汇报 96→13 (-83)、长篇博客 96→41 (-55)。 Use when user says: \"去AI味\", \"降AIGC\", \"人性化文本\", \"humanize chinese\", \"AI检测\", \"AIGC降重\", \"去除AI痕迹\", \"文本改写\", \"论文降重\", \"知网检测\", \"维普检测\", \"AI写作检测\", \"让文字更自然\", \"detect AI text\", \"humanize text\", \"reduce AIGC score\", \"make text human-like\", \"去ai化\", \"改成人话\", \"去机器味\", \"降低AI率\", \"过AIGC检测\", \"长文本改写\", \"小说改写\"","p":"skills/49-voidborne-d-humanize-chinese/SKILL.md"},{"n":"aer-identification","c":"50-brycewang-aer-skills","d":"Use when selecting, implementing, or stress-testing the causal identification strategy for an empirical economics manuscript — difference-in-differences (including staggered designs), instrumental variables (including weak-IV-robust inference), regression discontinuity, synthetic control, or shift-share / Bartik. Apply before writing the introduction or results.","p":"skills/50-brycewang-aer-skills/skills/aer-identification/SKILL.md"},{"n":"aer-introduction","c":"50-brycewang-aer-skills","d":"Use when drafting or rewriting the introduction of an economics manuscript targeted at AER, AER:Insights, or an AEJ, or when compressing an abstract to the mandatory 100-word limit. Implements the Keith Head / Bellemare five-paragraph formula and AER-specific formatting conventions.","p":"skills/50-brycewang-aer-skills/skills/aer-introduction/SKILL.md"},{"n":"aer-rebuttal","c":"50-brycewang-aer-skills","d":"Use when responding to a Revise & Resubmit decision from AER, AER:Insights, or an AEJ, and a point-by-point response letter plus aligned manuscript revisions are needed. Handles triage, the concede / clarify / push-back decision, and the response-letter format that editors actually read.","p":"skills/50-brycewang-aer-skills/skills/aer-rebuttal/SKILL.md"},{"n":"aer-replication","c":"50-brycewang-aer-skills","d":"Use when assembling the AEA Data and Code Availability deposit for an AER, AER:Insights, or AEJ acceptance, writing the README, or auditing a replication package before the AEA Data Editor review. Implements the current AEA policy, including the February 2026 Data and Code Availability Policy.","p":"skills/50-brycewang-aer-skills/skills/aer-replication/SKILL.md"},{"n":"aer-robustness","c":"50-brycewang-aer-skills","d":"Use when the main empirical results exist but the manuscript lacks the robustness, heterogeneity, mechanism, and placebo checks that AER referees will demand. Apply after aer-identification and before aer-introduction so that the value-added paragraph can reference these tests.","p":"skills/50-brycewang-aer-skills/skills/aer-robustness/SKILL.md"},{"n":"aer-submission","c":"50-brycewang-aer-skills","d":"Use when running the final pre-submission audit for an AER, AER:Insights, or AEJ manuscript — length, format, cover letter, per-author disclosure statements, file packaging, and routing among the AEA journal family. Apply immediately before clicking submit.","p":"skills/50-brycewang-aer-skills/skills/aer-submission/SKILL.md"},{"n":"aer-tables-figures","c":"50-brycewang-aer-skills","d":"Use when constructing or revising regression tables, descriptive statistics tables, or figures for an AER, AER:Insights, or AEJ manuscript. Implements AER booktabs house style, the standard regression-table layout, and the figure-notes convention.","p":"skills/50-brycewang-aer-skills/skills/aer-tables-figures/SKILL.md"},{"n":"aer-topic-selection","c":"50-brycewang-aer-skills","d":"Use when evaluating whether a research idea clears the AER top-5 bar, when routing between AER, AER:Insights, and the AEJ family, or when sharpening a fuzzy contribution sentence into one publishable claim. Apply before any writing begins.","p":"skills/50-brycewang-aer-skills/skills/aer-topic-selection/SKILL.md"},{"n":"aer-workflow","c":"50-brycewang-aer-skills","d":"Use when deciding which AER-skills sub-skill to use next, or when sequencing manuscript work from topic selection through rebuttal for the American Economic Review, AER:Insights, or AEJ journals. Routes — does not replace — the specialized skills.","p":"skills/50-brycewang-aer-skills/skills/aer-workflow/SKILL.md"},{"n":"choosing-causalpy-methods","c":"51-pymc-labs-CausalPy","d":"Choose the appropriate CausalPy experiment class from a causal question, data structure, treatment assignment, and identification assumptions. Use before writing analysis code when the method is not yet settled.","p":"skills/51-pymc-labs-CausalPy/skills/choosing-causalpy-methods/SKILL.md"},{"n":"running-causalpy-experiments","c":"51-pymc-labs-CausalPy","d":"Fit, summarize, plot, and interpret a chosen CausalPy experiment. Use after the causal method has been selected, including when configuring PyMC/sklearn models and scale-aware custom priors.","p":"skills/51-pymc-labs-CausalPy/skills/running-causalpy-experiments/SKILL.md"},{"n":"running-placebo-analysis","c":"51-pymc-labs-CausalPy","d":"Performs placebo-in-time sensitivity analysis with hierarchical null model and optional Bayesian assurance. Use when checking model robustness, verifying lack of pre-intervention effects, or estimating study power.","p":"skills/51-pymc-labs-CausalPy/skills/running-placebo-analysis/SKILL.md"},{"n":"slr-prisma","c":"52-keemanxp-slr-prisma","d":"Guide users through writing a systematic literature review (SLR) following the PRISMA 2020 framework. Use this skill whenever the user mentions 'systematic review', 'systematic literature review', 'SLR', 'PRISMA', 'PRISMA 2020', 'PRISMA flow diagram', 'PRISMA checklist', or asks for help writing, structuring, or auditing a literature review that follows reporting guidelines. Also trigger when the user asks about inclusion/exclusion criteria for a review, search strategies for databases like Scopus/WoS/PubMed, study selection processes, risk of bias assessment, or narrative synthesis for a review paper. This skill covers the full PRISMA 2020 checklist (27 items), produces a Word document manuscript in strict journal article format, generates an annotated PRISMA flow diagram, and enforces APA 7th Edition referencing throughout. It does NOT cover meta-analysis or statistical pooling. By Chuah Kee Man.","p":"skills/52-keemanxp-slr-prisma/SKILL.md"},{"n":"thematic-analysis","c":"53-keemanxp-thematic-analysis-skill","d":"Conduct rigorous thematic analysis (TA) of qualitative data following Braun and Clarke's (2006) six-phase framework. Use whenever the user mentions 'thematic analysis', 'TA', 'Braun and Clarke', 'qualitative coding', 'identifying themes', or asks for help analysing interviews, focus groups, open-ended survey responses, or transcripts to identify patterns. Also trigger for questions about inductive vs theoretical coding, semantic vs latent themes, essentialist vs constructionist epistemology, building a thematic map, or writing up a qualitative findings section. Covers all six phases, the four upfront analytic decisions, the 15-point quality checklist, and the five common pitfalls. Produces a Word document write-up and an annotated thematic map. Does NOT cover IPA, grounded theory, discourse analysis, conversation analysis, or narrative analysis — use a different method for those.","p":"skills/53-keemanxp-thematic-analysis-skill/thematic-analysis/SKILL.md"},{"n":"citation-check","c":"54-scdenney-open-science-skills","d":"Audit in-text/reference parity, DOIs, claim support, and citation style.","p":"skills/54-scdenney-open-science-skills/skills/citation-check/SKILL.md"},{"n":"conjoint-cleaning","c":"54-scdenney-open-science-skills","d":"Clean and reshape Qualtrics conjoint exports to analysis-ready long format.","p":"skills/54-scdenney-open-science-skills/skills/conjoint-cleaning/SKILL.md"},{"n":"conjoint-design","c":"54-scdenney-open-science-skills","d":"Design conjoint experiments: attributes, power, AMCE/AMIE estimation.","p":"skills/54-scdenney-open-science-skills/skills/conjoint-design/SKILL.md"},{"n":"conjoint-diagnostics","c":"54-scdenney-open-science-skills","d":"Diagnose conjoint design integrity, estimation choices, and validity.","p":"skills/54-scdenney-open-science-skills/skills/conjoint-diagnostics/SKILL.md"},{"n":"cross-national-design","c":"54-scdenney-open-science-skills","d":"Design cross-national survey experiments: power, equivalence, localization.","p":"skills/54-scdenney-open-science-skills/skills/cross-national-design/SKILL.md"},{"n":"diverge","c":"54-scdenney-open-science-skills","d":"Before implementing, generate 3-5 conceptually distinct approaches labeled by creativity dimension (Novel, Surprising, Diverse, Conventional), then hold for selection. Brainstorm-then-select to resist defaulting to the most obvious solution.","p":"skills/54-scdenney-open-science-skills/skills/diverge/SKILL.md"},{"n":"fair-check","c":"54-scdenney-open-science-skills","d":"Audit manuscript and replication package against FAIR open-science principles.","p":"skills/54-scdenney-open-science-skills/skills/fair-check/SKILL.md"},{"n":"figure-table-audit","c":"54-scdenney-open-science-skills","d":"Audit figures, tables, captions, cross-references, and statistical notes.","p":"skills/54-scdenney-open-science-skills/skills/figure-table-audit/SKILL.md"},{"n":"figures","c":"54-scdenney-open-science-skills","d":"Design and format publication-quality figures: chart choice, color, scales, legends, captions, reproducibility.","p":"skills/54-scdenney-open-science-skills/skills/figures/SKILL.md"},{"n":"hypothesis-building","c":"54-scdenney-open-science-skills","d":"Build falsifiable causal hypotheses: DAGs, FPCI, equivalence testing.","p":"skills/54-scdenney-open-science-skills/skills/hypothesis-building/SKILL.md"},{"n":"journal-review","c":"54-scdenney-open-science-skills","d":"Draft a senior peer-review report on a social-science manuscript.","p":"skills/54-scdenney-open-science-skills/skills/journal-review/SKILL.md"},{"n":"list-experiment","c":"54-scdenney-open-science-skills","d":"Design and diagnose list experiments (item count technique).","p":"skills/54-scdenney-open-science-skills/skills/list-experiment/SKILL.md"},{"n":"literature-review","c":"54-scdenney-open-science-skills","d":"Build or audit a literature review: evidence map, gaps, synthesis plan.","p":"skills/54-scdenney-open-science-skills/skills/literature-review/SKILL.md"},{"n":"methods-reporting","c":"54-scdenney-open-science-skills","d":"Check methods reporting against CONSORT, JARS, DA-RT standards.","p":"skills/54-scdenney-open-science-skills/skills/methods-reporting/SKILL.md"},{"n":"narrative-building","c":"54-scdenney-open-science-skills","d":"Draft scientific introductions: argument logic, framing, multi-experiment coherence.","p":"skills/54-scdenney-open-science-skills/skills/narrative-building/SKILL.md"},{"n":"paper-review-lite","c":"54-scdenney-open-science-skills","d":"Pre-submission audit: argument, numerics, refs, writing, figures, replication.","p":"skills/54-scdenney-open-science-skills/skills/paper-review-lite/SKILL.md"},{"n":"post-ocr-cleanup","c":"54-scdenney-open-science-skills","d":"Clean post-OCR text: correction, QA, multilingual handling, provenance.","p":"skills/54-scdenney-open-science-skills/skills/post-ocr-cleanup/SKILL.md"},{"n":"pre-registration-writing","c":"54-scdenney-open-science-skills","d":"Write pre-analysis plans: PAP structure, registry, analysis strategy.","p":"skills/54-scdenney-open-science-skills/skills/pre-registration-writing/SKILL.md"},{"n":"replication-package","c":"54-scdenney-open-science-skills","d":"Scaffold or audit a social-science replication package at a target directory. Generates folder structure, README, master.R, figure/table crosswalk, codebook template, LICENSE placeholder, and pre-release checklist. Adapted from Yusaku Horiuchi's replication-package-guide with FAIR-principle integration; platform-neutral (Harvard Dataverse, OSF, Zenodo, GitHub releases, institutional archives).","p":"skills/54-scdenney-open-science-skills/skills/replication-package/SKILL.md"},{"n":"survey-design","c":"54-scdenney-open-science-skills","d":"Design survey instruments: questions, scales, flow, social desirability.","p":"skills/54-scdenney-open-science-skills/skills/survey-design/SKILL.md"},{"n":"tables","c":"54-scdenney-open-science-skills","d":"Design and format publication-quality tables: column order, row grouping, notes, precision, reproducibility.","p":"skills/54-scdenney-open-science-skills/skills/tables/SKILL.md"},{"n":"text-classification","c":"54-scdenney-open-science-skills","d":"LLM-based text classification: codebook, validation, agreement statistics.","p":"skills/54-scdenney-open-science-skills/skills/text-classification/SKILL.md"},{"n":"topic-modeling","c":"54-scdenney-open-science-skills","d":"Structural topic modeling: STM spec, topic count, coherence-exclusivity.","p":"skills/54-scdenney-open-science-skills/skills/topic-modeling/SKILL.md"},{"n":"vlm-ocr-pipeline","c":"54-scdenney-open-science-skills","d":"VLM-based OCR pipeline: model selection, prompts, architecture, evaluation.","p":"skills/54-scdenney-open-science-skills/skills/vlm-ocr-pipeline/SKILL.md"},{"n":"r-bayes","c":"55-ab604-claude-code-r-skills","d":"Patterns for Bayesian inference in R using brms, including multilevel models, DAG validation, and marginal effects. Use when performing Bayesian analysis.","p":"skills/55-ab604-claude-code-r-skills/skills/r-bayes/SKILL.md"},{"n":"r-oop","c":"55-ab604-claude-code-r-skills","d":"R object-oriented programming guide for S7, S3, S4, and vctrs. Use when designing R classes or choosing an OOP system.","p":"skills/55-ab604-claude-code-r-skills/skills/r-oop/SKILL.md"},{"n":"r-package-development","c":"55-ab604-claude-code-r-skills","d":"R package development guide covering dependencies, API design, testing, and documentation. Use when developing R packages.","p":"skills/55-ab604-claude-code-r-skills/skills/r-package-development/SKILL.md"},{"n":"r-performance","c":"55-ab604-claude-code-r-skills","d":"R performance best practices including profiling, benchmarking, vctrs, and optimization strategies. Use when optimizing R code.","p":"skills/55-ab604-claude-code-r-skills/skills/r-performance/SKILL.md"},{"n":"r-style-guide","c":"55-ab604-claude-code-r-skills","d":"R style guide covering naming conventions, spacing, layout, and function design best practices. Use when writing R code.","p":"skills/55-ab604-claude-code-r-skills/skills/r-style-guide/SKILL.md"},{"n":"rlang-patterns","c":"55-ab604-claude-code-r-skills","d":"rlang metaprogramming patterns for data-masking, injection operators, and dynamic dots. Use when writing functions that use tidy evaluation.","p":"skills/55-ab604-claude-code-r-skills/skills/rlang-patterns/SKILL.md"},{"n":"tdd-workflow","c":"55-ab604-claude-code-r-skills","d":"Test-driven development workflow for R using testthat. Use when writing new features, fixing bugs, or refactoring code. Enforces test-first development with 80%+ coverage.","p":"skills/55-ab604-claude-code-r-skills/skills/tdd-workflow/SKILL.md"},{"n":"tidyverse-patterns","c":"55-ab604-claude-code-r-skills","d":"Modern tidyverse patterns for R including pipes, joins, grouping, purrr, and stringr. Use when writing tidyverse R code.","p":"skills/55-ab604-claude-code-r-skills/skills/tidyverse-patterns/SKILL.md"},{"n":"econ-write","c":"56-hanlulong-econ-writing-skill","d":"Expert economics paper writing assistant synthesizing advice from 50+ top guides by Cochrane, McCloskey, Shapiro, Head, Bellemare, Goldin, Glaeser, Kremer, and other leading economists. USE THIS SKILL whenever the user writes, edits, reviews, rewrites, or structures any economics paper, thesis, job market paper, abstract, introduction, conclusion, results section, literature review, or referee response. Also handles LaTeX formatting, presentations, and paper audits. Covers all paper types (applied, theory, structural, mixed) and all sections.","p":"skills/56-hanlulong-econ-writing-skill/econ-write/SKILL.md"},{"n":"EdgarTools","c":"57-dgunning-edgartools","d":"Query and analyze SEC filings using EdgarTools","p":"skills/57-dgunning-edgartools/skills/core/SKILL.md"},{"n":"briefing-note","c":"58-charlescoverdale-econstack","d":"Structured policy briefing note (1-2 pages). Issue, background, analysis, options, recommendation. UK GES, Australian Treasury, consulting formats. Auto-populates from econstack data skills.","p":"skills/58-charlescoverdale-econstack/briefing-note/SKILL.md"},{"n":"cost-benefit","c":"58-charlescoverdale-econstack","d":"Cost-benefit analysis. Produces economic NPV and financial NPV side by side, with BCR, optimism bias (with mitigation), Marginal Excess Tax Burden, real-terms rebasing, WELLBY / QALY / VPF wellbeing valuation, sensitivity, switching values, EANC for unequal-life options, validation gate, and a one-line headline verdict (socially worthwhile vs financially self-sustaining). Backed by the greenbook R package (HM Treasury Green Book primitives) when available, with graceful fallback. Supports HMT Green Book, EU Better Regulation, World Bank, ADB, and Victorian HVHR. Reads a longlist markdown file directly via --from.","p":"skills/58-charlescoverdale-econstack/cost-benefit/SKILL.md"},{"n":"econ-audit","c":"58-charlescoverdale-econstack","d":"Audit economic analysis outputs (fiscal briefings, macro briefings, market research, longlists, and other quantitative economic documents) against methodology standards, academic literature, and common errors. Runs structured checks across core categories including counterfactual, additionality, discounting, double counting, distributional analysis, Aqua Book RIGOUR, and Flyvbjerg-style strategic misrepresentation detection. Returns a RAG scorecard with issues ranked by severity.","p":"skills/58-charlescoverdale-econstack/econ-audit/SKILL.md"},{"n":"fiscal-briefing","c":"58-charlescoverdale-econstack","d":"Public finances briefing. Supports UK, US, and Australia. Produces a single compact briefing on borrowing, debt, receipts, spending, and fiscal rules. Optional debt sustainability analysis via the debtkit R package. User-selectable sub-components and multi-format export.","p":"skills/58-charlescoverdale-econstack/fiscal-briefing/SKILL.md"},{"n":"longlist","c":"58-charlescoverdale-econstack","d":"Brainstorm a longlist of benefits and costs for a project. Outputs two clean tables (benefits and costs), each with materiality (H/M/L), a cash flow tag (cash in / cash out / non-cash), a quantification method, and a monetisation method. Supports HMT Green Book, EU Better Regulation Guidelines, World Bank, Asian Development Bank, and the Victorian Treasury High Value High Risk (HVHR) framework.","p":"skills/58-charlescoverdale-econstack/longlist/SKILL.md"},{"n":"macro-briefing","c":"58-charlescoverdale-econstack","d":"Macroeconomic monitor. Supports UK, US, Euro area, and Australia. Pulls GDP, inflation, employment, wages, rates, trade, housing, and fiscal data. Each country follows its central bank's reporting structure. Produces a single clean briefing with a traffic-light assessment and user-selectable sub-components.","p":"skills/58-charlescoverdale-econstack/macro-briefing/SKILL.md"},{"n":"market-research","c":"58-charlescoverdale-econstack","d":"Industry and market research. Market sizing, structure, competition, regulation, supply chains, pricing, M&A. Produces a single compact, source-cited research report with Porter's Five Forces, HHI / CR4, PESTLE, and trade flows. Supports UK, US, EU, Australia, and global scope, with multi-geography comparison.","p":"skills/58-charlescoverdale-econstack/market-research/SKILL.md"},{"n":"openalex","c":"59-shiquda-openalex-skill","d":"Use when the user asks about academic literature, research papers, scholarly works, authors, citations, institutions, journals, or any academic metadata. Trigger when users want to search for papers, find author profiles, track citations, discover related works, or explore academic topics. Also use when users mention DOIs, ORCIDs, h-index, publication venues, or research metrics.","p":"skills/59-shiquda-openalex-skill/openalex/SKILL.md"},{"n":"academic-baseline","c":"60-regisely-superpapers","d":"Use when working on any empirical academic research context — paper writing, data analysis, literature review, or any task involving citations, results, or publication artifacts. Establishes non-negotiable principles that govern all other superpapers skills.","p":"skills/60-regisely-superpapers/skills/academic-baseline/SKILL.md"},{"n":"brainstorm","c":"60-regisely-superpapers","d":"Use when starting a new research project, exploring a research idea, deciding whether a question is viable, or before touching code or data for a new paper. Runs a research-focused brainstorm that clarifies research question, identification strategy, data feasibility, and contribution before any implementation.","p":"skills/60-regisely-superpapers/skills/brainstorm/SKILL.md"},{"n":"citation-management","c":"60-regisely-superpapers","d":"Use when adding citations to a .bib file, importing references by DOI, cleaning a bibliography, detecting duplicate entries, or normalizing citation keys. Uses direct .bib manipulation with CrossRef API for metadata resolution — no external tool dependencies.","p":"skills/60-regisely-superpapers/skills/citation-management/SKILL.md"},{"n":"compile-latex","c":"60-regisely-superpapers","d":"Use when compiling a LaTeX paper, debugging LaTeX errors, building a paper PDF, or when a .tex file fails to produce output. Handles engine detection (xelatex vs pdflatex), bibliography systems (biber vs bibtex), and multi-pass compilation.","p":"skills/60-regisely-superpapers/skills/compile-latex/SKILL.md"},{"n":"data-collection","c":"60-regisely-superpapers","d":"Use when collecting data for a research project, downloading time series, building a dataset, accessing economic or social data APIs, or scraping data from a non-API source. Handles source discovery, respectful collection, local caching, and manifest documentation.","p":"skills/60-regisely-superpapers/skills/data-collection/SKILL.md"},{"n":"execute-plan","c":"60-regisely-superpapers","d":"Use when a research implementation plan exists in docs/superpapers/plans/ and the user is ready to execute it — collecting data, running analysis, producing outputs, writing the paper. Orchestrates task execution with replication-driven verification and two-stage review at phase boundaries.","p":"skills/60-regisely-superpapers/skills/execute-plan/SKILL.md"},{"n":"journal-guidelines","c":"60-regisely-superpapers","d":"Use when preparing a paper for submission to a specific journal, checking formatting requirements, parsing instructions for authors, building a submission checklist, or adapting a paper to a journal template. Fetches the journal's official guidelines via web and produces a verifiable checklist.","p":"skills/60-regisely-superpapers/skills/journal-guidelines/SKILL.md"},{"n":"journal-selection","c":"60-regisely-superpapers","d":"Use when choosing a target journal for a paper, comparing journal rankings, asking \"where should I submit this\", or building a submission strategy across multiple journals. Field-agnostic — detects the paper's research area and suggests appropriate outlets across tiers.","p":"skills/60-regisely-superpapers/skills/journal-selection/SKILL.md"},{"n":"literature-search","c":"60-regisely-superpapers","d":"Use when the user asks to search for papers, review literature, find references on a topic, verify a paper exists, or build a bibliography. Enforces web verification of every citation via web fetch to prevent hallucinated references.","p":"skills/60-regisely-superpapers/skills/literature-search/SKILL.md"},{"n":"paper-review","c":"60-regisely-superpapers","d":"Use when a paper is complete or near-complete and a holistic pre-submission audit is needed. Cross-cuts text, code, tables, figures, results, citations, and reproducibility in a single pass and produces a persistent audit report. Works standalone on papers written outside the plugin.","p":"skills/60-regisely-superpapers/skills/paper-review/SKILL.md"},{"n":"paper-writing","c":"60-regisely-superpapers","d":"Use when drafting, rewriting, reviewing, or auditing prose for any section of an empirical academic paper (Abstract, Introduction, Methods, Data, Results, Discussion, Conclusion) or specialized output (job market paper, grant proposal, policy brief, referee response).","p":"skills/60-regisely-superpapers/skills/paper-writing/SKILL.md"},{"n":"replication-driven-research","c":"60-regisely-superpapers","d":"Use when starting empirical analysis, creating a data pipeline, generating results, or when data or model specifications change. Enforces end-to-end reproducibility — every number in the paper must be regenerable from raw data by a script with a fixed seed. Replaces TDD for the research domain.","p":"skills/60-regisely-superpapers/skills/replication-driven-research/SKILL.md"},{"n":"robustness-checks","c":"60-regisely-superpapers","d":"Use when a main specification has produced a result, when preparing a paper appendix, when a reviewer requests robustness, or before declaring any empirical finding final. Guides selection of design-appropriate checks without mandating a fixed checklist.","p":"skills/60-regisely-superpapers/skills/robustness-checks/SKILL.md"},{"n":"statistical-modeling","c":"60-regisely-superpapers","d":"Use when estimating a statistical or econometric model, running a regression, specifying an identification strategy, testing a hypothesis, or fitting any model to empirical data. Guides the process (assumptions, estimation, reporting, diagnostics) without forcing a fixed method list.","p":"skills/60-regisely-superpapers/skills/statistical-modeling/SKILL.md"},{"n":"tables-and-figures","c":"60-regisely-superpapers","d":"Use when generating a LaTeX results table, creating a figure for a paper, formatting descriptive statistics, preparing regression output for publication, or producing vector-quality graphics. Enforces booktabs, threeparttable, vector PDFs, and script-generated output.","p":"skills/60-regisely-superpapers/skills/tables-and-figures/SKILL.md"},{"n":"write-plan","c":"60-regisely-superpapers","d":"Use when a research design spec exists and the user is ready to translate it into a concrete implementation plan with phased tasks, artifacts, and verification criteria. Produces a research execution plan organized in canonical research phases — collection, preparation, analysis, robustness, writing, submission.","p":"skills/60-regisely-superpapers/skills/write-plan/SKILL.md"},{"n":"analyze","c":"61-phdemotions-research-methods","d":"Confirmatory hypothesis testing matched to pre-registration, with full assumption testing, effect sizes, confidence intervals, and APA 7th formatted output. Supports OLS/GLM regression, panel regression (fixest), mixed models (lme4), SEM/CFA (lavaan), meta-analysis (metafor), and delegates PROCESS models to /process-model. Reads pre-registration to align planned analyses, flags deviations, and generates decision log entries for post-hoc choices. Use when the user says \"test hypotheses,\" \"run analysis,\" \"confirmatory,\" \"regression,\" \"SEM,\" \"mediation,\" \"mixed model,\" \"meta-analysis,\" or when /eda completes. Triggers on \"analyze,\" \"hypothesis,\" \"regression,\" \"model,\" \"test.\"","p":"skills/61-phdemotions-research-methods/skills/analyze/SKILL.md"},{"n":"data-clean","c":"61-phdemotions-research-methods","d":"Produce documented data cleaning scripts that log every transformation with N before/after each step, generate a CONSORT-style exclusion flow diagram, create decision log entries for every subjective choice, compute scale reliability and composites, and write cleaned data to data/processed/. Never modifies raw data. Use when the user says \"clean data,\" \"prepare data,\" \"apply exclusion criteria,\" \"handle missing data,\" \"create composites,\" \"data preprocessing,\" or when /data-validate found issues to address. Triggers on \"clean,\" \"exclusion,\" \"missing data,\" \"preprocessing,\" \"composites,\" \"reverse code.\"","p":"skills/61-phdemotions-research-methods/skills/data-clean/SKILL.md"},{"n":"data-profile","c":"61-phdemotions-research-methods","d":"Generate a complete, manuscript-ready data profile: demographics summary table, scale identification with reliability (alpha, omega, CFA), comprehensive codebook, sample characteristics, and measurement documentation — all following current best practices at the time of execution. Searches for the latest reporting standards (JARS, TOP, APA) before generating output. Produces everything a Methods section needs to describe the data. Use when the user says \"describe my data for the manuscript,\" \"demographics table,\" \"what scales are in here,\" \"codebook,\" \"Methods section data,\" \"sample characteristics,\" or any time they need data documented for publication. Triggers on \"profile,\" \"demographics,\" \"scales,\" \"codebook,\" \"sample description,\" \"Methods section.\"","p":"skills/61-phdemotions-research-methods/skills/data-profile/SKILL.md"},{"n":"data-validate","c":"61-phdemotions-research-methods","d":"Run declarative data quality checks and generate a codebook. Checks completeness, distributions, impossible values, duplicates, outliers, encoding issues, attention check failures, and manipulation check results. Produces a pointblank/pandera validation report and an auto-generated codebook. Use when the user says \"validate data,\" \"check data quality,\" \"generate codebook,\" \"what's wrong with my data,\" \"data audit,\" \"check my dataset,\" or when /research-intake identifies missing validation. Triggers on \"validate,\" \"data quality,\" \"codebook,\" \"check my data.\"","p":"skills/61-phdemotions-research-methods/skills/data-validate/SKILL.md"},{"n":"eda","c":"61-phdemotions-research-methods","d":"Comprehensive exploratory data analysis with publication-quality descriptive tables, correlation matrices, distribution plots, and assumption testing. Generates a standalone EDA report with Table 1 (gtsummary/great_tables), correlation heatmap, distribution diagnostics, VIF for multicollinearity, and normality/homoscedasticity tests. All figures are APA-formatted and colorblind-safe. Use when the user says \"exploratory analysis,\" \"EDA,\" \"descriptive statistics,\" \"explore the data,\" \"Table 1,\" \"correlations,\" \"distributions,\" or when /data-clean completes successfully. Triggers on \"EDA,\" \"descriptive,\" \"Table 1,\" \"explore,\" \"correlations.\"","p":"skills/61-phdemotions-research-methods/skills/eda/SKILL.md"},{"n":"process-model","c":"61-phdemotions-research-methods","d":"Implement Hayes PROCESS mediation and moderation models transparently via lavaan and bruceR, with bootstrap CIs, index of moderated mediation, Johnson-Neyman regions of significance, and APA-formatted output that matches familiar PROCESS tables. Maps model numbers (1-24) to inspectable lavaan syntax instead of black-box macros. Use when the user says \"PROCESS model,\" \"mediation,\" \"moderated mediation,\" \"conditional indirect effect,\" \"Hayes model,\" \"indirect effect,\" \"moderation,\" or when /analyze encounters a mediation/moderation hypothesis. Triggers on \"PROCESS,\" \"mediation,\" \"moderation,\" \"indirect effect,\" \"Hayes.\"","p":"skills/61-phdemotions-research-methods/skills/process-model/SKILL.md"},{"n":"research-init","c":"61-phdemotions-research-methods","d":"Scaffold a new research project with full reproducibility infrastructure in R and/or Python. Creates directory structure, pipeline stubs (targets/Snakemake), environment lockfiles (renv/uv), documentation templates (codebook, decision log, pre-registration, Cornell README), Quarto manuscript template, and proper .gitignore. Can wrap existing data in gold-standard structure. Use when the user says \"new project,\" \"scaffold,\" \"start a study,\" \"set up a project,\" \"I have data and need to organize it,\" or when /research-intake recommends scaffolding.","p":"skills/61-phdemotions-research-methods/skills/research-init/SKILL.md"},{"n":"research-intake","c":"61-phdemotions-research-methods","d":"Bidirectional review — THE entry point for every research engagement. Reviews everything the researcher has (data, docs, code, instruments) and produces two outputs: (1) a gap analysis showing what their project needs to meet gold standards, and (2) suite-learning findings identifying what our skill suite can learn from what they brought. Runs at the START of every engagement and in lighter form at session END. Use when the user says \"I have data,\" \"review what I have,\" \"where do I start,\" \"look at my project,\" \"what am I missing,\" or at the beginning of any research engagement. Also triggers on \"intake,\" \"gap analysis,\" \"audit my materials,\" \"what should I improve.\"","p":"skills/61-phdemotions-research-methods/skills/research-intake/SKILL.md"},{"n":"visualize","c":"61-phdemotions-research-methods","d":"Create publication-quality figures that meet journal submission standards. APA 7th defaults with journal-specific overrides. Supports interaction plots, mediation path diagrams, forest plots, marginal effects, Johnson-Neyman plots, correlation heatmaps, and coefficient plots. All figures are colorblind-safe, high DPI, and exported in multiple formats (PDF, PNG, SVG, TIFF). Use when the user says \"publication figures,\" \"journal figures,\" \"APA figures,\" \"visualize results,\" \"make plots,\" \"interaction plot,\" \"path diagram,\" \"forest plot,\" or when /analyze or /process-model or /robustness completes. Triggers on \"visualize,\" \"figure,\" \"plot,\" \"diagram.\"","p":"skills/61-phdemotions-research-methods/skills/visualize/SKILL.md"},{"n":"check-citations","c":"62-PHY041-claude-skill-citation-checker","d":"Verify academic citations against CrossRef, Semantic Scholar, and OpenAlex. Detects AI-hallucinated references, chimeric citations, and suspicious patterns.","p":"skills/62-PHY041-claude-skill-citation-checker/SKILL.md"},{"n":"dowhy","c":"63-tondevrel-scientific-agent-skills","d":"Causal inference framework for answering \"does X cause Y?\" beyond correlation. DoWhy (Microsoft Research) provides the identify-estimate-refute loop: define a causal graph (DAG), identify the causal effect using backdoor/frontdoor/instrumental variable criteria, estimate treatment effects with multiple estimators, and validate results with automated refutation tests. Use when: distinguishing causation from correlation, estimating treatment effects (ATE, ATT, CATE), designing and analyzing A/B tests with confounders, using instrumental variables, performing counterfactual reasoning (\"what would have happened if...\"), validating causal claims with sensitivity analysis, working with observational data where randomization is impossible, or any analysis where the question is \"what is the CAUSAL effect of X on Y\" rather than just \"how do X and Y relate?\"","p":"skills/63-tondevrel-scientific-agent-skills/dowhy/SKILL.md"},{"n":"lifelines","c":"63-tondevrel-scientific-agent-skills","d":"Complete survival analysis library in Python. Handles right-censored data, Kaplan-Meier curves, and Cox regression. Standard for clinical trial analysis and epidemiology.","p":"skills/63-tondevrel-scientific-agent-skills/lifelines/SKILL.md"},{"n":"stata","c":"64-tmonk-mcp-stata","d":"Show mcp-stata identity, connected tools, and status. Use when the user asks if mcp-stata is available, asks about access to the toolkit, or asks what Stata tools are connected.","p":"skills/64-tmonk-mcp-stata/skills/stata/SKILL.md"},{"n":"stata-causal-inference","c":"64-tmonk-mcp-stata","d":"Design, run, and critique causal inference workflows in Stata. Use when the user is working on identification, treatment effects, DiD, IV, event studies, RD, or assumption-sensitive empirical claims.","p":"skills/64-tmonk-mcp-stata/skills/stata-causal-inference/SKILL.md"},{"n":"stata-data-audit","c":"64-tmonk-mcp-stata","d":"Audit datasets for structure, missingness, labeling, suspicious values, duplicate identifiers, and documentation readiness. Use when a researcher asks for data QA, codebook review, sanity checks, or pre-analysis cleanup guidance.","p":"skills/64-tmonk-mcp-stata/skills/stata-data-audit/SKILL.md"},{"n":"stata-data-provenance","c":"64-tmonk-mcp-stata","d":"Track dataset lineage, transformation steps, merge logic, and reproducibility risks in Stata workflows. Use when the user needs to explain where data came from, how it changed, or why a pipeline can be trusted.","p":"skills/64-tmonk-mcp-stata/skills/stata-data-provenance/SKILL.md"},{"n":"stata-environment-diagnose","c":"64-tmonk-mcp-stata","d":"Diagnose local Stata, MCP, package, startup, graph-export, and permissions issues. Use when setup is failing, Stata is not discovered, packages are missing, logs are truncated, or a managed machine behaves differently from a normal workstation.","p":"skills/64-tmonk-mcp-stata/skills/stata-environment-diagnose/SKILL.md"},{"n":"stata-graph","c":"64-tmonk-mcp-stata","d":"List, export, and review Stata graphs from the current session.","p":"skills/64-tmonk-mcp-stata/skills/stata-graph/SKILL.md"},{"n":"stata-help","c":"64-tmonk-mcp-stata","d":"Look up Stata command documentation and display formatted help text.","p":"skills/64-tmonk-mcp-stata/skills/stata-help/SKILL.md"},{"n":"stata-inspect","c":"64-tmonk-mcp-stata","d":"Describe and summarize the current dataset in memory. Optionally inspect a specific variable with codebook.","p":"skills/64-tmonk-mcp-stata/skills/stata-inspect/SKILL.md"},{"n":"stata-lint","c":"64-tmonk-mcp-stata","d":"Run static analysis on a Stata .do or .ado file and report style and best-practice issues.","p":"skills/64-tmonk-mcp-stata/skills/stata-lint/SKILL.md"},{"n":"stata-log","c":"64-tmonk-mcp-stata","d":"Tail, read, or search a Stata log file from a previous command or background task.","p":"skills/64-tmonk-mcp-stata/skills/stata-log/SKILL.md"},{"n":"stata-modernize","c":"64-tmonk-mcp-stata","d":"Improve, modernize, and optimize existing Stata code for performance, portability, and maintainability. Use when legacy patterns such as preserve/restore, cd, #delimit, slow aggregation, or weak fixed-effects workflows appear in code under review.","p":"skills/64-tmonk-mcp-stata/skills/stata-modernize/SKILL.md"},{"n":"stata-power-analysis","c":"64-tmonk-mcp-stata","d":"Plan and critique power, MDE, and sample-size calculations for Stata-based research workflows. Use when the user is designing a study, checking detectability, or defending precision claims.","p":"skills/64-tmonk-mcp-stata/skills/stata-power-analysis/SKILL.md"},{"n":"stata-publication-qa","c":"64-tmonk-mcp-stata","d":"Review regression outputs, tables, and graphs for publication readiness. Use when the user asks whether a result is ready for a paper, appendix, seminar, referee response, or coauthor review.","p":"skills/64-tmonk-mcp-stata/skills/stata-publication-qa/SKILL.md"},{"n":"stata-referee-response","c":"64-tmonk-mcp-stata","d":"Organize and execute Stata workflows for referee responses, robustness requests, and coauthor follow-ups. Use when the user needs to answer a critique with targeted reruns, tables, figures, and a defensible audit trail.","p":"skills/64-tmonk-mcp-stata/skills/stata-referee-response/SKILL.md"},{"n":"stata-replication","c":"64-tmonk-mcp-stata","d":"Run replication, robustness, and specification-sensitivity workflows for Stata projects. Use when a researcher wants to reproduce a result, rerun a pipeline, compare specifications, audit a do-file sequence, or check whether a claim is stable.","p":"skills/64-tmonk-mcp-stata/skills/stata-replication/SKILL.md"},{"n":"stata-results","c":"64-tmonk-mcp-stata","d":"Fetch and display stored r(), e(), and s() results from the last Stata command.","p":"skills/64-tmonk-mcp-stata/skills/stata-results/SKILL.md"},{"n":"stata-run","c":"64-tmonk-mcp-stata","d":"Run arbitrary Stata code or a .do file and display the result.","p":"skills/64-tmonk-mcp-stata/skills/stata-run/SKILL.md"},{"n":"stata-setup","c":"64-tmonk-mcp-stata","d":"Install, configure, update, or verify mcp-stata across Claude Code, Codex, Gemini CLI, Cursor, Windsurf, and VS Code. Activate when users ask to set up the Stata toolkit or troubleshoot the installation.","p":"skills/64-tmonk-mcp-stata/skills/stata-setup/SKILL.md"},{"n":"stata-table-builder","c":"64-tmonk-mcp-stata","d":"Build and review paper-ready regression, balance, and summary tables from Stata outputs. Use when the user needs a clean table for a draft, appendix, or coauthor share-out.","p":"skills/64-tmonk-mcp-stata/skills/stata-table-builder/SKILL.md"},{"n":"stata-toolkit","c":"64-tmonk-mcp-stata","d":"Activate when users mention Stata commands, .do files, regressions, econometrics, stored results, graphs, dataset inspection, replication, or Stata errors. Route the task through mcp-stata tools and the specialized research skills instead of treating it as plain text coding.","p":"skills/64-tmonk-mcp-stata/skills/stata-toolkit/SKILL.md"},{"n":"game-theory-paper-writer","c":"65-game-theory-paper-writer","d":"Generate, continue, revise, polish, and stress-test game theory research papers. Use when the user provides a game theory topic, phenomenon, draft, outline, model idea, literature anchor, reviewer comments, or asks for 博弈论论文生成, 选题建模, 文献迁移, 模型修正, 均衡分析, 数值模拟, 论文润色, 改稿打磨, or R&R response work.","p":"skills/65-game-theory-paper-writer/SKILL.md"},{"n":"R-optimizer","c":"66-zheng-siyao-empirical-research-skills","d":"R语言实证分析优化Skill。优化R代码效率、处理大规模面板数据、加速回归计算（并行化、向量化、向量化）。触发词：R语言优化/R加速/R性能优化/大规模数据处理/R optimization","p":"skills/66-zheng-siyao-empirical-research-skills/R-optimizer/SKILL.md"},{"n":"citation-fidelity","c":"66-zheng-siyao-empirical-research-skills","d":"学术引用核查Skill。要求每条引用必须定位到PDF原页，区分直接引用/间接引用，找不到原文则标注\"待核\"。触发词：引用核查/检查引用/citation check/核实文献/引用 fidelity","p":"skills/66-zheng-siyao-empirical-research-skills/citation-fidelity/SKILL.md"},{"n":"codebook-pass","c":"66-zheng-siyao-empirical-research-skills","d":"调查数据清洗Skill。处理调查数据（CGSS/CHIP/CSS等）时的标准化清洗流程，包括缺失值处理、变量编码统一、数据异常值检测。触发词：数据清洗/调查数据/codebook/数据清洗流程/问卷数据处理","p":"skills/66-zheng-siyao-empirical-research-skills/codebook-pass/SKILL.md"},{"n":"did-reviewer","c":"66-zheng-siyao-empirical-research-skills","d":"双重差分(DID)实证审查Skill。做DID分析前必须检查平行趋势假设、画图可视化、报告违背情况。触发词：DID审查/双重差分检查/平行趋势/DiD reviewer/difference-in-differences","p":"skills/66-zheng-siyao-empirical-research-skills/did-reviewer/SKILL.md"},{"n":"econ-reviewer","c":"66-zheng-siyao-empirical-research-skills","d":"经济学顶刊标准审稿Skill。按AER/QJE/Econometrica/JPE顶刊标准审查论文输出（图表+回归表），列出潜在致命缺陷。触发词：顶刊审稿/论文审查/econ reviewer/经济学期刊标准/PR","p":"skills/66-zheng-siyao-empirical-research-skills/econ-reviewer/SKILL.md"},{"n":"grillme","c":"66-zheng-siyao-empirical-research-skills","d":"苏格拉底诘问式研究选题Skill。通过连续追问帮你厘清研究思路、聚焦研究子领域、明确研究问题(RQ)，识别出未被研究过的新意选题。触发词：帮我选题/研究问题不清晰/想做一个有新意的论文/不断问我问题/厘清思路","p":"skills/66-zheng-siyao-empirical-research-skills/grillme/SKILL.md"},{"n":"latex-table","c":"66-zheng-siyao-empirical-research-skills","d":"LaTeX回归表格生成Skill。辅助生成符合AER/QJE等顶刊格式的三线表，包括标准误聚类标注、显著性星标、固定效应标注。触发词：LaTeX表格/回归表/三线表/table制作/latex table","p":"skills/66-zheng-siyao-empirical-research-skills/latex-table/SKILL.md"},{"n":"China-CF-Study","c":"67-econfin-workflow-toolkit","d":"根据研究者提供的**研究计划书（Research Proposal）**执行基于中国制度环境的公司金融类实证研究全流程。**启动后第一件事：根据计划书的主题、识别策略、贡献边际与样本范围，从中国-context 英文顶级期刊池（JF/JFE/RFS/JFQA/MS/JCF/JBF/JAR/JAE/TAR/CAR/JIBS/China Economic Review/PBFJ 等 25+ 期刊）中推荐 5 本最匹配的目标期刊（[J1]–[J5]），等待研究者明确选定一本；该期刊决定 main.tex 的 bibliographystyle、Section 骨架、Introduction 风格与表注规范**。然后用 Python 完成数据清洗、描述性统计、基准回归、内生性检验（IV/2SLS、DML）、平行趋势、异质性、机制、稳健性检验与图表绘制。LaTeX 表格和图像严格遵循 template/ 示例格式，研究逻辑与排版严格遵循 rule/ 下的《通用实证研究逻辑与规范总结》与《回归表写作规范总结》。数据集与政策集从 asset/ 中按计划书中的关键词检索。**当计划书预期的实证结果无法实现时（系数不显著、平行趋势不通过、IV 弱工具、机制不成立等），skill 自动切换备选方案直至完成研究项目**。最终交付物：Python 代码 + LaTeX 表格 + 图像（.pdf/.png）。触发条件：研究者提交研究计划书（含 X→Y 假设、识别策略、样本、政策冲击等）。","p":"skills/67-econfin-workflow-toolkit/China-CF-study/SKILL.md"},{"n":"Foreign-CF-Study","c":"67-econfin-workflow-toolkit","d":"根据研究者提供的**研究计划书（Research Proposal）**执行基于**外国（美国/欧盟/英国/日本/跨国）制度环境**的公司金融类实证研究全流程。**启动后第一件事：根据计划书的主题、识别策略、贡献边际与样本范围，从外国 CF 顶刊池（AER/QJE/JPE/JF/JFE/RFS/JFQA/JAR/JAE/MS/JCF/JBF 等 25+ 期刊）中推荐 5 本最匹配的目标期刊（[J1]–[J5]），等待研究者明确选定一本；该期刊决定 main.tex 的 bibliographystyle、Section 骨架、Introduction 风格与表注规范**。然后用 Python 完成数据清洗、描述性统计、基准回归、内生性检验（IV/2SLS、DML）、平行趋势、异质性、机制、稳健性检验与图表绘制。LaTeX 表格和图像严格遵循 template/ 示例格式，研究逻辑与排版严格遵循 rule/ 下的《通用实证研究逻辑与规范总结》与《回归表写作规范总结》。数据集与政策集从 asset/ 中按计划书中的关键词检索（WRDS / NBER/Fed releases / FRED / 全球宏观库）。**当计划书预期的实证结果无法实现时（系数不显著、平行趋势不通过、IV 弱工具、机制不成立等），skill 自动切换备选方案直至完成研究项目**。最终交付物：Python 代码 + LaTeX 表格 + 图像（.pdf/.png）。触发条件：研究者提交研究计划书（含 X→Y 假设、识别策略、样本、政策冲击等）。","p":"skills/67-econfin-workflow-toolkit/Foreign-CF-study/SKILL.md"},{"n":"agent-browser","c":"67-econfin-workflow-toolkit","d":"Browser automation CLI for AI agents. Use when the user needs to interact with websites, including navigating pages, filling forms, clicking buttons, taking screenshots, extracting data, testing web apps, or automating any browser task. Triggers include requests to \"open a website\", \"fill out a form\", \"click a button\", \"take a screenshot\", \"scrape data from a page\", \"test this web app\", \"login to a site\", \"automate browser actions\", or any task requiring programmatic web interaction.","p":"skills/67-econfin-workflow-toolkit/agent-browser/SKILL.md"},{"n":"arxiv","c":"67-econfin-workflow-toolkit","d":"Search and retrieve academic papers from arXiv using their free REST API. No API key needed. Search by keyword, author, category, or ID. Combine with web_extract or the ocr-and-documents skill to read full paper content.","p":"skills/67-econfin-workflow-toolkit/arxiv/SKILL.md"},{"n":"chinese-ppt2","c":"67-econfin-workflow-toolkit","d":"Upgrade of chinese-ppt for Chinese Beamer decks (xelatex + ctex + fandol, CUFE template). Same 7-section outline and X→M→Y framework, but adds (a) mandatory 1.3 line-spacing + 3pt paragraph spacing, (b) overflow-prevention line budget + balanced split-frame rules, (c) prose rewrites that strip AI-ish \"关键比较/理论映射\" labels and redundant 章节括号注释, (d) stricter CJK-space + middle-dot rules, (e) retrofit workflow for existing chinese-ppt decks, (f) mandatory local linespread reset inside TikZ / table / fixed-geometry frames. Use for \"做中文学术PPT 2 版\"、\"中文 Beamer 改进版\"、\"答辩 PPT chinese-ppt2\"、\"防越界 PPT\"等请求。用户在 Overleaf 编译，只产出 .tex + figures/，不要附加 compile 脚本。","p":"skills/67-econfin-workflow-toolkit/chinese-ppt/SKILL.md"},{"n":"chinese-quote-converter","c":"67-econfin-workflow-toolkit","d":"Convert English straight quotation marks (\"...\") to Chinese curved quotation marks (\"...\" U+201C/D). Use when processing Chinese text documents, markdown files, or any content that needs proper Chinese typography with directional quotes. Triggers on keywords like \"转换引号\", \"中文引号\", \"英文引号转中文\", \"quote conversion\", \"convert quotes\".","p":"skills/67-econfin-workflow-toolkit/chinese-quote-converter/SKILL.md"},{"n":"Command Development","c":"67-econfin-workflow-toolkit","d":"This skill should be used when the user asks to \"create a slash command\", \"add a command\", \"write a custom command\", \"define command arguments\", \"use command frontmatter\", \"organize commands\", \"create command with file references\", \"interactive command\", \"use AskUserQuestion in command\", or needs guidance on slash command structure, YAML frontmatter fields, dynamic arguments, bash execution in commands, user interaction patterns, or command development best practices for Claude Code.","p":"skills/67-econfin-workflow-toolkit/command-development/SKILL.md"},{"n":"data-cleaning","c":"67-econfin-workflow-toolkit","d":"Clean and transform messy data for analysis in Python, R, or Stata","p":"skills/67-econfin-workflow-toolkit/data-cleaning/SKILL.md"},{"n":"data-fetcher","c":"67-econfin-workflow-toolkit","d":"Fetch economic data from FRED, World Bank, BLS, OECD, and Yahoo Finance","p":"skills/67-econfin-workflow-toolkit/data-fetcher/SKILL.md"},{"n":"did-analysis","c":"67-econfin-workflow-toolkit","d":"Econometrics skill for Difference-in-Differences (DID) analysis. Activates when the user asks about: \"difference in differences\", \"DID\", \"DiD\", \"diff-in-diff\", \"parallel trends\", \"treatment group\", \"control group\", \"pre-treatment\", \"post-treatment\", \"policy evaluation\", \"natural experiment\", \"staggered DID\", \"event study regression\", \"two-way fixed effects DID\", \"callaway santanna\", \"sun and abraham\", \"双重差分\", \"倍差法\", \"平行趋势\", \"处理组\", \"对照组\", \"政策评估\", \"事件研究\", \"交错DID\", \"渐进处理\"","p":"skills/67-econfin-workflow-toolkit/did-analysis/SKILL.md"},{"n":"do-agent","c":"67-econfin-workflow-toolkit","d":"This skill should be used when the user asks to \"/do-agent\", asks for \"Execute complex tasks using multi-agent architecture with context protection\", or needs the workflow previously provided by the /do-agent slash command.","p":"skills/67-econfin-workflow-toolkit/do-agent/SKILL.md"},{"n":"econfin-idea-finder","c":"67-econfin-workflow-toolkit","d":"公司金融实证研究的\"漏斗式选题查找器\"。互动开场先后询问 (1) 研究方向、(2) 候选标题数量 N， 再扫描全球文献（已出版英文学术期刊 + SSRN working paper + 全球高校 department seminar 1 年内日程），基于 Edmans (2024) \"1000 Rejections\" 红线生成 N 个候选标题，**通过并行 subagent（Agent 工具）批量生成计划书 + 查新；每个 subagent 必须强制调用 Skill 工具加载 econfin-proposal 与 novelty-check 两个预设 skill 完成各自模块**，**只有当 novelty score >= 9 时（即 JF/JFE/RFS 顶刊层次），subagent 才把 proposal + 查新报告合并的 md 写入 F:\\Dropbox\\CC\\选题大全\\<研究方向短名>\\（以\"简短选题名称-分数\"命名，子文件夹名由 Step 0 从用户输入的研究方向派生）；< 9 分的选题在 subagent 内部直接丢弃，绝不写盘、绝不输出**。当用户说\"找选题\"、\"帮我找选题\"、\"想做 X 方向\"、 \"empirical CF idea search\"、\"批量生成研究计划书\"、\"100 ideas\"、\"econfin-idea-finder\" 时触发。","p":"skills/67-econfin-workflow-toolkit/econfin-idea-finder/SKILL.md"},{"n":"Econfin-Proposal","c":"67-econfin-workflow-toolkit","d":"金融经济学实证论文计划书生成器。根据用户提供的研究方向，生成包含标题、假说、数据来源、实证策略、 预期结果表格、稳健性检验、异质性分析、机制检验等12个完整模块的研究计划书。 内置中国微观/宏观数据库（皮皮侠1599个数据集、马克数据377个数据集）和WRDS国际数据库索引， 自动匹配可用数据源。融合Edmans (2024) \"Learnings From 1000 Rejections\"的编辑视角作为质量护栏， 确保选题具有真正的边际贡献而非\"just another determinant of Y\"。 当用户提到以下任何情境时触发：写研究计划书、research proposal、论文开题、选题+计划、 帮我设计一个实证研究、empirical research design、我想研究X对Y的影响怎么做、 帮我找个能发表的选题、generate proposal、写一个可以投稿的研究方案、 研究设计、identification strategy、DID/RDD/IV研究设计。 即使用户只是描述了一个经济金融现象并想知道\"能不能做成论文\"，也应考虑使用此技能。","p":"skills/67-econfin-workflow-toolkit/econfin-proposal/SKILL.md"},{"n":"figure","c":"67-econfin-workflow-toolkit","d":"Econometrics skill for generating publication-quality figures for top economics journals. Activates when the user asks about: \"econometric figure\", \"publication figure\", \"journal figure\", \"AER figure\", \"QJE figure\", \"event study plot\", \"coefficient plot\", \"coefplot\", \"binned scatter\", \"binscatter\", \"RDD plot\", \"parallel trends plot\", \"kernel density\", \"distribution plot\", \"time series plot\", \"map\", \"figure formatting\", \"academic plot\", \"论文图表\", \"学术图\", \"系数图\", \"事件研究图\", \"散点图\", \"分布图\", \"趋势图\", \"回归可视化\"","p":"skills/67-econfin-workflow-toolkit/figure/SKILL.md"},{"n":"fix-chinese","c":"67-econfin-workflow-toolkit","d":"PROACTIVE SKILL — automatically apply whenever writing, generating, or editing any text that is mainly in Chinese. No user trigger needed. Also use when the user explicitly asks to \"fix Chinese\", \"修改中文\", \"去翻译腔\", \"去AI味\", \"fix Chinese formatting\", or \"review Chinese text\". Eliminates AI-sounding expressions and translation artifacts. Enforces Chinese-English mixed formatting rules (spacing, punctuation, bold formatting).","p":"skills/67-econfin-workflow-toolkit/fix-chinese/SKILL.md"},{"n":"iv-estimation","c":"67-econfin-workflow-toolkit","d":"Econometrics skill for instrumental variables and treatment effect estimation. Activates when the user asks about: \"instrumental variables\", \"IV estimation\", \"2SLS\", \"two-stage least squares\", \"endogeneity\", \"weak instruments\", \"first stage\", \"Sargan test\", \"overidentification\", \"propensity score matching\", \"PSM\", \"average treatment effect\", \"ATT\", \"LATE\", \"local average treatment effect\", \"endogenous regressor\", \"instrument validity\", \"工具变量\", \"两阶段最小二乘\", \"内生性\", \"弱工具变量\", \"倾向得分匹配\", \"平均处理效应\", \"处理效应\", \"局部平均处理效应\"","p":"skills/67-econfin-workflow-toolkit/iv-estimation/SKILL.md"},{"n":"journal-digest","c":"67-econfin-workflow-toolkit","d":"经济金融顶刊文献速递与选题建议生成器。通过RSS和网页抓取获取经济学、金融学、会计学顶级期刊的最新论文， 筛选公司金融相关文献，生成中文综述摘要和研究选题建议。 当用户提到\"期刊速递\"、\"文献周报\"、\"论文速递\"、\"最新文献\"、\"journal digest\"、\"paper digest\"、 \"选题建议\"、\"研究选题\"、\"顶刊追踪\"、\"文献追踪\"、\"周报\"时触发此技能。 即使用户只是说\"帮我看看最近有什么新论文\"或\"最近顶刊发了什么\"，也应该触发。","p":"skills/67-econfin-workflow-toolkit/journal-digest/SKILL.md"},{"n":"markitdown","c":"67-econfin-workflow-toolkit","d":"Convert various file formats (PDF, Office documents, images, audio, web content, structured data) to Markdown optimized for LLM processing. Use when converting documents to markdown, extracting text from PDFs/Office files, transcribing audio, performing OCR on images, extracting YouTube transcripts, or processing batches of files. Supports 20+ formats including DOCX, XLSX, PPTX, PDF, HTML, EPUB, CSV, JSON, images with OCR, and audio with transcription.","p":"skills/67-econfin-workflow-toolkit/markitdown/SKILL.md"},{"n":"marp-export","c":"67-econfin-workflow-toolkit","d":"Export Marp slide markdown files to PDF (default), HTML, PPTX, or PNG. Handles theme loading, Chrome/Chromium detection for PDF export, and batch conversion. Trigger when user says \"export slides\", \"convert marp to pdf\", \"marp export\", \"slides to pdf\", \"slides to html\", \"导出slides\", \"slides转pdf\", \"导出演示文稿\".","p":"skills/67-econfin-workflow-toolkit/marp-export/SKILL.md"},{"n":"marp-slides-creator","c":"67-econfin-workflow-toolkit","d":"专业Marp演示文稿制作助手。支持完整工作流程：工作空间初始化、内容分析、slides制作、多维度审阅、中文语言规范审阅（中文演示文稿）、PNG转换检查、终稿确定。所有产出物集中管理在项目工作文件夹中。当用户提到\"制作slides\"、\"做PPT\"、\"演示文稿\"、\"Marp\"、\"幻灯片\"、\"presentation\"等关键词时自动启用。Professional Marp presentation assistant with complete workflow: workspace initialization, content analysis, slide creation, multi-dimensional review, Chinese language review (for Chinese presentations), PNG conversion check, and finalization. All outputs organized in project workspace.","p":"skills/67-econfin-workflow-toolkit/marp-slides-creator/SKILL.md"},{"n":"master-thesis-review","c":"67-econfin-workflow-toolkit","d":"Generate master's thesis review reports (硕士论文评阅意见) calibrated to a given score. Outputs academic evaluation and shortcomings/suggestions in Chinese. Trigger when user says \"master thesis review\" / \"硕士论文评阅\" / \"论文评阅\" / \"评阅意见\" / \"thesis review\".","p":"skills/67-econfin-workflow-toolkit/master-thesis-review/SKILL.md"},{"n":"md-to-docx","c":"67-econfin-workflow-toolkit","d":"Convert Markdown files to Word documents (.docx) with proper formatting, Chinese font support (FangSong for all text including headings), black font color, 1.5x line spacing, precise first-line indent (24pt), heading spacing after (1 line), no italic headings, and automatic superscript conversion for citation numbers. Use when converting .md files to .docx, creating Word documents from markdown, or when user mentions Word, DOCX, or document conversion. Requires pandoc.","p":"skills/67-econfin-workflow-toolkit/md-to-docx/SKILL.md"},{"n":"ml-causal","c":"67-econfin-workflow-toolkit","d":"Econometrics skill for machine learning methods in causal inference. Activates when the user asks about: \"causal forest\", \"generalized random forest\", \"GRF\", \"double machine learning\", \"DML\", \"debiased machine learning\", \"LASSO for variable selection\", \"post-LASSO\", \"heterogeneous treatment effects\", \"CATE\", \"conditional average treatment effect\", \"BLP analysis\", \"CLAN analysis\", \"causal tree\", \"honest estimation\", \"因果森林\", \"双重机器学习\", \"异质性处理效应\", \"条件平均处理效应\", \"LASSO变量选择\", \"机器学习因果推断\", \"去偏机器学习\"","p":"skills/67-econfin-workflow-toolkit/ml-causal/SKILL.md"},{"n":"novelty-check","c":"67-econfin-workflow-toolkit","d":"Verify research idea novelty against recent literature. Use when user says \"查新\", \"novelty check\", \"有没有人做过\", \"check novelty\", or wants to verify a research idea is novel before implementing.","p":"skills/67-econfin-workflow-toolkit/novelty-check/SKILL.md"},{"n":"ols-regression","c":"67-econfin-workflow-toolkit","d":"Econometrics skill for OLS regression and linear models. Activates when the user asks about: \"run OLS\", \"linear regression\", \"ordinary least squares\", \"interpret regression results\", \"heteroskedasticity\", \"multicollinearity\", \"regression assumptions\", \"robust standard errors\", \"GLS\", \"WLS\", \"fit a regression model\", \"check regression diagnostics\", \"OLS假设\", \"最小二乘法\", \"线性回归\", \"回归系数\", \"残差检验\", \"异方差\", \"多重共线性\", \"普通最小二乘\", \"稳健标准误\", \"回归诊断\"","p":"skills/67-econfin-workflow-toolkit/ols-regression/SKILL.md"},{"n":"panel-data","c":"67-econfin-workflow-toolkit","d":"Econometrics skill for panel data models. Activates when the user asks about: \"panel data\", \"fixed effects\", \"random effects\", \"Hausman test\", \"within estimator\", \"between estimator\", \"two-way fixed effects\", \"clustered standard errors panel\", \"FE model\", \"RE model\", \"pooled OLS\", \"unobserved heterogeneity\", \"panel regression\", \"first difference estimator\", \"entity fixed effects\", \"time fixed effects\", \"面板数据\", \"固定效应\", \"随机效应\", \"豪斯曼检验\", \"双向固定效应\", \"面板回归\", \"个体效应\", \"时间效应\", \"一阶差分\"","p":"skills/67-econfin-workflow-toolkit/panel-data/SKILL.md"},{"n":"paper-pipeline","c":"67-econfin-workflow-toolkit","d":"Orchestrate the complete post-first-draft polishing pipeline for an academic LaTeX paper by invoking five existing skills in fixed order: (1) paper-polish, (2) paper-self-revise, (3) paper-style, (4) paper-polish again, (5) reference-verify. Trigger when user says \\\"paper pipeline\\\" / \\\"paper-pipeline\\\" / \\\"论文流水线\\\" / \\\"全流程打磨\\\" / \\\"一条龙打磨\\\" / \\\"初稿打磨\\\" / \\\"full polish pipeline\\\" / \\\"run the whole pipeline\\\", or wants the entire post-draft polishing sequence run on a paper folder. Use this skill whenever the user asks for several paper-finishing steps (polish + revise + style + reference check) on one manuscript in one go, even if they don't name every individual skill.","p":"skills/67-econfin-workflow-toolkit/paper-pipeline/SKILL.md"},{"n":"paper-polish","c":"67-econfin-workflow-toolkit","d":"Proofread and verify academic papers in LaTeX. Runs 19 sequential checks covering titles, consistency, citations, formatting, theoretical tension in motivation, concise results reporting, cross-section repetition, em-dash usage, and auxiliary-text-to-footnote conversion. Trigger when user says \"check paper\" / \"proofread\" / \"paper-checker\" / \"校对\" / \"核查论文\".","p":"skills/67-econfin-workflow-toolkit/paper-polish/SKILL.md"},{"n":"paper-referee-revise","c":"67-econfin-workflow-toolkit","d":"Revise an academic paper based on journal referee reports. Reads referee comments from review report or annotated manuscript, then directly modifies main.tex one comment at a time with user approval. Generates response letter after revision. Trigger when user says \"referee revise\" / \"paper-referee-revise\" / \"审稿意见修改\" / \"根据审稿人意见修改\" / \"referee report\".","p":"skills/67-econfin-workflow-toolkit/paper-referee-revise/SKILL.md"},{"n":"paper-self-revise","c":"67-econfin-workflow-toolkit","d":"Revise an academic paper based on internal review comments. Reads review report or annotated manuscript, then applies revisions one by one with user approval. Trigger when user says \"self revise\" / \"paper-selfrevise\" / \"内部修改\" / \"根据审稿意见修改\".","p":"skills/67-econfin-workflow-toolkit/paper-self-revise/SKILL.md"},{"n":"paper-style","c":"67-econfin-workflow-toolkit","d":"Restructure an academic paper's title and section structure to match a target journal's house style. Asks the user to specify the target journal first, then adjusts main.tex accordingly (title wording and case, section skeleton, heading case, numbering scheme, merging/splitting sections). Trigger when user says \"paper style\" / \"paper-style\" / \"期刊风格\" / \"按目标期刊调整\" / \"调整为XX风格\" / \"JFE风格\" / \"convert to journal style\" / \"restructure for [journal]\", or wants a paper's title/sections reformatted for a specific journal submission.","p":"skills/67-econfin-workflow-toolkit/paper-style/SKILL.md"},{"n":"paper-submission","c":"67-econfin-workflow-toolkit","d":"Evaluate a paper's contribution novelty, identify best-fit SSCI journal fields and ABS star rating, and recommend 20 target journals. Trigger when user says \"paper submission\" / \"paper-submission\" / \"投稿评估\" / \"期刊推荐\" / \"target journal\" / \"选刊\".","p":"skills/67-econfin-workflow-toolkit/paper-submission/SKILL.md"},{"n":"paper-writer","c":"67-econfin-workflow-toolkit","d":"Automatically write empirical sections of academic papers in LaTeX by reading tables/figures from a PDF. Trigger when user wants to write a paper from empirical results, has tables/figures in PDF, or says \"write paper\" / \"paper-writer\" / \"写论文\".","p":"skills/67-econfin-workflow-toolkit/paper-writer/SKILL.md"},{"n":"rdd-analysis","c":"67-econfin-workflow-toolkit","d":"Econometrics skill for Regression Discontinuity Design (RDD). Activates when the user asks about: \"regression discontinuity\", \"RDD\", \"RD design\", \"sharp RDD\", \"fuzzy RDD\", \"running variable\", \"forcing variable\", \"cutoff\", \"bandwidth selection\", \"local linear regression\", \"McCrary test\", \"density test\", \"RDROBUST\", \"continuity assumption\", \"donut hole RDD\", \"geographic RDD\", \"断点回归\", \"回归不连续\", \"运行变量\", \"截断值\", \"带宽选择\", \"精确断点\", \"模糊断点\", \"密度检验\", \"局部线性回归\"","p":"skills/67-econfin-workflow-toolkit/rdd-analysis/SKILL.md"},{"n":"readability","c":"67-econfin-workflow-toolkit","d":"Correct grammar errors, typos, and improve academic readability in LaTeX, Markdown, or plain-text manuscripts. Scans the document once, then walks through every issue one-by-one asking for approval before applying each fix. Trigger when the user says \"readability\", \"check grammar\", \"fix typos\", \"proofread for grammar\", \"improve readability\", \"polish wording\", \"语言润色\", \"修语法\", or asks you to clean up the prose in a paper/chapter/section without wanting full content restructuring.","p":"skills/67-econfin-workflow-toolkit/readability/SKILL.md"},{"n":"referee-report","c":"67-econfin-workflow-toolkit","d":"Generate academic referee reports for economics/finance papers, followed by a 150-word letter to the editor with recommendation (Reject / Major Revision) and Kai Wu signature. Two modes (normal / high-level), configurable number of comments; recommendation choice drives evaluation tone (Reject → negative, Major Revision → neutral). Trigger when user says \"referee report\" / \"write referee report\" / \"审稿报告\" / \"写审稿意见\" / \"generate referee report\" / \"review this paper\".","p":"skills/67-econfin-workflow-toolkit/referee-report/SKILL.md"},{"n":"reference-verify","c":"67-econfin-workflow-toolkit","d":"Verify references in an academic paper: check whether each BibTeX entry is real, whether in-text citations match the cited paper's actual content, and produce a structured verification report. Use when user says \\\"验证参考文献\\\", \\\"ref verify\\\", \\\"check references\\\", \\\"核实引用\\\", \\\"引用是否正确\\\", or wants to audit citations in a LaTeX manuscript.","p":"skills/67-econfin-workflow-toolkit/reference-verify/SKILL.md"},{"n":"Significance-Search","c":"67-econfin-workflow-toolkit","d":"Parallel control variable combination search via Stata. Exhaustively searches all subsets of optional controls to find the combination that maximises |t| of the independent variable. Activates when user says: \"控制变量搜索\", \"搜控制变量\", \"control variable search\", \"跑控制变量组合\", \"暴力搜索\", \"调控制变量\".","p":"skills/67-econfin-workflow-toolkit/significance-search/SKILL.md"},{"n":"skill-creator","c":"67-econfin-workflow-toolkit","d":"Create new skills, modify and improve existing skills, and measure skill performance. Use when users want to create a skill from scratch, edit, or optimize an existing skill, run evals to test a skill, benchmark skill performance with variance analysis, or optimize a skill's description for better triggering accuracy.","p":"skills/67-econfin-workflow-toolkit/skill-creator/SKILL.md"},{"n":"stata","c":"67-econfin-workflow-toolkit","d":"Comprehensive Stata reference for writing correct .do files, data management, econometrics, causal inference, graphics, Mata programming, and 20 community packages (reghdfe, estout, did, rdrobust, etc.). Covers syntax, options, gotchas, and idiomatic patterns. Use this skill whenever the user asks you to write, debug, or explain Stata code.","p":"skills/67-econfin-workflow-toolkit/stata/SKILL.md"},{"n":"stats","c":"67-econfin-workflow-toolkit","d":"Econometrics skill for descriptive statistics and summary tables. Activates when the user asks about: \"descriptive statistics\", \"summary statistics\", \"summary table\", \"Table 1\", \"balance table\", \"means and standard deviations\", \"correlation matrix\", \"data summary\", \"sample characteristics\", \"variable distributions\", \"描述性统计\", \"描述统计\", \"汇总统计\", \"统计表\", \"均值标准差\", \"平衡性检验\", \"相关矩阵\", \"样本特征\", \"变量分布\"","p":"skills/67-econfin-workflow-toolkit/stats/SKILL.md"},{"n":"synthetic-control","c":"67-econfin-workflow-toolkit","d":"Econometrics skill for Synthetic Control Method (SCM). Activates when the user asks about: \"synthetic control\", \"SCM\", \"synthetic counterfactual\", \"donor pool\", \"placebo test\", \"in-space placebo\", \"in-time placebo\", \"MSPE ratio\", \"Abadie Diamond Hainmueller\", \"augmented synthetic control\", \"penalized SCM\", \"synthetic DID\", \"合成控制\", \"合成控制法\", \"捐助池\", \"安慰剂检验\", \"合成反事实\", \"合成DID\", \"政策评估\"","p":"skills/67-econfin-workflow-toolkit/synthetic-control/SKILL.md"},{"n":"table","c":"67-econfin-workflow-toolkit","d":"Econometrics skill for creating publication-quality LaTeX regression and summary tables. Activates when the user asks about: \"regression table\", \"LaTeX table\", \"esttab\", \"stargazer\", \"modelsummary\", \"publication table\", \"format results\", \"multi-panel table\", \"journal table\", \"export regression results\", \"table formatting\", \"回归表格\", \"LaTeX表格\", \"结果导出\", \"论文表格\", \"回归结果格式化\", \"多模型表格\"","p":"skills/67-econfin-workflow-toolkit/table/SKILL.md"},{"n":"time-series","c":"67-econfin-workflow-toolkit","d":"Econometrics skill for time series analysis. Activates when the user asks about: \"time series\", \"stationarity\", \"unit root test\", \"ADF test\", \"KPSS test\", \"ARIMA\", \"ARMA\", \"autocorrelation\", \"ACF\", \"PACF\", \"VAR model\", \"VECM\", \"Granger causality\", \"cointegration\", \"impulse response function\", \"forecast\", \"seasonal decomposition\", \"ARCH\", \"GARCH\", \"时间序列\", \"平稳性检验\", \"单位根\", \"自回归\", \"格兰杰因果\", \"协整\", \"脉冲响应\", \"预测\", \"向量自回归\"","p":"skills/67-econfin-workflow-toolkit/time-series/SKILL.md"},{"n":"web-access","c":"67-econfin-workflow-toolkit","d":"所有联网操作必须通过此 skill 处理，包括：搜索、网页抓取、登录后操作、网络交互等。触发场景：用户要求搜索信息、查看网页内容、访问需要登录的网站、操作网页界面、抓取社交媒体内容（小红书、微博、推特等）、读取动态渲染页面、以及任何需要真实浏览器环境的网络任务。","p":"skills/67-econfin-workflow-toolkit/web-access/SKILL.md"},{"n":"web-research","c":"67-econfin-workflow-toolkit","d":"Searches multiple web sources, synthesizes findings, and produces cited research reports using delegated subagents. Use when the user asks to research a topic online, search the web, look something up, find current information, compare options, or produce a research report.","p":"skills/67-econfin-workflow-toolkit/web-research/SKILL.md"},{"n":"academic-paper-search","c":"68-research-productivity-skills","d":"This skill should be used when the user asks to \"search for academic papers\", \"find working papers on SSRN\", \"look up a DOI\", \"download paper PDF\", \"check open access availability\", \"search NBER papers\", \"find arXiv preprints\", or \"search CrossRef\". Provides unified search, metadata retrieval, and PDF download across arXiv, NBER, SSRN, CrossRef, OpenAlex, Unpaywall, and Semantic Scholar. Covers economics, finance, social science, CS/AI, and all academic disciplines.","p":"skills/68-research-productivity-skills/academic-paper-search/SKILL.md"},{"n":"agent-browser","c":"68-research-productivity-skills","d":"Browser automation CLI for AI agents. Use when the user needs to interact with websites, including navigating pages, filling forms, clicking buttons, taking screenshots, extracting data, testing web apps, or automating any browser task. Triggers include requests to \"open a website\", \"fill out a form\", \"click a button\", \"take a screenshot\", \"scrape data from a page\", \"test this web app\", \"login to a site\", \"automate browser actions\", or any task requiring programmatic web interaction.","p":"skills/68-research-productivity-skills/agent-browser/SKILL.md"},{"n":"arxiv","c":"68-research-productivity-skills","d":"Search and retrieve academic papers from arXiv using their free REST API. No API key needed. Search by keyword, author, category, or ID. Combine with web_extract or the ocr-and-documents skill to read full paper content.","p":"skills/68-research-productivity-skills/arxiv/SKILL.md"},{"n":"chinese-quote-converter","c":"68-research-productivity-skills","d":"Convert English straight quotation marks (\"...\") to Chinese curved quotation marks (\"...\" U+201C/D). Use when processing Chinese text documents, markdown files, or any content that needs proper Chinese typography with directional quotes. Triggers on keywords like \"转换引号\", \"中文引号\", \"英文引号转中文\", \"quote conversion\", \"convert quotes\".","p":"skills/68-research-productivity-skills/chinese-quote-converter/SKILL.md"},{"n":"Command Development","c":"68-research-productivity-skills","d":"This skill should be used when the user asks to \"create a slash command\", \"add a command\", \"write a custom command\", \"define command arguments\", \"use command frontmatter\", \"organize commands\", \"create command with file references\", \"interactive command\", \"use AskUserQuestion in command\", or needs guidance on slash command structure, YAML frontmatter fields, dynamic arguments, bash execution in commands, user interaction patterns, or command development best practices for Claude Code.","p":"skills/68-research-productivity-skills/command-development/SKILL.md"},{"n":"do-agent","c":"68-research-productivity-skills","d":"This skill should be used when the user asks to \"/do-agent\", asks for \"Execute complex tasks using multi-agent architecture with context protection\", or needs the workflow previously provided by the /do-agent slash command.","p":"skills/68-research-productivity-skills/do-agent/SKILL.md"},{"n":"five-questions","c":"68-research-productivity-skills","d":"Deeply analyze any empirical economics PDF using the five-question framework (五问框架): research question, identification strategy, core estimand, robustness logic, and scholarly contribution. Converts the PDF to Markdown, dispatches 5 parallel sub-agents (one per question), then compiles a 2000–3000 Chinese-character report with a transferable methodology checklist. Optimized for empirical economics papers in top journals (AER, QJE, JPE, RFS, RoF, JFE, etc.). Use this skill whenever the user wants to: - systematically analyze an empirical economics paper - apply the 五问框架 (five-question framework) to a paper - extract transferable research design elements from a top-journal paper - understand a paper's identification strategy, estimand, or robustness logic - run /five-questions, /five-q, or /paper-five-q-analysis - \"帮我做五问分析\", \"用五问框架分析这篇论文\", \"analyze this paper with the five-question framework\"","p":"skills/68-research-productivity-skills/five-questions/SKILL.md"},{"n":"fix-chinese","c":"68-research-productivity-skills","d":"PROACTIVE SKILL — automatically apply whenever writing, generating, or editing any text that is mainly in Chinese. No user trigger needed. Also use when the user explicitly asks to \"fix Chinese\", \"修改中文\", \"去翻译腔\", \"去AI味\", \"fix Chinese formatting\", or \"review Chinese text\". Eliminates AI-sounding expressions and translation artifacts. Enforces Chinese-English mixed formatting rules (spacing, punctuation, bold formatting).","p":"skills/68-research-productivity-skills/fix-chinese/SKILL.md"},{"n":"literature-survey-generator","c":"68-research-productivity-skills","d":"Generate a complete academic literature survey from scratch using multi-agent orchestration. Searches academic databases (OpenAlex, CrossRef, Unpaywall), downloads PDFs, builds BibTeX, drafts a LaTeX review, compiles it, reviews for quality, and revises based on feedback — all automated. Use this skill whenever the user asks to \"generate a literature review\", \"write a survey paper\", \"review recent papers on [topic]\", \"create a survey of [field]\", \"综述\", \"文献综述\", \"survey papers in top journals\", or wants a multi-agent pipeline to produce a publishable-quality literature review. Also trigger when the user wants to search multiple journals for papers on a topic and synthesize findings into a structured document. Works for any academic field but optimized for economics journals.","p":"skills/68-research-productivity-skills/literature-survey-generator/SKILL.md"},{"n":"markitdown","c":"68-research-productivity-skills","d":"Convert various file formats (PDF, Office documents, images, audio, web content, structured data) to Markdown optimized for LLM processing. Use when converting documents to markdown, extracting text from PDFs/Office files, transcribing audio, performing OCR on images, extracting YouTube transcripts, or processing batches of files. Supports 20+ formats including DOCX, XLSX, PPTX, PDF, HTML, EPUB, CSV, JSON, images with OCR, and audio with transcription.","p":"skills/68-research-productivity-skills/markitdown/SKILL.md"},{"n":"marp-export","c":"68-research-productivity-skills","d":"Export Marp slide markdown files to PDF (default), HTML, PPTX, or PNG. Handles theme loading, Chrome/Chromium detection for PDF export, and batch conversion. Trigger when user says \"export slides\", \"convert marp to pdf\", \"marp export\", \"slides to pdf\", \"slides to html\", \"导出slides\", \"slides转pdf\", \"导出演示文稿\".","p":"skills/68-research-productivity-skills/marp-export/SKILL.md"},{"n":"marp-slides-creator","c":"68-research-productivity-skills","d":"专业Marp演示文稿制作助手。支持完整工作流程：工作空间初始化、内容分析、slides制作、多维度审阅、中文语言规范审阅（中文演示文稿）、PNG转换检查、终稿确定。所有产出物集中管理在项目工作文件夹中。当用户提到\"制作slides\"、\"做PPT\"、\"演示文稿\"、\"Marp\"、\"幻灯片\"、\"presentation\"等关键词时自动启用。Professional Marp presentation assistant with complete workflow: workspace initialization, content analysis, slide creation, multi-dimensional review, Chinese language review (for Chinese presentations), PNG conversion check, and finalization. All outputs organized in project workspace.","p":"skills/68-research-productivity-skills/marp-slides-creator/SKILL.md"},{"n":"md-to-docx","c":"68-research-productivity-skills","d":"Convert Markdown files to Word documents (.docx) with proper formatting, Chinese font support (FangSong for all text including headings), black font color, 1.5x line spacing, precise first-line indent (24pt), heading spacing after (1 line), no italic headings, and automatic superscript conversion for citation numbers. Use when converting .md files to .docx, creating Word documents from markdown, or when user mentions Word, DOCX, or document conversion. Requires pandoc.","p":"skills/68-research-productivity-skills/md-to-docx/SKILL.md"},{"n":"nber-working-papers-api","c":"68-research-productivity-skills","d":"Access NBER working papers and economic research datasets","p":"skills/68-research-productivity-skills/nber-working-papers-api/SKILL.md"},{"n":"skill-creator","c":"68-research-productivity-skills","d":"Create new skills, modify and improve existing skills, and measure skill performance. Use when users want to create a skill from scratch, edit, or optimize an existing skill, run evals to test a skill, benchmark skill performance with variance analysis, or optimize a skill's description for better triggering accuracy.","p":"skills/68-research-productivity-skills/skill-creator/SKILL.md"},{"n":"unpaywall-api","c":"68-research-productivity-skills","d":"Find free legal full-text versions of scholarly articles via Unpaywall","p":"skills/68-research-productivity-skills/unpaywall-api/SKILL.md"},{"n":"web-access","c":"68-research-productivity-skills","d":"所有联网操作必须通过此 skill 处理，包括：搜索、网页抓取、登录后操作、网络交互等。触发场景：用户要求搜索信息、查看网页内容、访问需要登录的网站、操作网页界面、抓取社交媒体内容（小红书、微博、推特等）、读取动态渲染页面、以及任何需要真实浏览器环境的网络任务。","p":"skills/68-research-productivity-skills/web-access/SKILL.md"},{"n":"web-research","c":"68-research-productivity-skills","d":"Searches multiple web sources, synthesizes findings, and produces cited research reports using delegated subagents. Use when the user asks to research
